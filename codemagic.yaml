workflows:
  ios-ipa:
    name: SEN GP iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key integration you add under
      # Codemagic → Team settings → Integrations → Apple Developer Portal.
      # Rename here to match whatever you call it there.
      app_store_connect: codemagic
    environment:
      ios_signing:
        # app_store = TestFlight / App Store distribution (no device UDIDs needed).
        distribution_type: app_store
        bundle_identifier: com.sengp.app
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    # Manual trigger only (no `triggering:` block) — start builds from the
    # Codemagic dashboard ("Start new build") so a push doesn't auto-build iOS.
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm install

      - name: Build web assets (www)
        script: |
          cd frontend
          npm run build

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios

      - name: Patch Info.plist (camera/mic/location/photos + sengp:// scheme)
        script: |
          cd frontend
          node scripts/patch-ios.js

      - name: Sync Capacitor (copies web assets, installs pods)
        script: |
          cd frontend
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd frontend/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ahatcisse@gmail.com
        notify:
          success: true
          failure: true
