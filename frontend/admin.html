<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Administration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; min-height: 100vh;
        }
        a { color: #4ECDC4; }
        button { font-family: inherit; cursor: pointer; }

        /* Login gate */
        #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card {
            width: 100%; max-width: 380px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px;
        }
        .login-card h1 { font-size: 22px; margin-bottom: 6px; }
        .login-card p { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 20px; }
        .field { margin-bottom: 14px; }
        .field label { display:block; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: #fff; color: #1a1a2e; font-size: 14px;
        }
        .btn-primary {
            width: 100%; padding: 13px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px;
            background: linear-gradient(135deg,#FF6B6B,#FFE66D); color:#1a1a2e;
        }
        .btn-primary:disabled { opacity:.6; }

        /* App shell */
        #app { display: none; }
        .topbar {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding: 14px 20px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top:0; z-index:5;
            backdrop-filter: blur(10px);
        }
        .topbar h1 { font-size: 18px; }
        .topbar .who { font-size: 12px; color: rgba(255,255,255,0.6); }
        .btn-logout {
            padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08); color:#fff; font-size: 13px;
        }
        .layout { display: flex; min-height: calc(100vh - 57px); }
        .sidebar {
            width: 190px; flex-shrink: 0; padding: 14px 10px; border-right: 1px solid rgba(255,255,255,0.08);
        }
        .nav-link {
            display:flex; align-items:center; gap:10px; padding: 11px 14px; border-radius: 10px;
            color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 600; margin-bottom: 4px;
        }
        .nav-link.active { background: rgba(255,215,0,0.15); color: #FFD700; }
        .main { flex: 1; padding: 20px; overflow-x: auto; }

        /* Stats cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 12px; margin-bottom: 8px; }
        .stat {
            background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 16px;
        }
        .stat .label { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .stat .value { font-size: 24px; font-weight: 800; }
        .stat .sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .section-title { font-size: 16px; font-weight: 700; margin: 18px 0 12px; }

        /* Toolbar */
        .toolbar { display:flex; gap:10px; margin-bottom: 12px; flex-wrap: wrap; }
        .toolbar input, .toolbar select {
            padding: 9px 12px; border-radius: 10px; border:1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08); color:#fff; font-size: 13px;
        }
        .toolbar input { min-width: 200px; }
        .toolbar button {
            padding: 9px 14px; border-radius: 10px; border:none; background:#4ECDC4; color:#06302c; font-weight:700; font-size:13px;
        }

        /* Table */
        .table-wrap { overflow-x: auto; border:1px solid rgba(255,255,255,0.08); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
        th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
        th { color: rgba(255,255,255,0.55); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .badge { padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .b-green { background: rgba(76,175,80,.2); color:#7ee081; }
        .b-yellow { background: rgba(255,215,0,.18); color:#FFD700; }
        .b-red { background: rgba(255,107,107,.2); color:#ff8f8f; }
        .b-blue { background: rgba(78,205,196,.2); color:#4ECDC4; }
        .b-gray { background: rgba(255,255,255,.12); color:#ccc; }
        .row-actions { display:flex; gap:6px; }
        .act {
            padding: 6px 10px; border-radius: 8px; border:none; font-size: 12px; font-weight: 600;
        }
        .act-edit { background: rgba(78,205,196,.2); color:#4ECDC4; }
        .act-del { background: rgba(255,107,107,.2); color:#ff8f8f; }
        .act-ok { background: rgba(76,175,80,.25); color:#7ee081; }
        .empty, .loading { text-align:center; padding: 40px; color: rgba(255,255,255,0.5); }
        .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:13px; }
        .pager button { padding:7px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); color:#fff; }
        .pager button:disabled { opacity:.4; }

        /* Toast notifications (replaces alert) */
        #toasts { position: fixed; top: 16px; right: 16px; z-index: 10000; display:flex; flex-direction:column; gap:10px; max-width: 340px; }
        .toast {
            padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            background: rgba(30,30,52,0.96); border:1px solid rgba(255,255,255,0.15); color:#fff;
            box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .2s ease;
        }
        .toast.ok { border-left: 4px solid #7ee081; }
        .toast.err { border-left: 4px solid #ff8f8f; }
        .toast.info { border-left: 4px solid #4ECDC4; }
        @keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform:none; } }
        @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

        /* Modal */
        .modal-ov {
            position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
            display:flex; align-items:center; justify-content:center; z-index: 9999; padding: 20px;
        }
        .modal {
            background:#1b1838; border:1px solid rgba(255,255,255,.12); border-radius:16px;
            padding: 24px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y:auto;
        }
        .modal h3 { font-size: 17px; margin-bottom: 6px; }
        .modal .hint { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 16px; }
        .modal label { display:block; font-size:12px; color:rgba(255,255,255,.7); margin: 12px 0 6px; }
        .modal input, .modal select, .modal textarea {
            width:100%; padding: 10px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08); color:#fff; font-size:14px; font-family:inherit;
        }
        .modal-actions { display:flex; gap:10px; margin-top: 20px; }
        .modal-actions button { flex:1; padding: 11px; border-radius:10px; font-weight:700; border:none; font-size:14px; }
        .btn-cancel { background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15) !important; color: rgba(255,255,255,.8); }
        .btn-confirm { background: linear-gradient(135deg,#FFD700,#FFA500); color:#1a1a2e; }
        .btn-danger { background: rgba(255,107,107,.9); color:#fff; }

        /* Permission chips (roles UI) */
        .perm-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:6px; }
        .perm-chip {
            display:flex; align-items:center; gap:7px; font-size:12px; color:rgba(255,255,255,.75);
            padding:7px 9px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
        }
        .perm-chip input { width:auto; }
        .role-card {
            background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px;
            padding: 16px 18px; margin-bottom: 12px;
        }
        .role-card .rc-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
        .role-card .rc-head h4 { font-size:15px; }
        .role-card .rc-perms { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .tag { font-size:11px; padding:3px 8px; border-radius:7px; background:rgba(78,205,196,.15); color:#4ECDC4; font-family: ui-monospace, monospace; }
        .tag.all { background: rgba(255,215,0,.18); color:#FFD700; }

        @media (max-width: 720px) {
            .sidebar { width: 64px; }
            .nav-link span { display:none; }
            .nav-link { justify-content:center; }
        }
    </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SEN GP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script src="pwa.js" defer></script>
</head>
<body class="ds">
    <div id="toasts"></div>
    <!-- LOGIN -->
    <div id="login">
        <div class="login-card">
            <h1>Administration SEN GP</h1>
            <p>Accès réservé aux administrateurs.</p>
            <form id="loginForm">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@email.com">
                </div>
                <div class="field">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button class="btn-primary" type="submit" id="loginBtn">Se connecter</button>
                <p id="loginErr" style="color:#ff8f8f; margin-top:12px; display:none;"></p>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="app">
        <div class="topbar">
            <h1>🛠️ Administration</h1>
            <div style="display:flex;align-items:center;gap:12px;">
                <span class="who" id="who"></span>
                <button class="btn-logout" onclick="logout()">Déconnexion</button>
            </div>
        </div>
        <div class="layout">
            <div class="sidebar">
                <div class="nav-link active" data-view="overview" onclick="switchView('overview',this)">📊 <span>Vue globale</span></div>
                <div class="nav-link" data-view="users" data-perm="users:read" onclick="switchView('users',this)">👥 <span>Utilisateurs</span></div>
                <div class="nav-link" data-view="kyc" data-perm="users:verify" onclick="switchView('kyc',this)">🪪 <span>Vérification KYC</span></div>
                <div class="nav-link" data-view="missions" data-perm="missions:read" onclick="switchView('missions',this)">📦 <span>Missions</span></div>
                <div class="nav-link" data-view="trips" data-perm="trips:read" onclick="switchView('trips',this)">✈️ <span>Trajets</span></div>
                <div class="nav-link" data-view="payments" data-perm="payments:read" onclick="switchView('payments',this)">💳 <span>Paiements</span></div>
                <div class="nav-link" data-view="withdrawals" data-perm="withdrawals:read" onclick="switchView('withdrawals',this)">💸 <span>Retraits</span></div>
                <div class="nav-link" data-view="claims" data-perm="claims:read" onclick="switchView('claims',this)">📝 <span>Réclamations</span></div>
                <div class="nav-link" data-view="reviews" data-perm="reviews:read" onclick="switchView('reviews',this)">⭐ <span>Avis</span></div>
                <div class="nav-link" data-view="roles" data-perm="roles:read" onclick="switchView('roles',this)">🛡️ <span>Rôles &amp; Admins</span></div>
                <div class="nav-link" data-view="audit" data-perm="audit:read" onclick="switchView('audit',this)">🧾 <span>Journal d'audit</span></div>
            </div>
            <div class="main" id="main"></div>
        </div>
    </div>

    <script>
        // Admin is a web tool used against production. When opened as a local file
        // (file://) or on localhost, talk to the deployed API directly; otherwise
        // use the runtime-resolved base (same-origin when served by the backend).
        const PROD_API = 'https://2txjgdd3cj.us-east-1.awsapprunner.com/api/v1';
        const _h = location.hostname;
        const API = (location.protocol === 'file:' || _h === 'localhost' || _h === '127.0.0.1' || _h === '')
            ? PROD_API
            : (window.API_BASE_URL || '/api/v1');
        let token = localStorage.getItem('authToken');
        let me = null;
        try { me = JSON.parse(localStorage.getItem('userData') || 'null'); } catch (e) {}

        const state = { view: 'overview', page: 1, search: '', status: '' };
        let myPerms = null;   // string[] of the signed-in admin's permissions (['*'] = all)
        let allPerms = [];    // full catalog, for the role editor

        // Does the current admin hold a permission? Supports '*' and 'resource:*'.
        function can(required){
            if (!myPerms) return false;
            if (myPerms.includes('*')) return true;
            if (myPerms.includes(required)) return true;
            return myPerms.includes(required.split(':')[0] + ':*');
        }

        // ---------- Toast (replaces alert) ----------
        function toast(msg, kind){
            const box = document.getElementById('toasts');
            const t = document.createElement('div');
            t.className = 'toast ' + (kind || 'info');
            t.textContent = msg;
            box.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 3600);
        }
        // Report an API result: ok → success toast, else → error toast.
        function notify(ok, okMsg, json){
            if (ok) toast(okMsg, 'ok');
            else toast((json && (json.error||json.message)) || 'Erreur', 'err');
        }

        // ---------- Modal helpers (replace confirm/prompt) ----------
        function closeModal(){ const m = document.getElementById('modalOv'); if (m) m.remove(); }
        function openModal(innerHtml){
            closeModal();
            const ov = document.createElement('div');
            ov.id = 'modalOv'; ov.className = 'modal-ov';
            ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + innerHtml + '</div>';
            ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
            document.body.appendChild(ov);
            return ov;
        }
        // Promise-based confirm dialog.
        function confirmDialog(message, opts){
            opts = opts || {};
            return new Promise(resolve => {
                const ov = openModal(
                    '<h3>' + esc(opts.title || 'Confirmation') + '</h3>'
                  + '<p class="hint">' + esc(message) + '</p>'
                  + '<div class="modal-actions">'
                  + '<button class="btn-cancel" id="mCancel">Annuler</button>'
                  + '<button class="' + (opts.danger ? 'btn-danger' : 'btn-confirm') + '" id="mOk">' + esc(opts.confirmLabel || 'Confirmer') + '</button>'
                  + '</div>');
                ov.querySelector('#mCancel').onclick = () => { closeModal(); resolve(false); };
                ov.querySelector('#mOk').onclick = () => { closeModal(); resolve(true); };
            });
        }

        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function fcfa(n){ return (Number(n)||0).toLocaleString('fr-FR') + ' FCFA'; }
        function dt(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
        function api(path, opts){
            opts = opts || {};
            opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {});
            return fetch(API + path, opts).then(async r => {
                const j = await r.json().catch(() => ({}));
                // 401 = invalid/expired session → sign out. 403 = authenticated but
                // lacks the permission → surface as a normal error, keep the session.
                if (r.status === 401) { logout(); throw new Error(j.error || 'Session expirée'); }
                return { ok: r.ok, json: j, status: r.status };
            });
        }

        function badgeFor(status){
            const s = String(status||'').toLowerCase();
            if (['completed','delivered','approved','verified','active','resolved'].includes(s)) return 'b-green';
            if (['pending','processing','open','published','accepted','in_transit','investigating'].includes(s)) return 'b-yellow';
            if (['failed','cancelled','rejected','suspended','closed'].includes(s)) return 'b-red';
            return 'b-gray';
        }

        // ---------- Auth ----------
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginErr');
            err.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Connexion…';
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const j = await res.json();
                if (!res.ok || !j.success) throw new Error(j.error || j.message || 'Connexion échouée');
                if (j.data.user.user_type !== 'admin') throw new Error('Ce compte n\'est pas administrateur.');
                token = j.data.token; me = j.data.user;
                localStorage.setItem('authToken', token);
                localStorage.setItem('userData', JSON.stringify(me));
                showApp();
            } catch (e2) {
                err.textContent = e2.message; err.style.display = 'block';
            } finally { btn.disabled = false; btn.textContent = 'Se connecter'; }
        });

        function logout(){
            localStorage.removeItem('authToken'); localStorage.removeItem('userData');
            token = null; me = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('login').style.display = 'flex';
        }

        async function showApp(){
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('who').textContent = me ? (me.first_name + ' ' + me.last_name + ' · ' + me.email) : '';
            await loadPermissions();
            applyPermissionGates();
            switchView('overview', document.querySelector('.nav-link'));
        }

        // Fetch the signed-in admin's permission list (drives section visibility).
        // Falls back to full access ('*') when the endpoint is unavailable — e.g. an
        // older backend that predates RBAC (404), or a transient error — so the
        // dashboard stays usable. The backend still enforces every action, so this
        // only affects which buttons are shown, never what actually succeeds.
        async function loadPermissions(){
            try {
                const { ok, json, status } = await api('/admin/me/permissions');
                if (ok && json.data && Array.isArray(json.data.permissions)) {
                    myPerms = json.data.permissions;
                } else {
                    // 404 = backend has no RBAC yet; any other failure = don't lock the UI.
                    myPerms = ['*'];
                }
            } catch (e) { myPerms = ['*']; }
        }
        // Hide sidebar sections the admin has no permission for.
        function applyPermissionGates(){
            document.querySelectorAll('.nav-link[data-perm]').forEach(el => {
                el.style.display = can(el.getAttribute('data-perm')) ? '' : 'none';
            });
        }

        function switchView(view, el){
            state.view = view; state.page = 1; state.search = ''; state.status = '';
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            if (el) el.classList.add('active');
            render();
        }

        // ---------- Views ----------
        async function render(){
            const main = document.getElementById('main');
            if (state.view === 'overview') return renderOverview(main);
            if (state.view === 'roles') return renderRoles(main);
            if (state.view === 'kyc') return renderKyc(main);
            let extra = '';
            if (state.view === 'users' && can('users:write'))
                extra = `<button style="margin-left:auto;background:#7ee081;color:#06302c" onclick="createUserModal()">+ Créer un utilisateur</button>`;
            else if (state.view === 'payments' && can('payments:export'))
                extra = `<button style="margin-left:auto" onclick="exportCsv('payments')">⬇ Exporter CSV</button>`;
            else if (state.view === 'withdrawals')
                extra = `<button style="margin-left:auto" onclick="exportCsv('withdrawals')">⬇ Exporter CSV</button>`;
            main.innerHTML = `
                <div class="toolbar">
                    <input id="search" placeholder="Rechercher…" value="${esc(state.search)}">
                    ${statusFilter()}
                    <button onclick="applyFilters()">Filtrer</button>
                    ${extra}
                </div>
                <div id="tableArea"><div class="loading">Chargement…</div></div>
                <div class="pager" id="pager"></div>`;
            document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });
            loadList();
        }

        function statusFilter(){
            const opts = {
                users: ['', 'pending','verified','suspended'],
                missions: ['', 'pending','accepted','in_transit','delivered','cancelled'],
                trips: ['', 'draft','published','active','completed','cancelled'],
                payments: ['', 'pending','completed','failed'],
                withdrawals: ['', 'pending','approved','rejected','completed'],
                claims: ['', 'open','investigating','resolved','closed']
            }[state.view];
            if (!opts) return '';
            return `<select id="status">${opts.map(o => `<option value="${o}"${o===state.status?' selected':''}>${o||'Tous les statuts'}</option>`).join('')}</select>`;
        }

        function applyFilters(){
            state.search = (document.getElementById('search')||{}).value || '';
            const sEl = document.getElementById('status');
            state.status = sEl ? sEl.value : '';
            state.page = 1;
            loadList();
        }

        async function renderOverview(main){
            main.innerHTML = '<div class="loading">Chargement des statistiques…</div>';
            try {
                const { ok, json } = await api('/admin/stats');
                if (!ok) throw new Error(json.error || 'Erreur');
                const s = json.data;
                main.innerHTML = `
                    <div class="section-title">Utilisateurs</div>
                    <div class="stats-grid">
                        ${card('Total', s.users.total)}
                        ${card('Expéditeurs', s.users.expediteurs)}
                        ${card('Gros Porteurs', s.users.gps)}
                        ${card('Admins', s.users.admins)}
                        ${card('Suspendus', s.users.suspended)}
                    </div>
                    <div class="section-title">Missions</div>
                    <div class="stats-grid">
                        ${card('Total', s.missions.total)}
                        ${card('En attente', s.missions.pending)}
                        ${card('Acceptées', s.missions.accepted)}
                        ${card('En transit', s.missions.in_transit)}
                        ${card('Livrées', s.missions.delivered)}
                        ${card('Annulées', s.missions.cancelled)}
                    </div>
                    <div class="section-title">Finances</div>
                    <div class="stats-grid">
                        ${card('Volume (payé)', fcfa(s.payments.gross_volume))}
                        ${card('Commissions', fcfa(s.payments.commission_total))}
                        ${card('Paiements OK', s.payments.completed_count)}
                        ${card('Retraits en attente', s.withdrawals.pending, fcfa(s.withdrawals.pending_amount))}
                        ${card('Trajets', s.trips.total)}
                        ${card('Réclamations ouvertes', s.claims.open)}
                    </div>`;
            } catch (e) {
                main.innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`;

        }
        function card(label, value, sub){
            return `<div class="stat"><div class="label">${label}</div><div class="value">${esc(value)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`;
        }

        async function loadList(){
            const area = document.getElementById('tableArea');
            area.innerHTML = '<div class="loading">Chargement…</div>';
            const q = `?page=${state.page}&limit=20`
                + (state.search ? `&search=${encodeURIComponent(state.search)}` : '')
                + (state.status ? `&status=${encodeURIComponent(state.status)}` : '');
            try {
                const { ok, json } = await api('/admin/' + state.view + q);
                if (!ok) throw new Error(json.error || 'Erreur');
                const rows = json.data || [];
                area.innerHTML = renderTable(state.view, rows);
                renderPager(json.meta || json.pagination);
            } catch (e) {
                area.innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`;
            }
        }

        function renderPager(p){
            const pager = document.getElementById('pager');
            if (!p) { pager.innerHTML=''; return; }
            const totalPages = p.totalPages || 1;
            pager.innerHTML = `
                <span>Page ${p.page||state.page} / ${totalPages} · ${p.total||0} éléments</span>
                <button ${(p.page||1)<=1?'disabled':''} onclick="goPage(${(p.page||1)-1})">←</button>
                <button ${(p.page||1)>=totalPages?'disabled':''} onclick="goPage(${(p.page||1)+1})">→</button>`;
        }
        function goPage(n){ state.page = n; (state.view === 'kyc' ? loadKyc() : loadList()); }

        function renderTable(view, rows){
            if (!rows.length) return '<div class="empty">Aucun élément.</div>';
            const defs = {
                users: {
                    head: ['Nom','Email','Type','Statut','Ville','Inscrit','Actions'],
                    row: u => {
                        const acts = [];
                        acts.push(['act-edit','Détails',`showUserDetail('${u.id}')`]);
                        if (can('users:write')) acts.push(['act-edit','Éditer',`editUser('${u.id}')`]);
                        if (can('roles:manage')) acts.push(['act-ok','Rôle',`assignRole('${u.id}','${esc(u.email)}')`]);
                        if (can('users:delete')) acts.push(['act-del','Suppr.',`delUser('${u.id}','${esc(u.email)}')`]);
                        return [
                        esc(u.first_name+' '+u.last_name), esc(u.email),
                        `<span class="badge b-blue">${esc(u.user_type)}</span>`,
                        `<span class="badge ${badgeFor(u.status)}">${esc(u.status)}</span>`,
                        esc(u.city||'—'), dt(u.created_at),
                        actions(acts)
                    ]; }
                },
                missions: {
                    head: ['Code','Trajet','Prix','Statut','Expéditeur','GP','Actions'],
                    row: m => {
                        const acts = [];
                        acts.push(['act-edit','Détails',`showMissionDetail('${m.id}')`]);
                        // Only unassigned, still-pending missions can be assigned to a GP.
                        if (m.status === 'pending' && !m.gp_name && can('missions:assign')) {
                            acts.push(['act-ok','Affecter',`assignMission('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        // An already-assigned mission can be moved to another GP.
                        if (m.gp_name && can('missions:assign')) {
                            acts.push(['act-ok','Réassigner',`reassignMissionUI('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        // GP arrived at destination, awaiting the admin's confirmation.
                        if (m.status === 'out_for_delivery' && !m.arrival_confirmed && can('missions:write')) {
                            acts.push(['act-ok','Confirmer arrivée',`confirmArrival('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        if (can('missions:write')) acts.push(['act-edit','Statut',`editMission('${m.id}','${esc(m.status)}')`]);
                        if (can('missions:delete')) acts.push(['act-del','Suppr.',`delMission('${m.id}','${esc(m.mission_code)}')`]);
                        return [
                            esc(m.mission_code), esc((m.departure_city||'?')+' → '+(m.arrival_city||'?')),
                            fcfa(m.price), `<span class="badge ${badgeFor(m.status)}">${esc(m.status)}</span>`,
                            esc(m.expediteur_name||'—'), esc(m.gp_name||'—'),
                            actions(acts)
                        ];
                    }
                },
                trips: {
                    head: ['Code','Trajet','GP','Départ','Statut','Colis','Actions'],
                    row: t => {
                        const acts = [['act-edit','Détails',`showTripDetail('${t.id}')`]];
                        if (can('trips:write')) acts.push(['act-edit','Modérer',`moderateTrip('${t.id}','${esc(t.status)}')`]);
                        if (can('trips:delete')) acts.push(['act-del','Suppr.',`delTrip('${t.id}','${esc(t.trip_code)}')`]);
                        return [
                        esc(t.trip_code), esc((t.departure_city||'?')+' → '+(t.arrival_city||'?')),
                        esc(t.gp_name||'—'), dt(t.departure_date),
                        `<span class="badge ${badgeFor(t.status)}">${esc(t.status)}</span>`,
                        `${t.current_packages||0}/${t.max_packages||0}`,
                        actions(acts)
                    ]; }
                },
                payments: {
                    head: ['Code','Montant','Commission','Net','Méthode','Statut','Payeur','Bénéf.','Date','Actions'],
                    row: p => [
                        esc(p.payment_code), fcfa(p.amount), fcfa(p.commission), fcfa(p.net_amount),
                        esc(p.payment_method), `<span class="badge ${badgeFor(p.status)}">${esc(p.status)}</span>`,
                        esc(p.payer_name||'—'), esc(p.payee_name||'—'), dt(p.created_at),
                        actions((p.status==='completed' && can('payments:refund')) ? [['act-del','Rembourser',`refundPayment('${p.id}','${esc(p.payment_code)}')`]] : [])
                    ]
                },
                withdrawals: {
                    head: ['Code','GP','Montant','Méthode','Compte','Statut','Actions'],
                    row: w => {
                        const acts = [];
                        if (w.status==='pending') {
                            if (can('withdrawals:approve')) { acts.push(['act-ok','Approuver',`approveW('${w.id}')`]); acts.push(['act-del','Rejeter',`rejectW('${w.id}')`]); }
                        } else if (w.status==='approved') {
                            if (can('withdrawals:payout')) acts.push(['act-ok','Marquer payé',`payW('${w.id}')`]);
                            if (can('withdrawals:approve')) acts.push(['act-del','Rejeter',`rejectW('${w.id}')`]);
                        } else if (w.status==='completed' && w.external_reference) {
                            acts.push(['act-edit','Réf: '+String(w.external_reference).slice(0,14),`void 0`]);
                        }
                        return [
                        esc(w.withdrawal_code), esc(w.gp_name||w.gp_id||'—'), fcfa(w.amount),
                        esc(w.withdrawal_method), esc(w.account_number||'—'),
                        `<span class="badge ${badgeFor(w.status)}">${esc(w.status)}</span>`,
                        acts.length ? actions(acts) : '—'
                    ]; }
                },
                claims: {
                    head: ['Code','Type','Priorité','Statut','Demandeur','Message','Actions'],
                    row: c => {
                        const ev = (c.evidence_urls || []).filter(Boolean);
                        const audio = ev.length ? `<button class="act act-ok" onclick="playEvidence('${encodeURIComponent(ev[0])}')">🔊 Vocal</button>` : '';
                        const msg = `<div style="max-width:240px;white-space:normal;">${esc(c.description||'—')}</div>${audio}`;
                        return [
                            esc(c.claim_code), esc(c.claim_type),
                            `<span class="badge ${badgeFor(c.priority)}">${esc(c.priority)}</span>`,
                            `<span class="badge ${badgeFor(c.status)}">${esc(c.status)}</span>`,
                            esc(c.claimant_name||'—'),
                            msg,
                            (function(){ const a=[['act-ok','Fil',`showClaimThread('${c.id}')`]]; if(can('claims:write')) a.push(['act-edit','Traiter',`editClaim('${c.id}','${esc(c.status)}')`]); return actions(a); })()
                        ];
                    }
                },
                reviews: {
                    head: ['Note','Commentaire','Type','Auteur','Évalué','Mission','Date','Actions'],
                    row: r => [
                        '⭐'.repeat(Math.max(0,Math.min(5,r.rating||0))) + ` ${r.rating||0}`,
                        `<div style="max-width:260px;white-space:normal">${esc(r.comment||'—')}</div>`,
                        esc(r.review_type||'—'), esc(r.reviewer_name||'—'), esc(r.reviewee_name||'—'),
                        esc(r.mission_code||'—'), dt(r.created_at),
                        actions(can('reviews:moderate') ? [['act-del','Supprimer',`deleteReview('${r.id}')`]] : [])
                    ]
                },
                audit: {
                    head: ['Date','Admin','Action','Entité','Détails'],
                    row: l => [
                        new Date(l.created_at).toLocaleString('fr-FR'),
                        esc(l.admin_name||l.admin_email||'—'),
                        `<span class="tag">${esc(l.action)}</span>`,
                        esc(l.entity_type) + (l.entity_id ? ` <span style="color:rgba(255,255,255,.4)">#${esc(String(l.entity_id).slice(0,8))}</span>` : ''),
                        `<span style="color:rgba(255,255,255,.6)">${esc(l.description || (l.metadata ? JSON.stringify(l.metadata) : '—'))}</span>`
                    ]
                }
            };
            const d = defs[view];
            const body = rows.map(r => `<tr>${d.row(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
            return `<div class="table-wrap"><table><thead><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
        }
        function actions(list){
            return `<div class="row-actions">${list.map(([cls,label,fn])=>`<button class="act ${cls}" onclick="${fn}">${label}</button>`).join('')}</div>`;
        }

        // ---------- Generic form modal (replaces prompt) ----------
        // fields: [{name,label,type:'text|select|textarea',options?,value?,placeholder?}]
        // Resolves to an object of values, or null if cancelled.
        function formModal(cfg){
            return new Promise(resolve => {
                const fieldHtml = cfg.fields.map(f => {
                    if (f.type === 'select') {
                        const opts = f.options.map(o => {
                            const val = Array.isArray(o) ? o[0] : o;
                            const lab = Array.isArray(o) ? o[1] : o;
                            return `<option value="${esc(val)}"${(f.value===val)?' selected':''}>${esc(lab)}</option>`;
                        }).join('');
                        return `<label>${esc(f.label)}</label><select data-f="${esc(f.name)}">${opts}</select>`;
                    }
                    if (f.type === 'textarea') {
                        return `<label>${esc(f.label)}</label><textarea data-f="${esc(f.name)}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`;
                    }
                    return `<label>${esc(f.label)}</label><input data-f="${esc(f.name)}" type="${f.inputType||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}">`;
                }).join('');
                const ov = openModal(
                    '<h3>' + esc(cfg.title) + '</h3>'
                  + (cfg.hint ? '<p class="hint">' + esc(cfg.hint) + '</p>' : '')
                  + fieldHtml
                  + '<div class="modal-actions"><button class="btn-cancel" id="fCancel">Annuler</button>'
                  + '<button class="btn-confirm" id="fOk">' + esc(cfg.confirmLabel||'Enregistrer') + '</button></div>');
                ov.querySelector('#fCancel').onclick = () => { closeModal(); resolve(null); };
                ov.querySelector('#fOk').onclick = () => {
                    const out = {};
                    ov.querySelectorAll('[data-f]').forEach(el => { out[el.getAttribute('data-f')] = el.value; });
                    closeModal(); resolve(out);
                };
            });
        }

                fields: [

                    { name:'phone', label:'Téléphone', value: u.phone || '' },

        // ---------- KYC / Vérification ----------
        async function renderKyc(main){
            main.innerHTML = `
                <div class="toolbar">
                    <input id="search" placeholder="Rechercher…" value="${esc(state.search)}">
                    <button onclick="state.search=(document.getElementById('search').value||'');state.page=1;loadKyc()">Filtrer</button>

        async function loadKyc(){
            const area = document.getElementById('kycArea');
            area.innerHTML = '<div class="loading">Chargement…</div>';
            const q = `?page=${state.page}&limit=20` + (state.search ? `&search=${encodeURIComponent(state.search)}` : '');
            const { ok, json, status } = await api('/admin/kyc/queue' + q);
            if (!ok) { area.innerHTML = `<div class="empty">${status===403?'Accès refusé.':'Erreur.'}</div>`; return; }
            const rows = json.data || [];
            if (!rows.length) { area.innerHTML = '<div class="empty">Aucune pièce en attente de vérification. 🎉</div>'; renderPager(json.meta); return; }
            area.innerHTML = rows.map(u => {
                const imgs = [];

                if (u.identity_document_url_back) imgs.push(`<a href="${esc(u.identity_document_url_back)}" target="_blank"><img src="${esc(u.identity_document_url_back)}" style="width:180px;height:120px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.15)"></a>`);
                return `<div class="role-card">
                    <div class="rc-head">
                        <h4>${esc(u.first_name+' '+u.last_name)}</h4>
                        <span class="badge b-blue">${esc(u.user_type)}</span>
                        <span class="badge b-gray">${esc(u.identity_document_type||'pièce')}</span>
                        <span style="color:rgba(255,255,255,.5);font-size:12px">${esc(u.email)} · ${esc(u.phone||'—')}</span>
                    </div>

                    </div>

            }).join('');
            renderPager(json.meta);
        }

        // Assign a pending mission to a GP. The GP is notified and confirms via
        // their notifications page (accept → mission becomes 'accepted'; decline →
        // released back to 'pending'). Backed by POST /admin/missions/:id/assign.
        // Shared GP picker (used by both Affecter and Réassigner). Loads GPs,
        // groups them by destination region, and calls handler(gpId) on confirm.
        let _gpPickHandler = null;
        async function openGpPicker(title, confirmLabel, handler){
            const { ok, json } = await api('/admin/users?user_type=gp&limit=200');
            if (!ok) { toast('Erreur chargement des GPs: '+((json&&(json.error||json.message))||''), 'err'); return; }
            const gps = (json.data || []).filter(g => g.status !== 'suspended');
            if (!gps.length) { toast('Aucun GP disponible.', 'err'); return; }
            const region = (country) => {
                const c = String(country||'').toLowerCase();

        // Download a CSV export (authenticated fetch → blob → download).
        async function exportCsv(kind){
            try {
                const q = (state.status ? `?status=${encodeURIComponent(state.status)}` : '') + (state.search ? `${state.status?'&':'?'}search=${encodeURIComponent(state.search)}` : '');
                const res = await fetch(API + '/admin/' + kind + '/export' + q, { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) { toast('Export refusé ('+res.status+')', 'err'); return; }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = kind + '.csv';
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
                toast('Export téléchargé', 'ok');
            } catch (e) { toast('Erreur export', 'err'); }
        }

            const permBoxes = isSystem ? '' : (
                '<label>Permissions</label>'
              + '<div class="perm-grid">'
              + allPerms.map(p => `<label class="perm-chip"><input type="checkbox" data-perm value="${esc(p)}"${(all||cur.has(p))?' checked':''}> ${esc(p)}</label>`).join('')
              + '</div>');
            const ov = openModal(
                '<h3>' + (id ? 'Éditer le rôle' : 'Nouveau rôle') + '</h3>'
              + (isSystem ? '<p class="hint">Rôle système : les permissions sont gérées dans le code. Vous pouvez modifier le nom et la description.</p>' : '')
              + '<label>Nom</label><input id="roleName" value="' + esc((role&&role.name)||'') + '" placeholder="Ex. Modérateur">'
              + '<label>Description</label><input id="roleDesc" value="' + esc((role&&role.description)||'') + '" placeholder="Rôle et responsabilités">'
              + permBoxes
              + '<div class="modal-actions"><button class="btn-cancel" id="rCancel">Annuler</button>'
              + '<button class="btn-confirm" id="rOk">' + (id ? 'Enregistrer' : 'Créer') + '</button></div>');
            ov.querySelector('#rCancel').onclick = closeModal;
            ov.querySelector('#rOk').onclick = async () => {
                const name = ov.querySelector('#roleName').value.trim();
                const description = ov.querySelector('#roleDesc').value.trim();
                if (!name) { toast('Le nom est requis', 'err'); return; }
                const body = { name, description };
                if (!isSystem) body.permissions = [...ov.querySelectorAll('[data-perm]:checked')].map(c => c.value);
                let res;
                if (id) res = await api('/admin/roles/'+id, { method:'PUT', body: JSON.stringify(body) });
                else res = await api('/admin/roles', { method:'POST', body: JSON.stringify(body) });
                if (res.ok) { closeModal(); toast(id ? 'Rôle mis à jour' : 'Rôle créé', 'ok'); renderRoles(document.getElementById('main')); }
                else toast((res.json && (res.json.error||res.json.message)) || 'Erreur', 'err');
            };
        }
        async function deleteRole(id, name){
            if (!await confirmDialog('Supprimer le rôle « ' + name + ' » ?', { danger:true, confirmLabel:'Supprimer', title:'Supprimer le rôle' })) return;
            const { ok, json } = await api('/admin/roles/'+id, { method:'DELETE' });
            notify(ok, 'Rôle supprimé', json); if (ok) renderRoles(document.getElementById('main'));
        }
        // Assign an admin role to a user (promotes them to admin).
        async function assignRole(userId, email){
            const { ok, json } = await api('/admin/roles');
            if (!ok) { toast('Impossible de charger les rôles', 'err'); return; }
            const roles = json.data || [];
            const v = await formModal({
                title: 'Attribuer un rôle admin',
                hint: 'À ' + email + '. L\'utilisateur devient administrateur avec les permissions du rôle.',
                fields: [{ name:'role_id', label:'Rôle', type:'select', options: roles.map(r => [r.id, r.name + (r.is_system?' (système)':'')]) }],
                confirmLabel: 'Attribuer'
            });
            if (!v || !v.role_id) return;
            const res = await api('/admin/users/'+userId+'/role', { method:'PUT', body: JSON.stringify({ role_id: v.role_id }) });
            notify(res.ok, 'Rôle attribué', res.json); if (res.ok) loadList();
        }

        // ---------- Boot ----------
        if (token && me && me.user_type === 'admin') showApp();
    </script>
</body>
</html>
