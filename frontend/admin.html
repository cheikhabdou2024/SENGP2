<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Administration</title>
    <style>
        :root {
            --bg: #0a0e1a; --bg2: #0d1120; --surface: #141a2e; --surface2: #1a2138;
            --border: rgba(255,255,255,.07); --border2: rgba(255,255,255,.12);
            --ink: #eef1f8; --muted: rgba(233,238,250,.62); --faint: rgba(233,238,250,.4);
            --accent: #6366f1; --accent2: #8b5cf6; --accent-soft: rgba(99,102,241,.16);
            --good: #34d399; --warn: #fbbf24; --bad: #fb7185; --info: #38bdf8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--ink); min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent2); text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }

        /* Login gate */
        #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: radial-gradient(1200px 600px at 30% -10%, rgba(99,102,241,.14), transparent), var(--bg); }
        .login-card {
            width: 100%; max-width: 380px; background: var(--surface);
            border: 1px solid var(--border2); border-radius: 20px; padding: 32px;
            box-shadow: 0 24px 60px rgba(0,0,0,.5);
        }
        .login-card h1 { font-size: 22px; margin-bottom: 6px; }
        .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
        .field { margin-bottom: 14px; }
        .field label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border2);
            background: rgba(255,255,255,.06); color: var(--ink); font-size: 14px;
        }
        .btn-primary {
            width: 100%; padding: 13px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px;
            background: linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
        }
        .btn-primary:disabled { opacity:.6; }

        /* App shell */
        #app { display: none; }
        .layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 232px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .brand { display:flex; align-items:center; gap:11px; padding: 18px 18px 14px; }
        .brand-logo { width:34px; height:34px; border-radius:10px; background: linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:#fff; flex-shrink:0; }
        .brand-name { font-weight:800; font-size:15px; line-height:1.1; }
        .brand-sub { font-size:11px; color:var(--faint); }
        .side-nav { flex:1; padding: 6px 12px 12px; }
        .nav-section { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
            margin: 16px 12px 6px; font-weight:700; }
        .nav-link {
            display:flex; align-items:center; gap:11px; padding: 9px 12px; border-radius: 10px;
            color: var(--muted); font-size: 13.5px; font-weight: 600; margin-bottom: 2px; position: relative;
            transition: background .12s, color .12s;
        }
        .nav-link svg { width:18px; height:18px; flex-shrink:0; stroke: currentColor; }
        .nav-link:hover { background: rgba(255,255,255,.04); color: var(--ink); }
        .nav-link.active { background: var(--accent-soft); color: #fff; }
        .nav-link.active::before { content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px;
            border-radius:0 3px 3px 0; background: var(--accent); }
        .side-foot { padding: 12px; border-top: 1px solid var(--border); }
        .user-chip { display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; background: var(--surface); }
        .avatar { width:34px; height:34px; border-radius:10px; background: linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; flex-shrink:0; }
        .user-chip .u-name { font-size:13px; font-weight:700; line-height:1.1; }
        .user-chip .u-mail { font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }

        /* Topbar */
        .content { flex:1; min-width:0; display:flex; flex-direction:column; }
        .topbar {
            display:flex; align-items:center; gap:14px; padding: 12px 26px;
            border-bottom: 1px solid var(--border); position: sticky; top:0; z-index:20;
            background: rgba(10,14,26,.82); backdrop-filter: blur(12px);
        }
        .search { flex:1; max-width:420px; position:relative; }
        .search input { width:100%; padding: 9px 12px 9px 34px; border-radius:10px; border:1px solid var(--border2);
            background: rgba(255,255,255,.05); color:var(--ink); font-size:13px; }
        .search::before { content:'🔍'; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:12px; opacity:.6; }
        .top-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
        .icon-btn { width:38px; height:38px; border-radius:10px; border:1px solid var(--border2); background: var(--surface);
            color: var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; position:relative; }
        .icon-btn:hover { color: var(--ink); border-color: var(--accent); }
        .icon-btn .dot { position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%; background: var(--bad); }
        .top-user { display:flex; align-items:center; gap:9px; padding:5px 10px 5px 6px; border-radius:12px;
            border:1px solid var(--border2); background: var(--surface); }
        .top-user .u-name { font-size:13px; font-weight:700; line-height:1.1; }
        .top-user .u-mail { font-size:11px; color:var(--faint); }
        .btn-logout { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border2);
            background: var(--surface); color:var(--ink); font-size: 13px; }
        .main { flex: 1; padding: 24px 26px 40px; overflow-x: hidden; }

        /* Page header (overview) */
        .page-head { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom: 20px; }
        .page-head h1 { font-size: 24px; font-weight: 800; letter-spacing:-.02em; }
        .page-head p { color: var(--muted); font-size: 14px; margin-top: 3px; }
        .head-tools { margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; }
        .pill-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 13px; border-radius:10px;
            border:1px solid var(--border2); background: var(--surface); color: var(--ink); font-size:13px; font-weight:600; }
        .pill-btn.accent { background: linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; }

        /* KPI cards */
        .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom: 20px; }
        .kpi { background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; position:relative; overflow:hidden; }
        .kpi-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        .kpi-ico { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; }
        .kpi-label { font-size:13px; color:var(--muted); font-weight:600; }
        .kpi-val { font-size:27px; font-weight:800; letter-spacing:-.02em; }
        .kpi-bottom { display:flex; align-items:flex-end; justify-content:space-between; margin-top:8px; gap:8px; }
        .kpi-delta { font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:3px; }
        .kpi-delta.up { color: var(--good); } .kpi-delta.down { color: var(--bad); } .kpi-delta.flat { color: var(--faint); }
        .kpi-spark { flex:1; max-width:120px; height:34px; }

        /* Panels */
        .grid-2 { display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:16px; }
        .grid-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-bottom:16px; }
        .panel { background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; min-width:0; }
        .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
        .panel-head h3 { font-size:15px; font-weight:700; }
        .panel-head .link { font-size:12px; color:var(--accent2); font-weight:600; cursor:pointer; }
        .seg { display:inline-flex; background: var(--bg2); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; }
        .seg button { padding:5px 11px; border-radius:7px; border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:600; }
        .seg button.active { background: var(--accent); color:#fff; }

        /* Donut */
        .donut-wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
        .donut-legend { flex:1; min-width:150px; display:flex; flex-direction:column; gap:9px; }
        .donut-legend .li { display:flex; align-items:center; gap:9px; font-size:13px; }
        .donut-legend .li .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .donut-legend .li .lv { margin-left:auto; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }

        /* Alerts + activity feeds */
        .feed { display:flex; flex-direction:column; gap:2px; }
        .feed-item { display:flex; align-items:flex-start; gap:11px; padding:10px 4px; border-bottom:1px solid var(--border); }
        .feed-item:last-child { border-bottom:none; }
        .feed-ico { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
        .feed-main { flex:1; min-width:0; }
        .feed-title { font-size:13px; font-weight:600; }
        .feed-sub { font-size:12px; color:var(--faint); }
        .feed-time { font-size:11px; color:var(--faint); white-space:nowrap; }

        /* Quick actions */
        .quick-bar { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:4px; }
        .qbtn { display:flex; align-items:center; justify-content:center; gap:9px; padding:14px; border-radius:13px;
            border:1px solid var(--border2); background: var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; }
        .qbtn:hover { border-color: var(--accent); background: var(--surface2); }
        .qbtn.accent { background: linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; }

        /* Stats cards (used by analytics + detail modals) */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); gap: 14px; margin-bottom: 8px; }
        .stat { background: var(--surface); border:1px solid var(--border); border-radius: 14px; padding: 16px; }
        .stat .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .stat .value { font-size: 24px; font-weight: 800; }
        .stat .sub { font-size: 11px; color: var(--faint); margin-top: 4px; }
        .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 12px; }

        /* Toolbar */
        .toolbar { display:flex; gap:10px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
        .toolbar input, .toolbar select {
            padding: 9px 12px; border-radius: 10px; border:1px solid var(--border2);
            background: rgba(255,255,255,0.05); color:var(--ink); font-size: 13px;
        }
        .toolbar input { min-width: 200px; }
        .toolbar > button {
            padding: 9px 14px; border-radius: 10px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:13px;
        }

        /* Table */
        .table-wrap { overflow-x: auto; border:1px solid var(--border); border-radius: 14px; background: var(--surface); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; background: var(--bg2); }
        tbody tr:last-child td { border-bottom:none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge { padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .b-green { background: rgba(52,211,153,.16); color:var(--good); }
        .b-yellow { background: rgba(251,191,36,.16); color:var(--warn); }
        .b-red { background: rgba(251,113,133,.16); color:var(--bad); }
        .b-blue { background: rgba(99,102,241,.18); color:#a5b4fc; }
        .b-gray { background: rgba(255,255,255,.1); color:var(--muted); }
        .row-actions { display:flex; gap:6px; }
        .act { padding: 6px 10px; border-radius: 8px; border:none; font-size: 12px; font-weight: 600; }
        .act-edit { background: rgba(99,102,241,.18); color:#a5b4fc; }
        .act-del { background: rgba(251,113,133,.16); color:var(--bad); }
        .act-ok { background: rgba(52,211,153,.18); color:var(--good); }
        .empty, .loading { text-align:center; padding: 40px; color: var(--faint); }
        .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; font-size:13px; color:var(--muted); }
        .pager button { padding:7px 12px; border-radius:8px; border:1px solid var(--border2); background:var(--surface); color:var(--ink); }
        .pager button:disabled { opacity:.4; }

        /* Toast notifications (replaces alert) */
        #toasts { position: fixed; top: 16px; right: 16px; z-index: 10000; display:flex; flex-direction:column; gap:10px; max-width: 340px; }
        .toast {
            padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
            background: rgba(30,30,52,0.96); border:1px solid rgba(255,255,255,0.15); color:#fff;
            box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .2s ease;
        }
        .toast.ok { border-left: 4px solid #7ee081; }
        .toast.err { border-left: 4px solid #ff8f8f; }
        .toast.info { border-left: 4px solid #4ECDC4; }
        @keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform:none; } }
        @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

        /* Modal */
        .modal-ov {
            position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
            display:flex; align-items:center; justify-content:center; z-index: 9999; padding: 20px;
        }
        .modal {
            background:var(--surface2); border:1px solid var(--border2); border-radius:16px;
            padding: 24px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y:auto;
            box-shadow: 0 30px 70px rgba(0,0,0,.55);
        }
        .modal h3 { font-size: 17px; margin-bottom: 6px; }
        .modal .hint { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 16px; }
        .modal label { display:block; font-size:12px; color:rgba(255,255,255,.7); margin: 12px 0 6px; }
        .modal input, .modal select, .modal textarea {
            width:100%; padding: 10px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08); color:#fff; font-size:14px; font-family:inherit;
        }
        .modal-actions { display:flex; gap:10px; margin-top: 20px; }
        .modal-actions button { flex:1; padding: 11px; border-radius:10px; font-weight:700; border:none; font-size:14px; }
        .btn-cancel { background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15) !important; color: rgba(255,255,255,.8); }
        .btn-confirm { background: linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
        .btn-danger { background: var(--bad); color:#1a1a2e; }

        /* Permission chips (roles UI) */
        .perm-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:6px; }
        .perm-chip {
            display:flex; align-items:center; gap:7px; font-size:12px; color:rgba(255,255,255,.75);
            padding:7px 9px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
        }
        .perm-chip input { width:auto; }
        .role-card {
            background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px;
            padding: 16px 18px; margin-bottom: 12px;
        }
        .role-card .rc-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
        .role-card .rc-head h4 { font-size:15px; }
        .role-card .rc-perms { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .tag { font-size:11px; padding:3px 8px; border-radius:7px; background:rgba(99,102,241,.18); color:#a5b4fc; font-family: ui-monospace, monospace; }
        .tag.all { background: rgba(251,191,36,.18); color:var(--warn); }

        @media (max-width: 1024px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        @media (max-width: 860px) {
            .sidebar { width: 66px; }
            .brand-name, .brand-sub, .nav-link span, .nav-section, .side-foot .u-name, .side-foot .u-mail { display:none; }
            .nav-link { justify-content:center; }
            .user-chip { justify-content:center; }
            .top-user .u-name, .top-user .u-mail { display:none; }
        }
        @media (max-width: 560px) { .main { padding: 16px; } .search { display:none; } }
    </style>

                    <div class="nav-link" data-view="analytics" data-perm="analytics:read" onclick="switchView('analytics',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/></svg> <span>Revenus &amp; Comm.</span></div>

                    <div class="nav-section">Administration</div>
                    <div class="nav-link" data-view="roles" data-perm="roles:read" onclick="switchView('roles',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg> <span>Rôles &amp; Admins</span></div>
                    <div class="nav-link" data-view="audit" data-perm="audit:read" onclick="switchView('audit',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg> <span>Journal d'audit</span></div>
                </nav>
                <div class="side-foot">
                    <div class="user-chip">
                        <div class="avatar" id="sideAvatar">AS</div>
                        <div style="min-width:0"><div class="u-name" id="sideUserName">Admin</div><div class="u-mail" id="sideUserMail"></div></div>
                    </div>
                </div>
            </aside>
            <div class="content">
                <div class="topbar">
                    <div class="search"><input id="globalSearch" placeholder="Rechercher un utilisateur…" onkeydown="if(event.key==='Enter')globalSearchGo()"></div>
                    <div class="top-actions">
                        <button class="icon-btn" title="Alertes" onclick="switchView('claims', document.querySelector('.nav-link[data-view=claims]'))">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
                        <div class="top-user">
                            <div class="avatar" id="topAvatar">AS</div>
                            <div><div class="u-name" id="topUserName">Admin</div><div class="u-mail" id="topUserMail"></div></div>
                        </div>
                        <button class="btn-logout" onclick="logout()">Déconnexion</button>
                    </div>
                </div>
                <div class="main" id="main"></div>
            </div>
        </div>
    </div>

    <script>
        // Admin is a web tool used against production. When opened as a local file
        // (file://) or on localhost, talk to the deployed API directly; otherwise
        // use the runtime-resolved base (same-origin when served by the backend).
        const PROD_API = 'https://2txjgdd3cj.us-east-1.awsapprunner.com/api/v1';
        const _h = location.hostname;
        const API = (location.protocol === 'file:' || _h === 'localhost' || _h === '127.0.0.1' || _h === '')
            ? PROD_API
            : (window.API_BASE_URL || '/api/v1');
        let token = localStorage.getItem('authToken');
        let me = null;
        try { me = JSON.parse(localStorage.getItem('userData') || 'null'); } catch (e) {}

        const state = { view: 'overview', page: 1, search: '', status: '' };
        let myPerms = null;   // string[] of the signed-in admin's permissions (['*'] = all)
        let allPerms = [];    // full catalog, for the role editor

        // Does the current admin hold a permission? Supports '*' and 'resource:*'.
        function can(required){
            if (!myPerms) return false;
            if (myPerms.includes('*')) return true;
            if (myPerms.includes(required)) return true;
            return myPerms.includes(required.split(':')[0] + ':*');
        }

        // ---------- Toast (replaces alert) ----------
        function toast(msg, kind){
            const box = document.getElementById('toasts');
            const t = document.createElement('div');
            t.className = 'toast ' + (kind || 'info');
            t.textContent = msg;
            box.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 3600);
        }
        // Report an API result: ok → success toast, else → error toast.
        function notify(ok, okMsg, json){
            if (ok) toast(okMsg, 'ok');
            else toast((json && (json.error||json.message)) || 'Erreur', 'err');
        }

        // ---------- Modal helpers (replace confirm/prompt) ----------
        function closeModal(){ const m = document.getElementById('modalOv'); if (m) m.remove(); }
        function openModal(innerHtml){
            closeModal();
            const ov = document.createElement('div');
            ov.id = 'modalOv'; ov.className = 'modal-ov';
            ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + innerHtml + '</div>';
            ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
            document.body.appendChild(ov);
            return ov;
        }
        // Promise-based confirm dialog.
        function confirmDialog(message, opts){
            opts = opts || {};
            return new Promise(resolve => {
                const ov = openModal(
                    '<h3>' + esc(opts.title || 'Confirmation') + '</h3>'
                  + '<p class="hint">' + esc(message) + '</p>'
                  + '<div class="modal-actions">'
                  + '<button class="btn-cancel" id="mCancel">Annuler</button>'
                  + '<button class="' + (opts.danger ? 'btn-danger' : 'btn-confirm') + '" id="mOk">' + esc(opts.confirmLabel || 'Confirmer') + '</button>'
                  + '</div>');
                ov.querySelector('#mCancel').onclick = () => { closeModal(); resolve(false); };
                ov.querySelector('#mOk').onclick = () => { closeModal(); resolve(true); };
            });
        }

        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function fcfa(n){ return (Number(n)||0).toLocaleString('fr-FR') + ' FCFA'; }
        function dt(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
        function api(path, opts){
            opts = opts || {};
            opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {});
            return fetch(API + path, opts).then(async r => {
                const j = await r.json().catch(() => ({}));
                // 401 = invalid/expired session → sign out. 403 = authenticated but
                // lacks the permission → surface as a normal error, keep the session.
                if (r.status === 401) { logout(); throw new Error(j.error || 'Session expirée'); }
                return { ok: r.ok, json: j, status: r.status };
            });
        }

        function badgeFor(status){
            const s = String(status||'').toLowerCase();
            if (['completed','delivered','approved','verified','active','resolved'].includes(s)) return 'b-green';
            if (['pending','processing','open','published','accepted','in_transit','investigating'].includes(s)) return 'b-yellow';
            if (['failed','cancelled','rejected','suspended','closed'].includes(s)) return 'b-red';
            return 'b-gray';
        }

        // ---------- Auth ----------
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginErr');
            err.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Connexion…';
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const j = await res.json();
                if (!res.ok || !j.success) throw new Error(j.error || j.message || 'Connexion échouée');
                if (j.data.user.user_type !== 'admin') throw new Error('Ce compte n\'est pas administrateur.');
                token = j.data.token; me = j.data.user;
                localStorage.setItem('authToken', token);
                localStorage.setItem('userData', JSON.stringify(me));
                showApp();
            } catch (e2) {
                err.textContent = e2.message; err.style.display = 'block';
            } finally { btn.disabled = false; btn.textContent = 'Se connecter'; }
        });

        function logout(){
            localStorage.removeItem('authToken'); localStorage.removeItem('userData');
            token = null; me = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('login').style.display = 'flex';
        }

        async function showApp(){
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            const name = me ? (me.first_name + ' ' + me.last_name) : 'Admin';
            const initials = me ? ((me.first_name||' ')[0] + (me.last_name||' ')[0]).toUpperCase() : 'AS';
            ['sideUserName','topUserName'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = name; });
            ['sideUserMail','topUserMail'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = me ? me.email : ''; });
            ['sideAvatar','topAvatar'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = initials; });
            await loadPermissions();
            applyPermissionGates();
            switchView('overview', document.querySelector('.nav-link'));
        }
        // Topbar search → jump to Users filtered by the query.
        function globalSearchGo(){
            const q = (document.getElementById('globalSearch').value || '').trim();
            if (!q) return;
            if (!can('users:read')) { toast('Recherche indisponible pour votre rôle', 'info'); return; }
            switchView('users', document.querySelector('.nav-link[data-view=users]'));
            state.search = q; state.page = 1;
            const inp = document.getElementById('search'); if (inp) inp.value = q;
            loadList();
        }

        // Fetch the signed-in admin's permission list (drives section visibility).
        // Falls back to full access ('*') when the endpoint is unavailable — e.g. an
        // older backend that predates RBAC (404), or a transient error — so the
        // dashboard stays usable. The backend still enforces every action, so this
        // only affects which buttons are shown, never what actually succeeds.
        async function loadPermissions(){
            try {
                const { ok, json, status } = await api('/admin/me/permissions');
                if (ok && json.data && Array.isArray(json.data.permissions)) {
                    myPerms = json.data.permissions;
                } else {
                    // 404 = backend has no RBAC yet; any other failure = don't lock the UI.
                    myPerms = ['*'];
                }
            } catch (e) { myPerms = ['*']; }
        }
        // Hide sidebar sections the admin has no permission for.
        function applyPermissionGates(){
            document.querySelectorAll('.nav-link[data-perm]').forEach(el => {
                el.style.display = can(el.getAttribute('data-perm')) ? '' : 'none';
            });
        }

        function switchView(view, el){
            state.view = view; state.page = 1; state.search = ''; state.status = '';
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            if (el) el.classList.add('active');
            render();
        }

        // ---------- Views ----------
        async function render(){
            const main = document.getElementById('main');
            if (state.view === 'overview') return renderOverview(main);
            if (state.view === 'analytics') return renderAnalytics(main);
            if (state.view === 'roles') return renderRoles(main);
            if (state.view === 'kyc') return renderKyc(main);
            let extra = '';
            if (state.view === 'users' && can('users:write'))
                extra = `<button style="margin-left:auto;background:#7ee081;color:#06302c" onclick="createUserModal()">+ Créer un utilisateur</button>`;
            else if (state.view === 'payments' && can('payments:export'))
                extra = `<button style="margin-left:auto" onclick="exportCsv('payments')">⬇ Exporter CSV</button>`;
            else if (state.view === 'withdrawals')
                extra = `<button style="margin-left:auto" onclick="exportCsv('withdrawals')">⬇ Exporter CSV</button>`;
            main.innerHTML = `
                <div class="toolbar">
                    <input id="search" placeholder="Rechercher…" value="${esc(state.search)}">
                    ${statusFilter()}
                    <button onclick="applyFilters()">Filtrer</button>
                    ${extra}
                </div>
                <div id="tableArea"><div class="loading">Chargement…</div></div>
                <div class="pager" id="pager"></div>`;
            document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });
            loadList();
        }

        function statusFilter(){
            const opts = {
                users: ['', 'pending','verified','suspended'],
                missions: ['', 'pending','accepted','in_transit','delivered','cancelled'],
                trips: ['', 'draft','published','active','completed','cancelled'],
                payments: ['', 'pending','completed','failed'],
                withdrawals: ['', 'pending','approved','rejected','completed'],
                claims: ['', 'open','investigating','resolved','closed']
            }[state.view];
            if (!opts) return '';
            return `<select id="status">${opts.map(o => `<option value="${o}"${o===state.status?' selected':''}>${o||'Tous les statuts'}</option>`).join('')}</select>`;
        }

        function applyFilters(){
            state.search = (document.getElementById('search')||{}).value || '';
            const sEl = document.getElementById('status');
            state.status = sEl ? sEl.value : '';
            state.page = 1;
            loadList();
        }

        function card(label, value, sub){
            return `<div class="stat"><div class="label">${label}</div><div class="value">${esc(value)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`;
        }
        // Relative time in French.
        function timeAgo(d){
            const s = Math.max(0, (Date.now() - new Date(d).getTime())/1000);
            if (s < 60) return 'à l\'instant';
            if (s < 3600) return 'il y a ' + Math.floor(s/60) + ' min';
            if (s < 86400) return 'il y a ' + Math.floor(s/3600) + ' h';
            if (s < 172800) return 'hier';
            return 'il y a ' + Math.floor(s/86400) + ' j';
        }
        // Tiny sparkline (area + line) from an array of numbers.
        function svgSpark(vals, color){
            const n = vals.length; if (!n) return '';
            const W=120, H=34, max=Math.max(1,...vals), min=Math.min(0,...vals);
            const x=i=> n===1?W/2:i*W/(n-1);
            const y=v=> H-2 - ((v-min)/((max-min)||1))*(H-4);
            const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
            return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none">`
                 + `<polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity="0.14"/>`
                 + `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
        }
        // Donut chart from segments [{label,value,color}].
        function svgDonut(segments, total, centerLabel){
            const r=52, C=2*Math.PI*r, cx=60, cy=60; let off=0;
            const arcs = segments.filter(s=>s.value>0).map(s => {
                const frac = total>0 ? s.value/total : 0; const len = frac*C;
                const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16"
                    stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
                    transform="rotate(-90 ${cx} ${cy})"/>`;
                off += len; return el;
            }).join('');
            return `<svg viewBox="0 0 120 120" width="132" height="132">`
                 + `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>`
                 + arcs
                 + `<text x="60" y="56" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${total}</text>`
                 + `<text x="60" y="74" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.5)">${esc(centerLabel||'Total')}</text></svg>`;
        }
        function fmtDelta(cur, prev){
            if (prev == null) return '';
            let pct; if (prev === 0) pct = cur>0?100:0; else pct = (cur-prev)/prev*100;
            const cls = pct>0.5?'up':(pct<-0.5?'down':'flat');
            const arrow = cls==='up'?'↑':(cls==='down'?'↓':'→');
            return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
        }
        function setOverviewRange(r){ state.oRange = r; renderOverview(document.getElementById('main')); }

        async function renderOverview(main){
            main.innerHTML = '<div class="loading">Chargement du tableau de bord…</div>';
            if (!state.oRange) state.oRange = '30j';
            const R = {'7j':{d:7,i:'day'},'30j':{d:30,i:'day'},'3mois':{d:90,i:'week'},'1an':{d:365,i:'month'}}[state.oRange];
            const iso = d => d.toISOString().slice(0,10);
            const to = new Date(), from = new Date(Date.now()-(R.d-1)*864e5);
            const prevTo = new Date(from.getTime()-864e5), prevFrom = new Date(prevTo.getTime()-(R.d-1)*864e5);
            const hasAn = can('analytics:read');
            try {
                const reqs = [api('/admin/stats'), api('/admin/activity?limit=8')];
                if (hasAn) reqs.push(
                    api(`/admin/analytics/timeseries?from=${iso(from)}&to=${iso(to)}&interval=${R.i}`),
                    api(`/admin/analytics/timeseries?from=${iso(prevFrom)}&to=${iso(prevTo)}&interval=${R.i}`),
                    api(`/admin/analytics/top-routes?from=${iso(from)}&to=${iso(to)}&limit=5`),
                    api('/admin/analytics/gp-performance?limit=5'));
                const res = await Promise.all(reqs);
                if (!res[0].ok) throw new Error((res[0].json&&res[0].json.error)||'Erreur');
                const s = res[0].json.data;
                const activity = (res[1].ok && res[1].json.data) || [];
                const cur = hasAn && res[2].ok ? res[2].json.data.totals : null;
                const prev = hasAn && res[3].ok ? res[3].json.data.totals : null;
                const series = hasAn && res[2].ok ? res[2].json.data.series : [];
                const routes = hasAn && res[4] && res[4].ok ? res[4].json.data : [];
                const gps = hasAn && res[5] && res[5].ok ? res[5].json.data : [];
                const spk = k => series.map(x => Number(x[k])||0);

                // KPI cards (values = totals; delta + sparkline = period, when analytics allowed)
                const kpi = (ico, bg, label, value, cKey, sparkColor) => {
                    const has = cKey && cur && (cKey in cur);
                    const delta = (has && prev) ? fmtDelta(cur[cKey]||0, prev[cKey]||0) : '';
                    const spark = (has && series.length) ? `<div class="kpi-spark">${svgSpark(spk(cKey), sparkColor)}</div>` : '';
                    return `<div class="kpi"><div class="kpi-top"><div class="kpi-ico" style="background:${bg}20;color:${bg}">${ico}</div>
                        <div class="kpi-label">${label}</div></div>
                        <div class="kpi-val">${esc(value)}</div>
                        <div class="kpi-bottom">${delta || '<span class="kpi-delta flat">—</span>'}${spark}</div></div>`;
                };
                const kpis = `<div class="kpi-grid">
                    ${kpi('💼','#8b5cf6','Volume traité', fcfa(s.payments.gross_volume), 'gross', '#8b5cf6')}
                    ${kpi('📦','#34d399','Missions', s.missions.total, 'missions', '#34d399')}
                    ${kpi('👥','#38bdf8','Utilisateurs', s.users.total, 'new_users', '#38bdf8')}
                    ${kpi('🧾','#fbbf24','Paiements', s.payments.completed_count, 'payments', '#fbbf24')}
                    ${kpi('🛡️','#fb7185','Réclamations', s.claims.open, null, '#fb7185')}
                </div>`;

                // Revenue chart
                const seg = ['7j','30j','3mois','1an'].map(r => `<button class="${state.oRange===r?'active':''}" onclick="setOverviewRange('${r}')">${r}</button>`).join('');
                const chart = hasAn
                    ? svgLines(series, { keys:[{key:'gross',color:'#8b5cf6',label:'Volume',fill:true},{key:'commission',color:'#34d399',label:'Commission'}] })
                    : `<div class="empty">Réservé aux rôles avec accès analytics.</div>`;

                // Missions donut
                const m = s.missions;
                const segs = [
                    {label:'En attente', value:+m.pending, color:'#8b5cf6'},
                    {label:'Acceptées', value:+m.accepted, color:'#34d399'},
                    {label:'En transit', value:+m.in_transit, color:'#38bdf8'},
                    {label:'Livrées', value:+m.delivered, color:'#22c55e'},
                    {label:'Annulées', value:+m.cancelled, color:'#fb7185'},
                ];
                const known = segs.reduce((a,x)=>a+x.value,0);
                if (+m.total > known) segs.push({label:'Autres', value:+m.total-known, color:'#64748b'});
                const legend = segs.map(x => `<div class="li"><span class="dot" style="background:${x.color}"></span>${x.label}<span class="lv">${x.value} (${m.total>0?Math.round(x.value/m.total*100):0}%)</span></div>`).join('');

                // Alerts
                const alerts = [];
                if (+s.claims.open>0) alerts.push({c:'#fb7185',i:'🛡️',t:`${s.claims.open} réclamation(s) en attente de traitement`});
                if (+s.missions.pending>0) alerts.push({c:'#fbbf24',i:'📦',t:`${s.missions.pending} mission(s) en attente d'acceptation`});
                if (+s.withdrawals.pending>0) alerts.push({c:'#38bdf8',i:'💸',t:`${s.withdrawals.pending} retrait(s) en attente (${fcfa(s.withdrawals.pending_amount)})`});
                const anyAlert = alerts.length>0;
                const alertHtml = anyAlert ? alerts.map(a=>`<div class="feed-item"><div class="feed-ico" style="background:${a.c}20;color:${a.c}">${a.i}</div><div class="feed-main"><div class="feed-title">${esc(a.t)}</div></div></div>`).join('')
                    : `<div class="feed-item"><div class="feed-ico" style="background:#34d39920;color:#34d399">✓</div><div class="feed-main"><div class="feed-title">Tout est à jour.</div></div></div>`;
                const bd = document.getElementById('bellDot'); if (bd) bd.style.display = anyAlert ? 'block' : 'none';

                // Activity feed
                const actMeta = { mission:{i:'📦',c:'#38bdf8'}, payment:{i:'💰',c:'#34d399'}, user:{i:'👤',c:'#fbbf24'}, claim:{i:'🛡️',c:'#fb7185'} };
                const actTitle = a => a.kind==='mission' ? `Mission ${a.ref} · ${a.detail}`
                    : a.kind==='payment' ? `Paiement reçu` : a.kind==='user' ? `Nouvel utilisateur` : `Réclamation ${a.ref}`;
                const actSub = a => a.kind==='mission' ? (a.extra||'') : a.kind==='payment' ? `${a.ref} · ${fcfa(a.detail)}`

        // ---------- Analytics ----------
        function isoDaysAgo(n){ const d = new Date(Date.now() - n*864e5); return d.toISOString().slice(0,10); }
        // Dependency-free responsive SVG line/area chart for one or two numeric series.
        function svgLines(series, cfg){
            const W=760, H=220, P={l:48,r:14,t:14,b:26};
            const n = series.length;
            if (!n) return '<div class="empty">Aucune donnée sur la période.</div>';
            const keys = cfg.keys; // [{key,color,label,fill?}]
            const maxV = Math.max(1, ...series.flatMap(s => keys.map(k => Number(s[k.key])||0)));
            const x = i => P.l + (n===1 ? (W-P.l-P.r)/2 : i*(W-P.l-P.r)/(n-1));
            const y = v => H-P.b - (Number(v)||0)/maxV*(H-P.t-P.b);
            const grid = [0,.25,.5,.75,1].map(f => { const gy=P.t+f*(H-P.t-P.b); const val=Math.round(maxV*(1-f));
                return `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="rgba(255,255,255,.08)"/>`
                     + `<text x="${P.l-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="rgba(255,255,255,.4)">${val>=1000?(val/1000).toFixed(0)+'k':val}</text>`; }).join('');
            const paths = keys.map(k => {
                const pts = series.map((s,i) => `${x(i)},${y(s[k.key])}`).join(' ');
                const area = k.fill ? `<polygon points="${P.l},${H-P.b} ${pts} ${x(n-1)},${H-P.b}" fill="${k.color}" opacity="0.12"/>` : '';
                const end = `<circle cx="${x(n-1)}" cy="${y(series[n-1][k.key])}" r="3" fill="${k.color}"/>`;
                return area + `<polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="2"/>` + end;
            }).join('');
            const step = Math.ceil(n/6);
            const labels = series.map((s,i) => (i%step===0||i===n-1) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.4)">${esc(s.period.slice(5))}</text>` : '').join('');
            const legend = keys.map(k => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:rgba(255,255,255,.7)"><span style="width:10px;height:10px;border-radius:2px;background:${k.color}"></span>${esc(k.label)}</span>`).join('');
            return `<div style="margin-bottom:6px">${legend}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="min-width:520px">${grid}${paths}${labels}</svg></div>`;
        }
        function svgBars(series, key, color){
            const W=760,H=180,P={l:48,r:14,t:14,b:26}; const n=series.length;
            if(!n) return '';
            const maxV=Math.max(1,...series.map(s=>Number(s[key])||0));
            const bw=(W-P.l-P.r)/n*0.65;
            const y=v=>H-P.b-(Number(v)||0)/maxV*(H-P.t-P.b);
            const bars=series.map((s,i)=>{const cx=P.l+i*(W-P.l-P.r)/n+((W-P.l-P.r)/n-bw)/2; const yy=y(s[key]);
                return `<rect x="${cx}" y="${yy}" width="${bw}" height="${H-P.b-yy}" fill="${color}" opacity="0.8" rx="2"/>`;}).join('');
            const step=Math.ceil(n/6);
            const labels=series.map((s,i)=>(i%step===0||i===n-1)?`<text x="${P.l+i*(W-P.l-P.r)/n+(W-P.l-P.r)/n/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.4)">${esc(s.period.slice(5))}</text>`:'').join('');
            const grid=[0,.5,1].map(f=>{const gy=P.t+f*(H-P.t-P.b);return `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="rgba(255,255,255,.08)"/><text x="${P.l-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="rgba(255,255,255,.4)">${Math.round(maxV*(1-f))}</text>`;}).join('');
            return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="min-width:520px">${grid}${bars}${labels}</svg></div>`;
        }
        async function renderAnalytics(main){
            if (!state.aFrom) { state.aFrom = isoDaysAgo(29); state.aTo = new Date().toISOString().slice(0,10); state.aInterval = 'day'; }
            main.innerHTML = `
                <div class="toolbar">
                    <label style="font-size:12px;color:rgba(255,255,255,.6);align-self:center">Du</label>
                    <input type="date" id="aFrom" value="${state.aFrom}">
                    <label style="font-size:12px;color:rgba(255,255,255,.6);align-self:center">au</label>
                    <input type="date" id="aTo" value="${state.aTo}">
                    <select id="aInterval">
                        <option value="day"${state.aInterval==='day'?' selected':''}>Jour</option>
                        <option value="week"${state.aInterval==='week'?' selected':''}>Semaine</option>
                        <option value="month"${state.aInterval==='month'?' selected':''}>Mois</option>
                    </select>

        function applyAnalytics(){
            state.aFrom = document.getElementById('aFrom').value || state.aFrom;
            state.aTo = document.getElementById('aTo').value || state.aTo;
            state.aInterval = document.getElementById('aInterval').value;
            loadAnalytics();
        }
        async function loadAnalytics(){
            const body = document.getElementById('aBody');
            body.innerHTML = '<div class="loading">Chargement…</div>';
            const qs = `?from=${state.aFrom}&to=${state.aTo}&interval=${state.aInterval}`;
            try {
                const [ts, routes, gps] = await Promise.all([
                    api('/admin/analytics/timeseries'+qs),
                    api('/admin/analytics/top-routes'+`?from=${state.aFrom}&to=${state.aTo}&limit=10`),
                    api('/admin/analytics/gp-performance?limit=10'),
                ]);
                if (!ts.ok) { body.innerHTML = `<div class="empty">${ts.status===403?'Accès refusé.':'Erreur.'}</div>`; return; }
                const d = ts.json.data; const t = d.totals || {}; const s = d.series || [];
                const routeRows = (routes.json.data||[]).map(r => `<tr><td>${esc((r.departure_city||'?')+' → '+(r.arrival_city||'?'))}</td><td>${esc(r.arrival_country||'—')}</td><td>${r.missions}</td><td>${fcfa(r.volume)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:rgba(255,255,255,.4)">Aucune donnée</td></tr>';
                const gpRows = (gps.json.data||[]).map(g => `<tr><td>${esc(g.gp_name||'—')}</td><td>${g.missions_completed}</td><td>${fcfa(g.total_earnings)}</td><td>⭐${Number(g.average_rating||0).toFixed(1)} (${g.total_reviews||0})</td></tr>`).join('') || '<tr><td colspan="4" style="color:rgba(255,255,255,.4)">Aucune donnée</td></tr>';
                body.innerHTML =
                    `<div class="stats-grid">`
                  + card('Volume (GMV)', fcfa(t.gross)) + card('Commissions', fcfa(t.commission))
                  + card('Paiements', t.payments||0) + card('Panier moyen', fcfa(t.avg_order))
                  + card('Missions créées', t.missions||0) + card('Nouveaux users', t.new_users||0)
                  + `</div>`
                  + `<div class="section-title">Revenus & commissions</div>`
                  + `<div class="card" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px">`
                  + svgLines(s, { keys:[{key:'gross',color:'#4ECDC4',label:'Volume',fill:true},{key:'commission',color:'#FFD700',label:'Commission'}] })
                  + `</div>`
                  + `<div class="section-title">Missions créées</div>`
                  + `<div class="card" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px">`
                  + svgBars(s, 'missions', '#8b7dff')
                  + `</div>`
                  + `<div class="section-title">Top routes</div>`
                  + `<div class="table-wrap"><table><thead><tr><th>Route</th><th>Pays</th><th>Missions</th><th>Volume</th></tr></thead><tbody>${routeRows}</tbody></table></div>`
                  + `<div class="section-title">Performance GP</div>`
                  + `<div class="table-wrap"><table><thead><tr><th>GP</th><th>Missions</th><th>Gains</th><th>Note</th></tr></thead><tbody>${gpRows}</tbody></table></div>`;
            } catch (e) { body.innerHTML = '<div class="empty">Erreur de chargement.</div>'; }
        }

        async function loadList(){
            const area = document.getElementById('tableArea');
            area.innerHTML = '<div class="loading">Chargement…</div>';
            const q = `?page=${state.page}&limit=20`
                + (state.search ? `&search=${encodeURIComponent(state.search)}` : '')
                + (state.status ? `&status=${encodeURIComponent(state.status)}` : '');
            try {
                const { ok, json } = await api('/admin/' + state.view + q);
                if (!ok) throw new Error(json.error || 'Erreur');
                const rows = json.data || [];
                area.innerHTML = renderTable(state.view, rows);
                renderPager(json.meta || json.pagination);
            } catch (e) {
                area.innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`;
            }
        }

        function renderPager(p){

                <span>Page ${p.page||state.page} / ${totalPages} · ${p.total||0} éléments</span>
                <button ${(p.page||1)<=1?'disabled':''} onclick="goPage(${(p.page||1)-1})">←</button>

        }
        function goPage(n){ state.page = n; (state.view === 'kyc' ? loadKyc() : loadList()); }

        function renderTable(view, rows){
            if (!rows.length) return '<div class="empty">Aucun élément.</div>';
            const defs = {
                users: {
                    head: ['Nom','Email','Type','Statut','Ville','Inscrit','Actions'],
                    row: u => {
                        const acts = [];
                        acts.push(['act-edit','Détails',`showUserDetail('${u.id}')`]);
                        if (can('users:write')) acts.push(['act-edit','Éditer',`editUser('${u.id}')`]);
                        if (can('roles:manage')) acts.push(['act-ok','Rôle',`assignRole('${u.id}','${esc(u.email)}')`]);
                        if (can('users:delete')) acts.push(['act-del','Suppr.',`delUser('${u.id}','${esc(u.email)}')`]);
                        return [
                        esc(u.first_name+' '+u.last_name), esc(u.email),
                        `<span class="badge b-blue">${esc(u.user_type)}</span>`,
                        `<span class="badge ${badgeFor(u.status)}">${esc(u.status)}</span>`,
                        esc(u.city||'—'), dt(u.created_at),
                        actions(acts)
                    ]; }
                },
                missions: {
                    head: ['Code','Trajet','Prix','Statut','Expéditeur','GP','Actions'],
                    row: m => {
                        const acts = [];
                        acts.push(['act-edit','Détails',`showMissionDetail('${m.id}')`]);
                        // Only unassigned, still-pending missions can be assigned to a GP.
                        if (m.status === 'pending' && !m.gp_name && can('missions:assign')) {
                            acts.push(['act-ok','Affecter',`assignMission('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        // An already-assigned mission can be moved to another GP.
                        if (m.gp_name && can('missions:assign')) {
                            acts.push(['act-ok','Réassigner',`reassignMissionUI('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        // GP arrived at destination, awaiting the admin's confirmation.
                        if (m.status === 'out_for_delivery' && !m.arrival_confirmed && can('missions:write')) {
                            acts.push(['act-ok','Confirmer arrivée',`confirmArrival('${m.id}','${esc(m.mission_code)}')`]);
                        }
                        if (can('missions:write')) acts.push(['act-edit','Statut',`editMission('${m.id}','${esc(m.status)}')`]);
                        if (can('missions:delete')) acts.push(['act-del','Suppr.',`delMission('${m.id}','${esc(m.mission_code)}')`]);
                        return [
                            esc(m.mission_code), esc((m.departure_city||'?')+' → '+(m.arrival_city||'?')),
                            fcfa(m.price), `<span class="badge ${badgeFor(m.status)}">${esc(m.status)}</span>`,
                            esc(m.expediteur_name||'—'), esc(m.gp_name||'—'),
                            actions(acts)
                        ];
                    }
                },
                trips: {
                    head: ['Code','Trajet','GP','Départ','Statut','Colis','Actions'],
                    row: t => {
                        const acts = [['act-edit','Détails',`showTripDetail('${t.id}')`]];
                        if (can('trips:write')) acts.push(['act-edit','Modérer',`moderateTrip('${t.id}','${esc(t.status)}')`]);
                        if (can('trips:delete')) acts.push(['act-del','Suppr.',`delTrip('${t.id}','${esc(t.trip_code)}')`]);
                        return [
                        esc(t.trip_code), esc((t.departure_city||'?')+' → '+(t.arrival_city||'?')),
                        esc(t.gp_name||'—'), dt(t.departure_date),
                        `<span class="badge ${badgeFor(t.status)}">${esc(t.status)}</span>`,
                        `${t.current_packages||0}/${t.max_packages||0}`,
                        actions(acts)
                    ]; }
                },
                payments: {
                    head: ['Code','Montant','Commission','Net','Méthode','Statut','Payeur','Bénéf.','Date','Actions'],
                    row: p => [
                        esc(p.payment_code), fcfa(p.amount), fcfa(p.commission), fcfa(p.net_amount),
                        esc(p.payment_method), `<span class="badge ${badgeFor(p.status)}">${esc(p.status)}</span>`,
                        esc(p.payer_name||'—'), esc(p.payee_name||'—'), dt(p.created_at),
                        actions((p.status==='completed' && can('payments:refund')) ? [['act-del','Rembourser',`refundPayment('${p.id}','${esc(p.payment_code)}')`]] : [])
                    ]
                },
                withdrawals: {
                    head: ['Code','GP','Montant','Méthode','Compte','Statut','Actions'],
                    row: w => {
                        const acts = [];
                        if (w.status==='pending') {
                            if (can('withdrawals:approve')) { acts.push(['act-ok','Approuver',`approveW('${w.id}')`]); acts.push(['act-del','Rejeter',`rejectW('${w.id}')`]); }
                        } else if (w.status==='approved') {
                            if (can('withdrawals:payout')) acts.push(['act-ok','Marquer payé',`payW('${w.id}')`]);
                            if (can('withdrawals:approve')) acts.push(['act-del','Rejeter',`rejectW('${w.id}')`]);
                        } else if (w.status==='completed' && w.external_reference) {
                            acts.push(['act-edit','Réf: '+String(w.external_reference).slice(0,14),`void 0`]);
                        }
                        return [
                        esc(w.withdrawal_code), esc(w.gp_name||w.gp_id||'—'), fcfa(w.amount),
                        esc(w.withdrawal_method), esc(w.account_number||'—'),
                        `<span class="badge ${badgeFor(w.status)}">${esc(w.status)}</span>`,
                        acts.length ? actions(acts) : '—'
                    ]; }
                },
                claims: {
                    head: ['Code','Type','Priorité','Statut','Demandeur','Message','Actions'],

                        const ev = (c.evidence_urls || []).filter(Boolean);
                        const audio = ev.length ? `<button class="act act-ok" onclick="playEvidence('${encodeURIComponent(ev[0])}')">🔊 Vocal</button>` : '';
                        const msg = `<div style="max-width:240px;white-space:normal;">${esc(c.description||'—')}</div>${audio}`;

                        ];

                        actions(can('reviews:moderate') ? [['act-del','Supprimer',`deleteReview('${r.id}')`]] : [])
                    ]
                },
                audit: {
                    head: ['Date','Admin','Action','Entité','Détails'],
                    row: l => [
                        new Date(l.created_at).toLocaleString('fr-FR'),
                        esc(l.admin_name||l.admin_email||'—'),
                        `<span class="tag">${esc(l.action)}</span>`,
                        esc(l.entity_type) + (l.entity_id ? ` <span style="color:rgba(255,255,255,.4)">#${esc(String(l.entity_id).slice(0,8))}</span>` : ''),
                        `<span style="color:rgba(255,255,255,.6)">${esc(l.description || (l.metadata ? JSON.stringify(l.metadata) : '—'))}</span>`
                    ]
                }
            };
            const d = defs[view];
            const body = rows.map(r => `<tr>${d.row(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
            return `<div class="table-wrap"><table><thead><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
        }
        function actions(list){
            return `<div class="row-actions">${list.map(([cls,label,fn])=>`<button class="act ${cls}" onclick="${fn}">${label}</button>`).join('')}</div>`;
        }

        // ---------- Generic form modal (replaces prompt) ----------
        // fields: [{name,label,type:'text|select|textarea',options?,value?,placeholder?}]
        // Resolves to an object of values, or null if cancelled.
        function formModal(cfg){
            return new Promise(resolve => {
                const fieldHtml = cfg.fields.map(f => {
                    if (f.type === 'select') {
                        const opts = f.options.map(o => {
                            const val = Array.isArray(o) ? o[0] : o;
                            const lab = Array.isArray(o) ? o[1] : o;
                            return `<option value="${esc(val)}"${(f.value===val)?' selected':''}>${esc(lab)}</option>`;
                        }).join('');
                        return `<label>${esc(f.label)}</label><select data-f="${esc(f.name)}">${opts}</select>`;
                    }
                    if (f.type === 'textarea') {
                        return `<label>${esc(f.label)}</label><textarea data-f="${esc(f.name)}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`;
                    }
                    return `<label>${esc(f.label)}</label><input data-f="${esc(f.name)}" type="${f.inputType||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}">`;
                }).join('');
                const ov = openModal(
                    '<h3>' + esc(cfg.title) + '</h3>'
                  + (cfg.hint ? '<p class="hint">' + esc(cfg.hint) + '</p>' : '')
                  + fieldHtml
                  + '<div class="modal-actions"><button class="btn-cancel" id="fCancel">Annuler</button>'
                  + '<button class="btn-confirm" id="fOk">' + esc(cfg.confirmLabel||'Enregistrer') + '</button></div>');
                ov.querySelector('#fCancel').onclick = () => { closeModal(); resolve(null); };
                ov.querySelector('#fOk').onclick = () => {
                    const out = {};
                    ov.querySelectorAll('[data-f]').forEach(el => { out[el.getAttribute('data-f')] = el.value; });
                    closeModal(); resolve(out);
                };
            });
        }

        async function renderKyc(main){

        async function loadKyc(){
            const area = document.getElementById('kycArea');
            area.innerHTML = '<div class="loading">Chargement…</div>';
            const q = `?page=${state.page}&limit=20` + (state.search ? `&search=${encodeURIComponent(state.search)}` : '');

            if (!ok) { area.innerHTML = `<div class="empty">${status===403?'Accès refusé.':'Erreur.'}</div>`; return; }
            const rows = json.data || [];
            if (!rows.length) { area.innerHTML = '<div class="empty">Aucune pièce en attente de vérification. 🎉</div>'; renderPager(json.meta); return; }
            area.innerHTML = rows.map(u => {

        // Assign a pending mission to a GP. The GP is notified and confirms via
        // their notifications page (accept → mission becomes 'accepted'; decline →
        // released back to 'pending'). Backed by POST /admin/missions/:id/assign.
        // Shared GP picker (used by both Affecter and Réassigner). Loads GPs,
        // groups them by destination region, and calls handler(gpId) on confirm.
        let _gpPickHandler = null;
        async function openGpPicker(title, confirmLabel, handler){
            const { ok, json } = await api('/admin/users?user_type=gp&limit=200');
            if (!ok) { toast('Erreur chargement des GPs: '+((json&&(json.error||json.message))||''), 'err'); return; }
            const gps = (json.data || []).filter(g => g.status !== 'suspended');
            if (!gps.length) { toast('Aucun GP disponible.', 'err'); return; }
            const region = (country) => {
                const c = String(country||'').toLowerCase();
                if (/france|espagne|spain|itali|allemagne|german|belg|portugal|royaume|angleterre|england|uk|pays-bas|suisse|europe/.test(c)) return '🇪🇺 Europe';
                if (/usa|état|etats|united states|canada|amériq|ameriq|brés|bres|mexi/.test(c)) return '🌎 Amérique';
                if (/sénégal|senegal|mali|côte|cote|ivoire|maroc|moroc|tunis|algér|alger|guin|afriq|gambie|mauritanie|bénin|benin|togo|burkina|niger|cameroun/.test(c)) return '🌍 Afrique';
                return '🌐 Autres';
            };
            const groups = {};
            gps.forEach(g => { const r = region(g.country); (groups[r] = groups[r] || []).push(g); });
            const opt = g => `<option value="${g.id}">${esc(g.first_name+' '+g.last_name)} · ${esc(g.city||g.country||'—')}`
                + `${g.average_rating ? ' · ⭐'+g.average_rating : ''}</option>`;
            const opts = ['🇪🇺 Europe','🌎 Amérique','🌍 Afrique','🌐 Autres']
                .filter(r => groups[r])
                .map(r => `<optgroup label="${r}">${groups[r].map(opt).join('')}</optgroup>`)
                .join('');
            _gpPickHandler = handler;
            const ov = openModal(
                '<h3>' + esc(title) + '</h3>'
              + '<p class="hint">Sélectionnez un GP. Il recevra une notification et pourra accepter ou décliner.</p>'
              + '<label>Gros Porteur</label><select id="gpPickSelect">' + opts + '</select>'
              + '<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Annuler</button>'
              + '<button class="btn-confirm" id="gpPickBtn" onclick="gpPickerConfirm()">' + esc(confirmLabel) + '</button></div>');
        }
        async function gpPickerConfirm(){
            const sel = document.getElementById('gpPickSelect');
            const gpId = sel && sel.value; if (!gpId) return;
            const btn = document.getElementById('gpPickBtn'); if (btn) { btn.disabled = true; btn.textContent = '…'; }
            const h = _gpPickHandler; closeModal();
            if (h) await h(gpId);
        }
