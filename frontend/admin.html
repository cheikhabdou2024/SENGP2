            openModal(
                `<h3>${esc(t.trip_code)} <span class="badge ${badgeFor(t.status)}">${esc(t.status)}</span></h3>`
              + `<p class="hint">${esc((t.departure_city||'?')+' → '+(t.arrival_city||'?'))} · ${dt(t.departure_date)} → ${dt(t.arrival_date)}</p>`
              + `<div style="font-size:13px;color:rgba(255,255,255,.7)">GP : ${esc(t.gp_name||'—')} · ${t.gp_phone?`<a href="tel:${esc(t.gp_phone)}">${esc(t.gp_phone)}</a>`:'—'}</div>`
              + `<div style="font-size:13px;color:rgba(255,255,255,.7)">${t.flight_number?('Vol '+esc(t.flight_number)+' '):''}${t.airline?('· '+esc(t.airline)):''} · Capacité ${t.current_packages||0}/${t.max_packages||0} colis · ${esc(String(t.available_weight||'?'))} kg dispo</div>`
              + `<div style="font-weight:600;margin:14px 0 6px">Missions du trajet</div><div class="table-wrap"><table style="min-width:auto"><tbody>${rows}</tbody></table></div>`
              + `<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Fermer</button>`
              + (can('trips:write')?`<button class="btn-confirm" onclick="closeModal();moderateTrip('${t.id}','${esc(t.status)}')">Modérer</button>`:'')
              + `</div>`
            );
        }
        async function moderateTrip(id, cur){
            const v = await formModal({
                title: 'Modérer le trajet',
                hint: 'Changer le statut (publier, dépublier, annuler).',
                fields: [{ name:'status', label:'Statut', type:'select', value: cur, options:['draft','published','active','completed','cancelled'] }],
                confirmLabel: 'Appliquer'
            });
            if (!v || !v.status) return;
            const { ok, json } = await api('/admin/trips/'+id, { method:'PUT', body: JSON.stringify({ status: v.status }) });
            notify(ok, 'Trajet mis à jour', json); if (ok) loadList();
        }
        async function delTrip(id, code){
            if (!await confirmDialog('Supprimer le trajet ' + code + ' ?', { danger:true, confirmLabel:'Supprimer', title:'Supprimer le trajet' })) return;
            const { ok, json } = await api('/admin/trips/'+id, { method:'DELETE' });
            notify(ok, 'Trajet supprimé', json); if (ok) loadList();
        }
        async function approveW(id){
            if (!await confirmDialog('Approuver (autoriser) ce retrait ? Vous le marquerez « payé » avec preuve une fois le virement effectué.', { title:'Approuver le retrait', confirmLabel:'Approuver' })) return;
            const { ok, json } = await api('/admin/withdrawals/'+id+'/approve', { method:'PUT' });
            notify(ok, 'Retrait approuvé — à marquer payé après virement', json); if (ok) loadList();
        }
        async function rejectW(id){
            const v = await formModal({ title:'Rejeter le retrait', fields:[{ name:'reason', label:'Raison du rejet', type:'textarea', placeholder:'Expliquez le motif…' }], confirmLabel:'Rejeter' });
            if (!v) return;
            const { ok, json } = await api('/admin/withdrawals/'+id+'/reject', { method:'PUT', body: JSON.stringify({ reason: v.reason }) });
            notify(ok, 'Retrait rejeté (solde recrédité)', json); if (ok) loadList();
        }
        async function payW(id){
            const v = await formModal({
                title: 'Marquer le retrait payé',
                hint: 'Enregistrez la preuve du virement effectué.',
                fields: [
                    { name:'reference', label:'Référence du virement', placeholder:'Ex. TXN-12345 / Wave ref' },
                    { name:'proof_url', label:'Lien de preuve (optionnel)', placeholder:'https://… reçu / capture' },
                ],
                confirmLabel: 'Confirmer le paiement'
            });
            if (!v) return;
            const { ok, json } = await api('/admin/withdrawals/'+id+'/paid', { method:'PUT', body: JSON.stringify({ reference: v.reference, proof_url: v.proof_url }) });
            notify(ok, 'Retrait marqué payé', json); if (ok) loadList();
        }
        async function refundPayment(id, code){
            const v = await formModal({
                title: 'Rembourser le paiement ' + code,
                hint: 'Enregistre le remboursement côté plateforme et notifie le payeur. Le remboursement effectif chez le prestataire (Wave/Orange) est à effectuer séparément.',
                fields: [{ name:'reason', label:'Motif du remboursement', type:'textarea', placeholder:'Ex. mission annulée, litige résolu…' }],
                confirmLabel: 'Rembourser'
            });
            if (!v) return;
            const { ok, json } = await api('/admin/payments/'+id+'/refund', { method:'POST', body: JSON.stringify({ reason: v.reason }) });
            notify(ok, 'Paiement remboursé', json); if (ok) loadList();
        }
        // Download a CSV export (authenticated fetch → blob → download).
        async function exportCsv(kind){
            try {
                const q = (state.status ? `?status=${encodeURIComponent(state.status)}` : '') + (state.search ? `${state.status?'&':'?'}search=${encodeURIComponent(state.search)}` : '');
                const res = await fetch(API + '/admin/' + kind + '/export' + q, { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) { toast('Export refusé ('+res.status+')', 'err'); return; }
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = kind + '.csv';
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
                toast('Export téléchargé', 'ok');
            } catch (e) { toast('Erreur export', 'err'); }
        }
        function playEvidence(u){
            try { window.open(decodeURIComponent(u), '_blank'); } catch (e) { toast('Impossible de lire le fichier.', 'err'); }
        }

        async function editClaim(id, cur){
            const v = await formModal({
                title: 'Traiter la réclamation',
                fields: [
                    { name:'status', label:'Statut', type:'select', value: cur, options:['open','in_progress','resolved','rejected','closed'] },
                    { name:'resolution', label:'Résolution / note (optionnel)', type:'textarea', placeholder:'Décision, compensation, note interne…' },
                ],
                confirmLabel: 'Enregistrer'
            });
            if (!v || !v.status) return;
            const body = { status: v.status };
            if (v.resolution) body.resolution = v.resolution;
            const { ok, json } = await api('/admin/claims/'+id, { method:'PUT', body: JSON.stringify(body) });
            notify(ok, 'Réclamation mise à jour', json); if (ok) loadList();
        }
        // ---------- Claim discussion thread + compensation ----------
        async function showClaimThread(id){
            const { ok, json } = await api('/admin/claims/'+id+'/thread');
            if (!ok) { toast('Erreur chargement de la réclamation', 'err'); return; }
            const c = json.data.claim; const msgs = json.data.messages || [];
            const ev = (c.evidence_urls || []).filter(Boolean);
            const evHtml = ev.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">` + ev.map(u =>
                (/\.(mp3|wav|ogg|m4a|webm)(\?|$)/i.test(u)
                    ? `<audio controls src="${esc(u)}" style="max-width:100%"></audio>`
                    : `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.15)"></a>`)).join('') + `</div>` : '';
            const thread = msgs.length ? msgs.map(mm => {
                const mine = mm.sender_role === 'admin';
                return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin:6px 0">
                    <div style="max-width:78%;background:${mine?'rgba(78,205,196,.15)':'rgba(255,255,255,.06)'};border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 12px">
                        <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:2px">${esc(mine?'Admin':(mm.sender_name||'Utilisateur'))} · ${new Date(mm.created_at).toLocaleString('fr-FR')}</div>
                        <div style="font-size:14px;white-space:pre-wrap">${esc(mm.message)}</div>
                    </div></div>`;
            }).join('') : '<div style="color:rgba(255,255,255,.4);padding:8px 0">Aucun message pour l\'instant.</div>';
            const canWrite = can('claims:write');
            const replyBox = canWrite ? `<label>Répondre</label>
                <textarea id="claimReply" rows="2" placeholder="Votre réponse au demandeur…"></textarea>
                <div class="modal-actions"><button class="btn-confirm" onclick="sendClaimReply('${c.id}')">Envoyer</button>
                <button class="btn-cancel" onclick="compensateClaimUI('${c.id}')">💰 Compenser</button>
                <button class="btn-cancel" onclick="closeModal()">Fermer</button></div>`
              : `<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Fermer</button></div>`;
            openModal(
                `<h3>${esc(c.claim_code)} <span class="badge ${badgeFor(c.status)}">${esc(c.status)}</span> <span class="badge ${badgeFor(c.priority)}">${esc(c.priority)}</span></h3>`
              + `<p class="hint">${esc(c.claim_type)} · ${esc(c.claimant_name||'—')} (${esc(c.claimant_type||'')}) · ${c.mission_code?('Mission '+esc(c.mission_code)):''}</p>`
              + `<div style="font-weight:600;margin-top:6px">${esc(c.title||'')}</div>`
              + `<div style="font-size:14px;color:rgba(255,255,255,.8);margin:4px 0">${esc(c.description||'')}</div>`
              + evHtml
              + (c.resolution?`<div style="font-size:13px;color:#7ee081;margin:6px 0">Résolution : ${esc(c.resolution)}</div>`:'')
              + (c.compensation_amount?`<div style="font-size:13px;color:#FFD700;margin:6px 0">Compensation : ${fcfa(c.compensation_amount)}</div>`:'')
              + `<div style="font-weight:600;margin:14px 0 6px">Discussion</div>`
              + `<div style="max-height:220px;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px">${thread}</div>`
              + replyBox
            );
        }
        async function sendClaimReply(id){
            const el = document.getElementById('claimReply'); const message = (el && el.value || '').trim();
            if (!message) { toast('Écrivez un message', 'err'); return; }
            const { ok, json } = await api('/admin/claims/'+id+'/reply', { method:'POST', body: JSON.stringify({ message }) });
            if (ok) { toast('Réponse envoyée', 'ok'); showClaimThread(id); } else notify(false, '', json);
        }
        async function compensateClaimUI(id){
            const v = await formModal({
                title: 'Compenser la réclamation',
                hint: 'Le montant est crédité au portefeuille si le demandeur est un GP, sinon enregistré pour versement manuel.',
                fields: [
                    { name:'amount', label:'Montant (FCFA)', inputType:'number' },
                    { name:'note', label:'Note de résolution (optionnel)', type:'textarea' },
                ],
                confirmLabel: 'Valider la compensation'
            });
            if (!v || !v.amount) return;
            const { ok, json } = await api('/admin/claims/'+id+'/compensate', { method:'POST', body: JSON.stringify({ amount: Number(v.amount), note: v.note }) });
            notify(ok, 'Compensation enregistrée', json); if (ok) { closeModal(); loadList(); }
        }
        async function deleteReview(id){
            if (!await confirmDialog('Supprimer cet avis ? La note moyenne de l\'évalué sera recalculée.', { danger:true, confirmLabel:'Supprimer', title:'Supprimer l\'avis' })) return;
            const { ok, json } = await api('/admin/reviews/'+id, { method:'DELETE' });
            notify(ok, 'Avis supprimé', json); if (ok) loadList();
        }

        // ---------- Roles & Admins ----------
        async function renderRoles(main){
            main.innerHTML = '<div class="loading">Chargement des rôles…</div>';
            const { ok, json, status } = await api('/admin/roles');
            if (!ok) { main.innerHTML = '<div class="empty">' + (status===403 ? 'Accès refusé.' : 'Erreur: ' + esc((json&&json.error)||'')) + '</div>'; return; }
            allPerms = (json.meta && json.meta.catalog) ? json.meta.catalog : allPerms;
            const roles = json.data || [];
            const canManage = can('roles:manage');
            const cards = roles.map(r => {
                const perms = Array.isArray(r.permissions) ? r.permissions : [];
                const tags = perms.includes('*')
                    ? '<span class="tag all">Toutes les permissions</span>'
                    : perms.map(p => `<span class="tag">${esc(p)}</span>`).join('') || '<span class="tag">Aucune</span>';
                const acts = [];
                if (canManage && !r.is_system) {
                    acts.push(`<button class="act act-edit" onclick="editRole('${r.id}')">Éditer</button>`);
                    acts.push(`<button class="act act-del" onclick="deleteRole('${r.id}','${esc(r.name)}')">Suppr.</button>`);
                } else if (canManage && r.is_system) {
                    acts.push(`<button class="act act-edit" onclick="editRole('${r.id}')">Renommer</button>`);
                }
                return '<div class="role-card">'
                  + '<div class="rc-head">'
                  + '<h4>' + esc(r.name) + '</h4>'
                  + (r.is_system ? '<span class="badge b-blue">système</span>' : '')
                  + '<span class="badge b-gray">' + (r.admin_count||0) + ' admin(s)</span>'
                  + '<div style="margin-left:auto;display:flex;gap:6px;">' + acts.join('') + '</div>'
                  + '</div>'
                  + (r.description ? '<div style="font-size:13px;color:rgba(255,255,255,.6)">' + esc(r.description) + '</div>' : '')
                  + '<div class="rc-perms">' + tags + '</div>'
                  + '</div>';
            }).join('');
            main.innerHTML =
                '<div class="toolbar"><div style="font-size:16px;font-weight:700;">Rôles d\'administration</div>'
              + (canManage ? '<button style="margin-left:auto" onclick="editRole()">+ Nouveau rôle</button>' : '')
              + '</div>' + (cards || '<div class="empty">Aucun rôle.</div>');
        }

        // Create (no id) or edit a custom role. System roles: name/description only.
        async function editRole(id){
            let role = null;
            if (id) {
                const { ok, json } = await api('/admin/roles');
                if (ok) role = (json.data||[]).find(r => r.id === id);
                if (json && json.meta && json.meta.catalog) allPerms = json.meta.catalog;
            }
            const isSystem = role && role.is_system;
            const cur = new Set(Array.isArray(role && role.permissions) ? role.permissions : []);
            const all = cur.has('*');
            const permBoxes = isSystem ? '' : (
                '<label>Permissions</label>'
              + '<div class="perm-grid">'
              + allPerms.map(p => `<label class="perm-chip"><input type="checkbox" data-perm value="${esc(p)}"${(all||cur.has(p))?' checked':''}> ${esc(p)}</label>`).join('')
              + '</div>');
            const ov = openModal(
                '<h3>' + (id ? 'Éditer le rôle' : 'Nouveau rôle') + '</h3>'
              + (isSystem ? '<p class="hint">Rôle système : les permissions sont gérées dans le code. Vous pouvez modifier le nom et la description.</p>' : '')
              + '<label>Nom</label><input id="roleName" value="' + esc((role&&role.name)||'') + '" placeholder="Ex. Modérateur">'
              + '<label>Description</label><input id="roleDesc" value="' + esc((role&&role.description)||'') + '" placeholder="Rôle et responsabilités">'
              + permBoxes
              + '<div class="modal-actions"><button class="btn-cancel" id="rCancel">Annuler</button>'
              + '<button class="btn-confirm" id="rOk">' + (id ? 'Enregistrer' : 'Créer') + '</button></div>');
            ov.querySelector('#rCancel').onclick = closeModal;
            ov.querySelector('#rOk').onclick = async () => {
                const name = ov.querySelector('#roleName').value.trim();
                const description = ov.querySelector('#roleDesc').value.trim();
                if (!name) { toast('Le nom est requis', 'err'); return; }
                const body = { name, description };
                if (!isSystem) body.permissions = [...ov.querySelectorAll('[data-perm]:checked')].map(c => c.value);
                let res;
                if (id) res = await api('/admin/roles/'+id, { method:'PUT', body: JSON.stringify(body) });
                else res = await api('/admin/roles', { method:'POST', body: JSON.stringify(body) });
                if (res.ok) { closeModal(); toast(id ? 'Rôle mis à jour' : 'Rôle créé', 'ok'); renderRoles(document.getElementById('main')); }
                else toast((res.json && (res.json.error||res.json.message)) || 'Erreur', 'err');
            };
        }
        async function deleteRole(id, name){
            if (!await confirmDialog('Supprimer le rôle « ' + name + ' » ?', { danger:true, confirmLabel:'Supprimer', title:'Supprimer le rôle' })) return;
            const { ok, json } = await api('/admin/roles/'+id, { method:'DELETE' });
            notify(ok, 'Rôle supprimé', json); if (ok) renderRoles(document.getElementById('main'));
        }
        // Assign an admin role to a user (promotes them to admin).
        async function assignRole(userId, email){
            const { ok, json } = await api('/admin/roles');
            if (!ok) { toast('Impossible de charger les rôles', 'err'); return; }
            const roles = json.data || [];
            const v = await formModal({
                title: 'Attribuer un rôle admin',
                hint: 'À ' + email + '. L\'utilisateur devient administrateur avec les permissions du rôle.',
                fields: [{ name:'role_id', label:'Rôle', type:'select', options: roles.map(r => [r.id, r.name + (r.is_system?' (système)':'')]) }],
                confirmLabel: 'Attribuer'
            });
            if (!v || !v.role_id) return;
            const res = await api('/admin/users/'+userId+'/role', { method:'PUT', body: JSON.stringify({ role_id: v.role_id }) });
            notify(res.ok, 'Rôle attribué', res.json); if (res.ok) loadList();
        }

        // ---------- Boot ----------
        if (token && me && me.user_type === 'admin') showApp();
    </script>
</body>
</html>
