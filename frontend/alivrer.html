<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Colis à livrer</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%); min-height:100vh; display:flex; justify-content:center; color:#fff; }
        .mobile-frame { width:100%; max-width:480px; min-height:100vh; min-height:100dvh; position:relative;
            background:linear-gradient(135deg, rgba(15,12,41,.95), rgba(36,36,62,.95)); }
        .header { display:flex; align-items:center; gap:14px; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.1);
            position:sticky; top:0; background:rgba(20,18,40,.85); backdrop-filter:blur(10px); z-index:5; }
        .back-btn { width:38px; height:38px; border:none; border-radius:11px; cursor:pointer; background:rgba(255,255,255,.1); color:#fff; font-size:18px; }
        .header h1 { font-size:18px; }
        .content { padding:18px; }
        .card { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:16px; margin-bottom:12px; }
        .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .recipient { font-size:16px; font-weight:800; }
        .code { font-size:11px; color:rgba(255,255,255,.5); }
        .badge { padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; }
        .b-yellow{background:rgba(255,215,0,.18);color:#FFD700}.b-blue{background:rgba(78,205,196,.2);color:#4ECDC4}.b-green{background:rgba(76,175,80,.2);color:#7ee081}
        .route { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; }
        .route .flag{font-size:18px;} .route .arrow{color:rgba(255,255,255,.4);}
        .line { font-size:13px; color:rgba(255,255,255,.8); margin-bottom:6px; }
        .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
        .btn { flex:1; min-width:120px; padding:11px; border:none; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; text-align:center; }
        .btn-call { background:rgba(76,175,80,.25); color:#7ee081; }
        .btn-next { background:linear-gradient(135deg,#FFD700,#FFA500); color:#1a1a2e; }
        .note { font-size:12px; color:rgba(255,255,255,.55); margin-top:10px; }
        .loading,.empty { text-align:center; padding:50px 20px; color:rgba(255,255,255,.55); }
        .empty .ic{font-size:44px;margin-bottom:10px;}
        .scan-cta { width:100%; padding:15px; border:none; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#4ECDC4,#44A08D); color:#06231f; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 6px 18px rgba(78,205,196,.35); }
        .scan-overlay { display:none; position:fixed; inset:0; background:rgba(8,6,20,.96); z-index:1000; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:18px; }
        .scan-box { position:relative; width:min(86vw,320px); aspect-ratio:1; border-radius:18px; overflow:hidden; background:#000; }
        .scan-box video { width:100%; height:100%; object-fit:cover; }
        .scan-frame { position:absolute; inset:14%; border:3px solid #4ECDC4; border-radius:14px; box-shadow:0 0 0 100vmax rgba(0,0,0,.4); pointer-events:none; }
        .scan-status { font-size:14px; text-align:center; color:#fff; max-width:320px; line-height:1.5; min-height:20px; }
        .scan-actions { display:flex; gap:10px; }
        .scan-btn { padding:12px 22px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#FFD700,#FFA500); color:#1a1a2e; }
        .scan-btn.ghost { background:rgba(255,255,255,.12); color:#fff; }
    </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
</head>
<body class="ds">
    <div class="mobile-frame">
        <div class="header">
            <button class="back-btn" onclick="location.href='dashgp.html'">←</button>
            <h1><svg class="ic" viewBox="0 0 24 24" style="vertical-align:-3px;"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> Colis à livrer</h1>
        </div>
        <div class="content">
            <button class="scan-cta" onclick="openScanner()">
                <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
                Scanner le QR du destinataire
            </button>
            <div id="list"><div class="loading">Chargement…</div></div>
        </div>
    </div>

    <!-- QR scanner overlay -->
    <div id="scanOverlay" class="scan-overlay">
        <div class="scan-box">
            <video id="scanVideo" playsinline muted></video>
            <div class="scan-frame"></div>
        </div>
        <div id="scanStatus" class="scan-status">Initialisation de la caméra…</div>
        <div class="scan-actions">
            <button id="scanRetry" class="scan-btn" style="display:none;" onclick="retryScan()">Rescanner</button>
            <button class="scan-btn ghost" onclick="closeScanner()">Fermer</button>
        </div>
    </div>

    <script>
        const API = window.API_BASE_URL;
        const token = localStorage.getItem('authToken');
        let items = [];
        // Opened from a mission card (?mission=<id>): scope the scanner to that one
        // colis — show only it and accept only its QR.
        const focusMissionId = new URLSearchParams(location.search).get('mission');
        let scannerAutoOpened = false;

        const FLAGS={'Sénégal':'🇸🇳','Senegal':'🇸🇳','France':'🇫🇷','Espagne':'🇪🇸','Italie':'🇮🇹','USA':'🇺🇸','États-Unis':'🇺🇸','Canada':'🇨🇦','Royaume-Uni':'🇬🇧','Allemagne':'🇩🇪','Maroc':'🇲🇦','Mali':'🇲🇱'};
        const flag=c=>FLAGS[c]||'🌍';
        const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const ACTIVE=['accepted','picked_up','in_transit','in_customs','out_for_delivery'];
        const STATUS={accepted:['Accepté','b-blue'],picked_up:['Récupéré','b-blue'],in_transit:['En transit','b-blue'],in_customs:['En douane','b-blue'],out_for_delivery:['En livraison','b-blue']};
        // Étape suivante (le statut 'delivered' final est confirmé par le destinataire via QR).
        const NEXT={accepted:['picked_up','Marquer récupéré'],picked_up:['in_transit','Départ en transit'],in_transit:['out_for_delivery','En livraison'],in_customs:['out_for_delivery','En livraison']};
        function badge(s){var m=STATUS[String(s||'').toLowerCase()]||[s,'b-yellow'];return '<span class="badge '+m[1]+'">'+esc(m[0])+'</span>';}

        async function load(){
            if(!token){ location.href='connexion.html'; return; }
            try{
                const res=await fetch(`${API}/missions/my-missions?limit=200`,{headers:{'Authorization':'Bearer '+token}});
                if(!res.ok) throw new Error('Chargement impossible');
                const data=(await res.json()).data||[];
                items=data.filter(m=>ACTIVE.includes(String(m.status||'').toLowerCase()));
                if (focusMissionId) items = items.filter(m => String(m.id) === String(focusMissionId));
                render();
                // Guided flow: auto-open the camera on the targeted colis.
                if (focusMissionId && items.length && !scannerAutoOpened){ scannerAutoOpened = true; openScanner(); }
            }catch(e){ document.getElementById('list').innerHTML='<div class="empty">Erreur: '+esc(e.message)+'</div>'; }
        }

        function render(){
            const box=document.getElementById('list');
            if(!items.length){ box.innerHTML='<div class="empty"><div class="ic"><svg class="ic" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>Aucun colis à livrer pour le moment.</div>'; return; }
            box.innerHTML=items.map(function(m){
                const st=String(m.status||'').toLowerCase();
                const phone=(m.recipient_phone||'').replace(/\s/g,'');
                const nxt=NEXT[st];
                return '<div class="card">'
                    +'<div class="top"><div><div class="recipient">'+(m.recipient_name?esc(m.recipient_name):'⚠️ Destinataire non renseigné')+'</div>'
                    +'<div class="code">'+esc(m.mission_code||m.tracking_number||'')+'</div></div>'+badge(m.status)+'</div>'
                    +'<div class="route"><span class="flag">'+flag(m.departure_country)+'</span><span>'+esc(m.departure_city||'')+'</span><span class="arrow">→</span><span class="flag">'+flag(m.arrival_country)+'</span><span>'+esc(m.arrival_city||'')+'</span></div>'
                    +(m.recipient_phone?'<div class="line"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg> '+esc(m.recipient_phone)+'</div>':'')
                    +(m.delivery_address?'<div class="line"><svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> '+esc(m.delivery_address)+'</div>':'')
                    +'<div class="line"><svg class="ic" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg> '+(parseFloat(m.package_weight)||0)+' kg</div>'
                    +'<div class="actions">'
                    +(phone?'<a class="btn btn-call" href="tel:'+esc(phone)+'"><svg class="ic" viewBox="0 0 24 24" style="vertical-align:-3px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Appeler</a>':'')
                    +(nxt?'<button class="btn btn-next" onclick="advance(\''+m.id+'\',\''+nxt[0]+'\')">'+nxt[1]+'</button>':'')
                    +'</div>'
                    +(st==='out_for_delivery'?'<div class="note">À la remise, scannez le QR code du destinataire (bouton ci-dessus) pour confirmer la livraison.</div>':'')
                    +'</div>';
            }).join('');
        }

        async function advance(id, next){
            if(!confirm('Confirmer : passer ce colis à « '+next+' » ?')) return;
            try{
                const res=await fetch(`${API}/missions/${id}/status`,{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({status:next})});
                const j=await res.json();
                if(res.ok&&j.success){ load(); } else alert('Erreur: '+(j.error||j.message||''));
            }catch(e){ alert('Erreur de connexion.'); }
        }

        // ───────── QR scanner (GP scans the recipient's QR to confirm delivery) ─────────
        let scanStream = null, scanRAF = null, scanning = false, barcodeDetector = null;

        function openScanner(){
            document.getElementById('scanRetry').style.display = 'none';
            document.getElementById('scanOverlay').style.display = 'flex';
            startScan();
        }
        function closeScanner(){
            scanning = false;
            if (scanRAF) cancelAnimationFrame(scanRAF);
            if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
            document.getElementById('scanOverlay').style.display = 'none';
        }
        function setScanStatus(t){ document.getElementById('scanStatus').textContent = t; }

        // Native BarcodeDetector when available; otherwise load jsQR from CDN.
        function ensureJsQR(){
            if (window.jsQR) return Promise.resolve(true);
            return new Promise(resolve => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
                s.onload = () => resolve(true);
                s.onerror = () => resolve(false);
                document.head.appendChild(s);
            });
        }

        async function startScan(){
            document.getElementById('scanRetry').style.display = 'none';
            setScanStatus('Initialisation de la caméra…');
            const video = document.getElementById('scanVideo');
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = scanStream;
                await video.play();
            } catch (e){
                setScanStatus('Caméra indisponible. Autorisez l’accès à la caméra dans les réglages.');
                return;
            }
            setScanStatus('Visez le QR code du destinataire…');
            scanning = true;

            if ('BarcodeDetector' in window){
                try { barcodeDetector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e){ barcodeDetector = null; }
            }
            if (!barcodeDetector){ await ensureJsQR(); }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            async function tick(){
                if (!scanning) return;
                if (video.readyState === video.HAVE_ENOUGH_DATA){
                    let code = null;
                    if (barcodeDetector){
                        try { const found = await barcodeDetector.detect(video); if (found && found.length) code = found[0].rawValue; } catch (e){}
                    } else if (window.jsQR){
                        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const r = window.jsQR(img.data, img.width, img.height);
                        if (r) code = r.data;
                    }
                    if (code){ scanning = false; onScanned(code); return; }
                }
                scanRAF = requestAnimationFrame(tick);
            }
            tick();
        }

        async function onScanned(qrText){
            // Scoped scan: only the targeted mission's QR is accepted here.
            if (focusMissionId){
                let scannedId = null;
                try { scannedId = JSON.parse(qrText).id; } catch(e){}
                if (String(scannedId) !== String(focusMissionId)){
                    if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
                    setScanStatus('❌ Ce QR ne correspond pas à ce colis. Scannez le bon destinataire.');
                    document.getElementById('scanRetry').style.display = 'inline-block';
                    return;
                }
            }
            if (scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
            setScanStatus('Vérification du colis…');
            try {
                const res = await fetch(`${API}/missions/verify-qr`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_data: qrText })
                });
                const j = await res.json().catch(() => ({}));
                if (res.ok && j.success){
                    const m = (j.data && j.data.mission) || {};
                    closeScanner();
                    await window.sengpAlert(
                        '✅ Colis ' + (m.mission_code || '') + ' livré' + (m.recipient_name ? ' à ' + m.recipient_name : '') +
                        ' !\n\nL’expéditeur et l’administration ont été notifiés.',
                        'Livraison confirmée'
                    );
                    load();
                } else {
                    setScanStatus('❌ ' + (j.error || j.message || 'QR non reconnu.'));
                    document.getElementById('scanRetry').style.display = 'inline-block';
                }
            } catch (e){
                setScanStatus('❌ Erreur réseau. Réessayez.');
                document.getElementById('scanRetry').style.display = 'inline-block';
            }
        }
        function retryScan(){ startScan(); }

        window.onPullRefresh = async () => { await load(); return true; };
        load();
    </script>
    <script src="ptr.js"></script>
</body>
</html>
