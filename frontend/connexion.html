<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Connexion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #07142F; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #07142F;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #F8FAFF;
        }

        /* ============================================
           LOGIN SCREEN
           ============================================ */
        .mobile-frame { position: relative; width: 100%; overflow: hidden; background: #07142F; }

        .lg-bg { position: absolute; inset: 0; z-index: 0; }
        .lg-bg img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
        .lg-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                rgba(7, 20, 47, 0.1) 0%,
                rgba(7, 20, 47, 0.42) 30%,
                rgba(7, 20, 47, 0.76) 56%,
                rgba(7, 20, 47, 0.92) 100%);
        }

        .lg-scroll {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lg-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; margin: auto 0; }

        .back-to-choice {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 14px);
            left: 16px;
            z-index: 3;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(7, 20, 47, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            color: #F8FAFF;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .back-to-choice .lg-i { width: 22px; height: 22px; }
        .back-to-choice:active { transform: scale(0.96); }

        .lg-i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

        .lg-logo {
            display: block;
            width: clamp(84px, 14dvh, 124px);
            height: auto;
            aspect-ratio: 1;
            margin-top: clamp(26px, 4dvh, 40px);
            border-radius: 22%;
            box-shadow: 0 0 0 1px rgba(255, 194, 71, 0.38), 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 34px rgba(255, 106, 36, 0.22);
        }

        .lg-title {
            margin-top: clamp(12px, 2.4dvh, 22px);
            font-size: clamp(30px, 4.6dvh, 38px);
            font-weight: 800;
            line-height: 1.15;
            text-align: center;
            color: #F8FAFF;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
        }
        .lg-title span {
            background: linear-gradient(90deg, #FF8A2B, #FFC247);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #FFC247;
        }
        .lg-sub { margin-top: 8px; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.45; color: #D2DBEC; text-shadow: 0 1px 10px rgba(7, 20, 47, 0.95); }

        .lg-card {
            width: 100%;
            margin-top: clamp(18px, 3dvh, 28px);
            padding: 16px;
            border-radius: 28px;
            border: 1px solid rgba(255, 160, 70, 0.45);
            background: linear-gradient(160deg, rgba(16, 41, 75, 0.62), rgba(7, 20, 47, 0.8));
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            box-shadow: 0 0 0 1px rgba(255, 140, 50, 0.1), 0 0 40px rgba(255, 106, 36, 0.16), 0 22px 50px rgba(0, 0, 0, 0.45);
        }

        .social-buttons { margin-bottom: 4px; }
        .social-btn {
            position: relative;
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .social-btn-google { background: #F8FAFF; color: #0B1D3A; padding: 0 44px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
        .social-btn-google .lg-chevron { position: absolute; right: 18px; width: 20px; height: 20px; color: #4A5878; }
        .social-btn-google > svg:first-child { position: absolute; left: 18px; }
        .social-btn:active { transform: scale(0.985); }

        .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
        .divider-line { flex: 1; height: 1px; background: rgba(170, 184, 208, 0.28); }
        .divider-text { font-size: 14px; color: #C3CEE2; white-space: nowrap; }

        .lg-field {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 62px;
            padding: 6px 16px;
            margin-bottom: 12px;
            border-radius: 18px;
            border: 1px solid rgba(170, 184, 208, 0.3);
            background: rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .lg-field:focus-within { border-color: #FFC247; background: rgba(255, 255, 255, 0.09); box-shadow: 0 0 0 3px rgba(255, 194, 71, 0.18); }
        .lg-field__icon { width: 24px; height: 24px; color: #E4EAF6; }
        .lg-field__body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
        .lg-field label { font-size: 14px; font-weight: 600; color: #E4EAF6; line-height: 1.2; }
        .ds .lg-field input,
        .ds .lg-field input:focus {
            width: 100%;
            padding: 2px 0;
            border: 0;
            border-radius: 0;
            outline: none;
            box-shadow: none;
            background: transparent;
            color: #F8FAFF;
            font: inherit;
            font-size: 16px;
            line-height: 1.3;
            text-overflow: ellipsis;
        }
        .lg-field input::placeholder { color: #93A3C0; opacity: 1; font-size: 14px; }
        .lg-eye {
            width: 44px;
            height: 44px;
            margin-right: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: #E4EAF6;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .lg-eye .lg-i { width: 24px; height: 24px; }
        .lg-eye .lg-eye__off { display: none; }
        .lg-eye.is-visible .lg-eye__on { display: none; }
        .lg-eye.is-visible .lg-eye__off { display: inline; }

        .form-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; margin: 0 0 12px; }
        .remember-me { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 14px; color: #E4EAF6; -webkit-tap-highlight-color: transparent; }
        .ds .remember-me input { position: static; }
        .remember-me input {
            -webkit-appearance: none;
            appearance: none;
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            margin: 0;
            border-radius: 7px;
            border: 2px solid rgba(228, 234, 246, 0.6);
            background: transparent;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .remember-me input::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #07142F; border-bottom: 3px solid #07142F; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform 0.15s ease; }
        .remember-me input:checked { background: #F8FAFF; border-color: #F8FAFF; }
        .remember-me input:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
        .forgot-password { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; color: #FFC247; text-decoration: none; }
        .forgot-password:hover { color: #FF8B2E; }

        .login-btn {
            width: 100%;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            border-radius: 18px;
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #07142F;
            background: linear-gradient(90deg, #FF6A24, #FFC247);
            box-shadow: 0 10px 26px rgba(255, 106, 36, 0.35);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s ease;
        }
        .login-btn .lg-i { width: 22px; height: 22px; stroke-width: 2.6; }
        .login-btn:not(:disabled):active { transform: scale(0.985); filter: brightness(0.94); }
        .login-btn:disabled { opacity: 0.65; cursor: progress; }

        .signup-link { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 15px; color: #C3CEE2; }
        .signup-link .divider-line { flex: 1; }
        .signup-link > span:not(.divider-line) { text-align: center; }
        .signup-link a { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; font-weight: 700; color: #FFC247; text-decoration: none; }
        .signup-link a .lg-i { width: 18px; height: 18px; }
        .signup-link a:hover { color: #FF8B2E; }

        .back-to-choice:focus-visible, .lg-eye:focus-visible, .login-btn:focus-visible, .social-btn:focus-visible,
        .forgot-password:focus-visible, .signup-link a:focus-visible, .remember-me input:focus-visible { outline: 2px solid #F8FAFF; outline-offset: 3px; }

        .lg-reveal { animation: lgReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
        @keyframes lgReveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .lg-reveal { animation: none; }
            * { transition-duration: 0.01ms !important; }
        }

        @media (max-width: 359px) {
            .lg-scroll { padding-left: 14px; padding-right: 14px; }
            .lg-card { padding: 14px; border-radius: 24px; }
            .lg-field { gap: 10px; padding: 8px 12px; }
            .lg-title { font-size: 28px; }
            .signup-link { font-size: 14px; }
        }
        @media (max-height: 640px) {
            .lg-logo { width: 76px; }
            .lg-sub { display: none; }
            .lg-field { min-height: 60px; margin-bottom: 10px; }
        }

        /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}
    </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SEN GP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script src="pwa.js" defer></script>
    <script src="gauth.js" defer></script>
</head>
<body class="ds">
    <div class="mobile-frame">
        <div class="lg-bg" aria-hidden="true">
            <picture>
                <source type="image/webp" srcset="im/sengp-auth-background.webp">
                <img src="im/sengp-auth-background.jpg" alt="" width="941" height="1672" decoding="async">
            </picture>
        </div>

        <!-- Back to account-type choice -->
        <button type="button" class="back-to-choice" onclick="window.location.href='index.html'" aria-label="Retour au choix du compte">
            <svg class="lg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>

        <div class="lg-scroll">
            <div class="lg-wrap">
                <picture class="lg-reveal" style="--i:0">
                    <source type="image/webp" srcset="im/sengp-logo-square.webp">
                    <img class="lg-logo" src="im/sengp-logo-square.png" alt="SENGP" width="288" height="288" decoding="async">
                </picture>

                <h1 class="lg-title lg-reveal" style="--i:1">Bon <span>retour&nbsp;!</span></h1>
                <p class="lg-sub lg-reveal" style="--i:1">Connectez-vous à votre compte pour continuer votre expérience SENGP.</p>

                <div class="lg-card lg-reveal" style="--i:2">
                    <form id="loginForm">
                        <!-- Social Login Buttons (Top) -->
                        <div class="social-buttons">
                            <button type="button" class="social-btn social-btn-google" onclick="socialLogin('google')">
                                <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M19.6 10.23c0-.82-.07-1.43-.21-2.05H10v3.72h5.51c-.11.92-.72 2.31-2.08 3.24l-.02.13 3.03 2.34.21.02c1.92-1.77 3.03-4.38 3.03-7.4z" fill="#4285F4"/>
                                    <path d="M10 20c2.7 0 4.96-.88 6.62-2.39l-3.22-2.49c-.85.58-1.98 1-3.4 1-2.61 0-4.82-1.74-5.61-4.13l-.12.01-3.14 2.42-.04.11C2.61 17.91 6.08 20 10 20z" fill="#34A853"/>
                                    <path d="M4.39 11.99c-.2-.58-.32-1.2-.32-1.84 0-.64.11-1.26.31-1.84l-.01-.14-3.18-2.46-.1.05C.41 7.43 0 8.68 0 10c0 1.32.41 2.57 1.1 3.58l3.29-2.59z" fill="#FBBC05"/>
                                    <path d="M10 3.88c1.85 0 3.1.8 3.81 1.47l2.8-2.73C14.96.88 12.7 0 10 0 6.08 0 2.61 2.09 1.1 5.17l3.29 2.59c.79-2.39 3-4.13 5.61-4.13z" fill="#EB4335"/>
                                </svg>
                                <span>Continuer avec Google</span>
                                <svg class="lg-i lg-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                        </div>

                        <!-- Divider -->
                        <div class="divider">
                            <div class="divider-line"></div>
                            <span class="divider-text">Ou avec email/téléphone</span>
                            <div class="divider-line"></div>
                        </div>

                        <!-- Email / Phone -->
                        <div class="lg-field">
                            <svg class="lg-i lg-field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            <div class="lg-field__body">
                                <label for="identifier">Email ou téléphone</label>
                                <input
                                    type="text"
                                    id="identifier"
                                    name="identifier"
                                    placeholder="votre@email.com ou +221 77 123 45 67"
                                    autocomplete="username"
                                    autocapitalize="none"
                                    autocorrect="off"
                                    spellcheck="false"
                                    required
                                />
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="lg-field">
                            <svg class="lg-i lg-field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <div class="lg-field__body">
                                <label for="password">Mot de passe</label>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="••••••••"
                                    autocomplete="current-password"
                                    required
                                />
                            </div>
                            <button type="button" class="lg-eye" onclick="togglePassword(this)" aria-label="Afficher le mot de passe" aria-pressed="false">
                                <svg class="lg-i lg-eye__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="lg-i lg-eye__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                            </button>
                        </div>

                        <!-- Footer -->
                        <div class="form-footer">
                            <label class="remember-me">
                                <input type="checkbox" id="rememberCheckbox">
                                <span class="remember-label">Se souvenir de moi</span>
                            </label>
                            <a href="#" class="forgot-password" onclick="goToForgotPassword()">Mot de passe oublié ?</a>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" class="login-btn">
                            <span class="btn-label">Se connecter</span>
                            <svg class="lg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </button>

                        <!-- Signup Link -->
                        <div class="signup-link">
                            <span class="divider-line"></span>
                            <span>Pas encore de compte ? <a href="#" onclick="goToSignup()">S'inscrire <svg class="lg-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a></span>
                            <span class="divider-line"></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        function togglePassword(btn) {
            const input = document.getElementById('password');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.classList.toggle('is-visible', show);
            btn.setAttribute('aria-pressed', String(show));
            btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
        }

        function goToForgotPassword() {
            event.preventDefault();
            // Rediriger vers la page de récupération du mot de passe
            window.location.href = 'oublie.html';
        }

        function goToSignup() {
            event.preventDefault();
            const t = new URLSearchParams(window.location.search).get('type');
            window.location.href = t ? `inscrire.html?type=${t}` : 'inscrire.html';
        }

        // Account type chosen on the onboarding screen (carrier = GP, sender = Expéditeur).
        const EXPECTED_TYPE = (() => {
            const t = new URLSearchParams(window.location.search).get('type');
            if (t === 'carrier' || t === 'gp') return 'gp';
            if (t === 'sender' || t === 'expediteur') return 'expediteur';
            return null;
        })();
        function typeLabel(t) { return t === 'gp' ? 'Gros Porteur' : 'Expéditeur'; }
        function enforceAccountType(user) {
            if (EXPECTED_TYPE && user && user.user_type !== EXPECTED_TYPE) {
                alert(`Ce compte est un compte « ${typeLabel(user.user_type)} ». Vous avez choisi « ${typeLabel(EXPECTED_TYPE)} ». Connectez-vous avec le profil correspondant.`);
                return false;
            }
            return true;
        }

        let googleAuthReady = false;
        async function ensureGoogleAuth(GoogleAuth) {
            if (googleAuthReady) return;
            // Sans initialize(), le plugin natif Android lève une exception qui
            // fait planter (fermer) l'application. On l'initialise donc une fois.
            try {
                if (typeof GoogleAuth.initialize === 'function') {
                    await GoogleAuth.initialize({
                        clientId: '1022151111172-re1mqoru6lo5fvgbnkrjqfk7vtoj1rco.apps.googleusercontent.com',
                        scopes: ['profile', 'email'],
                        grantOfflineAccess: false
                    });
                }
                googleAuthReady = true;
            } catch (e) {
                console.warn('GoogleAuth.initialize a échoué (on continue):', e);
            }
        }

        // Envoie l'ID token Google au backend puis route vers le bon tableau de bord.
        // Utilisé par l'app native (plugin Capacitor) ET par le web (gauth.js / GIS).
        async function finishGoogleAuth(idToken) {
            const response = await fetch(`${window.API_BASE_URL}/auth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_token: idToken, ...(EXPECTED_TYPE ? { expected_type: EXPECTED_TYPE } : {}) })
            });
            const data = await response.json();

            if (response.ok && data.success) {
                if (!enforceAccountType(data.data.user)) return;
                localStorage.setItem('authToken', data.data.token);
                localStorage.setItem('userData', JSON.stringify(data.data.user));
                const ut = data.data.user.user_type;
                window.location.href = ut === 'gp' ? 'dashgp.html' : 'dashexpediteur.html';
            } else {
                alert('Erreur Google: ' + (data.error || 'Connexion échouée'));
            }
        }

        // Callback du bouton Google officiel affiché sur le web par gauth.js
        window.handleGoogleCredential = async function (idToken) {
            try {
                await finishGoogleAuth(idToken);
            } catch (e) {
                console.error('Google sign-in error', e);
                alert('Connexion Google échouée. Vérifiez votre connexion et réessayez.');
            }
        };

        async function socialLogin(provider) {
            if (provider !== 'google') return;
            try {
                const GoogleAuth = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuth;
                if (!GoogleAuth) {
                    alert('La connexion Google est disponible dans l\'application mobile.');
                    return;
                }
                await ensureGoogleAuth(GoogleAuth);
                // Déconnecter la session Google précédente pour TOUJOURS afficher le
                // sélecteur de compte (ne pas reprendre automatiquement le dernier compte).
                try { await GoogleAuth.signOut(); } catch (_) {}
                const result = await GoogleAuth.signIn();
                // L'emplacement de l'idToken varie selon la version du plugin / Capacitor.
                const idToken =
                    (result && result.authentication && (result.authentication.idToken || result.authentication.id_token)) ||
                    (result && (result.idToken || result.id_token)) ||
                    (result && result.authentication && result.authentication.accessToken);
                if (!idToken) {
                    alert('Réponse Google inattendue (pas d\'idToken).\n\nReçu:\n' + JSON.stringify(result).slice(0, 500));
                    throw new Error('Token Google manquant');
                }

                await finishGoogleAuth(idToken);
            } catch (e) {
                console.error('Google sign-in error', e);
                // Dump complet de l'erreur pour diagnostic (code, message, et toutes les propriétés).
                let parts = [];
                if (e) {
                    if (e.message) parts.push('message: ' + e.message);
                    if (e.code !== undefined) parts.push('code: ' + e.code);
                    if (e.errorMessage) parts.push('errorMessage: ' + e.errorMessage);
                    try {
                        const all = {};
                        Object.getOwnPropertyNames(e).forEach(k => { try { all[k] = e[k]; } catch (_) {} });
                        const json = JSON.stringify(all);
                        if (json && json !== '{}') parts.push('raw: ' + json);
                    } catch (_) {}
                    if (parts.length === 0) parts.push(String(e));
                }
                alert('Connexion Google échouée.\n\n' + (parts.join('\n') || '(aucun détail)'));
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            if (identifier && password) {
                try {
                    // Afficher un loader
                    const submitButton = document.querySelector('button[type="submit"]');
                    const labelEl = submitButton.querySelector('.btn-label');
                    const originalText = labelEl.textContent;
                    labelEl.textContent = 'Connexion en cours...';
                    submitButton.disabled = true;

                    // Appeler l'API de connexion
                    const response = await fetch(`${window.API_BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: identifier,
                            password: password,
                            ...(EXPECTED_TYPE ? { expected_type: EXPECTED_TYPE } : {})
                        })
                    });

                    const result = await response.json();

                    console.log('Login response:', result);

                    if (response.ok && result.success) {
                        console.log('=== LOGIN SUCCESS ===');
                        console.log('Full response:', result);

                        // Sauvegarder le token et les données utilisateur
                        const token = result.data.token;
                        const user = result.data.user;

                        if (!enforceAccountType(user)) {
                            labelEl.textContent = originalText;
                            submitButton.disabled = false;
                            return;
                        }

                        console.log('Token to save:', token);
                        console.log('User data to save:', user);

                        localStorage.setItem('authToken', token);
                        localStorage.setItem('userData', JSON.stringify(user));

                        // Vérifier immédiatement après sauvegarde
                        const savedToken = localStorage.getItem('authToken');
                        const savedUser = localStorage.getItem('userData');

                        console.log('Verification - Token saved:', savedToken ? 'Yes' : 'No', savedToken);
                        console.log('Verification - User data saved:', savedUser ? 'Yes' : 'No', savedUser);

                        // Déterminer le dashboard
                        const userType = user.user_type;
                        const dashboardUrl = userType === 'expediteur' ? 'dashexpediteur.html' : 'dashgp.html';

                        console.log('User type:', userType);
                        console.log('Redirecting to:', dashboardUrl);

                        alert('Connexion réussie !\n\nRedirection vers le tableau de bord...');

                        // Rediriger immédiatement après l'alerte
                        window.location.href = dashboardUrl;
                    } else {
                        // Afficher l'erreur (inclut le refus de type de compte côté serveur)
                        alert('Erreur de connexion:\n\n' + (result.error || result.message || 'Email ou mot de passe incorrect'));
                        labelEl.textContent = originalText;
                        submitButton.disabled = false;
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('Erreur de connexion:\n\nImpossible de se connecter au serveur. Assurez-vous que le backend est démarré.');

                    // Réactiver le bouton
                    const submitButton = document.querySelector('button[type="submit"]');
                    submitButton.querySelector('.btn-label').textContent = 'Se connecter';
                    submitButton.disabled = false;
                }
            }
        });
    </script>
