<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Dashboard Expéditeur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #F4F8FD; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F4F8FD;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #0B1D3A;
        }

        /* ============================================
           SENDER HOME
           ============================================ */
        .mobile-frame { position: relative; width: 100%; overflow: hidden; background: #F4F8FD; }
        .hm-screen { position: absolute; inset: 0; background: #F4F8FD; }
        .hm-i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

        .hm-scroll {
            position: absolute;
            top: 0; left: 0; right: 0;
            bottom: calc(68px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        .hm-bg { position: absolute; top: 0; left: 0; right: 0; z-index: 0; pointer-events: none; aspect-ratio: 941 / 1672; background: linear-gradient(180deg, #0B1D3A 0%, #2B4A7A 42%, #F4F8FD 88%); }
        .hm-bg img { display: block; width: 100%; height: auto; }
        .hm-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(7, 20, 47, 0.38) 0%, rgba(7, 20, 47, 0) 26%),
                linear-gradient(180deg, rgba(7, 20, 47, 0) 22%, rgba(7, 20, 47, 0.5) 38%, rgba(7, 20, 47, 0) 56%),
                linear-gradient(180deg, rgba(244, 248, 253, 0) 58%, #F4F8FD 100%);
        }

        .hm-page {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 16px;
        }

        /* ---- top row ---- */
        .hm-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .hm-brand { display: flex; flex-direction: column; align-items: flex-start; }
        .hm-logo { display: block; width: clamp(100px, 29vw, 132px); height: auto; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45)); }
        .hm-tagline { margin-top: 2px; font-size: 9px; font-style: italic; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F8FAFF; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }

        .hm-avatar {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid #F8FAFF;
            background: #9A6A4F center / cover no-repeat;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            cursor: pointer;
        }
        .hm-avatar.has-photo span { display: none; }
        .hm-avatar__dot { position: absolute; right: 0; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: #22C55E; border: 2px solid #F8FAFF; }

        /* ---- greeting ---- */
        .hm-greeting { margin-top: clamp(48px, 13.5dvh, 140px); }
        .hm-greeting h1 { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -0.3px; color: #F8FAFF; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
        .hm-greeting h1 .hm-name { background: linear-gradient(90deg, #F5B335, #E8890C); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #F5B335; }
        .hm-greeting p { margin-top: 4px; font-size: 16px; color: #DCE5F3; text-shadow: 0 1px 10px rgba(7, 20, 47, 0.8); }

        /* ---- cards ---- */
        .hm-card { background: #fff; border-radius: 26px; box-shadow: 0 10px 30px rgba(11, 29, 58, 0.09); }

        .hm-route { margin-top: 16px; padding: 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; }
        .hm-side { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 56px; padding: 4px 2px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 16px; }
        .hm-flag { flex-shrink: 0; width: 36px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; border-radius: 6px; }
        .hm-side__txt { display: flex; flex-direction: column; min-width: 0; }
        .hm-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B7A93; }
        .hm-place { font-size: 15px; font-weight: 700; line-height: 1.2; color: #0B1D3A; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
        .hm-place--ph { color: #0B1D3A; }
        .hm-side .hm-i { width: 18px; height: 18px; color: #8A97AD; margin-left: auto; }
        .hm-swap { width: 42px; height: 42px; flex-shrink: 0; border: 0; border-radius: 50%; background: #EDF1F7; color: #0B1D3A; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.25s ease, background 0.2s ease; }
        .hm-swap .hm-i { width: 22px; height: 22px; }
        .hm-swap:active { transform: rotate(180deg) scale(0.94); background: #E1E8F2; }

        .hm-stats { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .hm-stat { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 16px 14px; border: 0; border-radius: 24px; text-align: left; cursor: pointer; transition: transform 0.15s ease; }
        .hm-stat:active { transform: scale(0.985); }
        .hm-stat--active { background: #FFF4E4; color: #E8890C; }
        .hm-stat--done { background: #EAF3FF; color: #0B2A55; }
        .hm-stat__icon { width: 40px; height: 40px; margin-top: 4px; }
        .hm-stat__body { display: flex; flex-direction: column; min-width: 0; padding-right: 14px; }
        .hm-stat__label { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #6B7A93; }
        .hm-stat__value { font-size: 36px; font-weight: 800; line-height: 1.1; color: #0B1D3A; }
        .hm-stat__note { font-size: 14px; color: #6B7A93; }
        .hm-stat__go { position: absolute; top: 14px; right: 12px; width: 18px; height: 18px; color: #8A97AD; }

        .hm-create { margin-top: 14px; width: 100%; min-height: 58px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 0; border-radius: 999px; background: linear-gradient(180deg, #16355F 0%, #0B1D3A 100%); color: #F8FAFF; font-size: 19px; font-weight: 700; box-shadow: 0 14px 30px rgba(11, 29, 58, 0.32); cursor: pointer; transition: transform 0.15s ease, filter 0.2s ease; }
        .hm-create:active { transform: scale(0.985); filter: brightness(1.12); }
        .hm-create__label { flex: 1; text-align: center; }
        .hm-create .hm-i { width: 30px; height: 30px; }
        .hm-create .hm-create__go { width: 24px; height: 24px; stroke-width: 2.4; }

        /* ---- last shipment ---- */
        .hm-sec-head { margin: 18px 2px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .hm-sec-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.2px; color: #0B1D3A; }
        .view-all { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; font-size: 16px; font-weight: 700; color: #C26A00; text-decoration: none; }
        .view-all .hm-i { width: 18px; height: 18px; }

        .hm-ship { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 12px; text-decoration: none; color: inherit; transition: transform 0.15s ease; }
        .hm-ship:active { transform: scale(0.99); }
        .hm-ship__thumb { width: 68px; height: 68px; border-radius: 16px; background: linear-gradient(160deg, #F7F1E8, #F1E7D8); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .hm-ship__thumb img { width: 86%; height: auto; display: block; }
        .hm-ship__main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .hm-ship__top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; }
        .hm-ship__code { font-size: 15px; font-weight: 800; color: #0B1D3A; overflow-wrap: anywhere; }
        .hm-pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .hm-pill--pending { background: #E3F0FF; color: #1767C8; }
        .hm-pill--transit { background: #FFF0D6; color: #A25A00; }
        .hm-pill--done { background: #DDF6E6; color: #137A3D; }
        .hm-ship__route { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; font-size: 15px; color: #3E4C66; }
        .hm-ship__route .hm-i { width: 18px; height: 18px; color: #4B9BEA; }
        .hm-ship__route .hm-flag-sm { font-size: 18px; line-height: 1; }
        .hm-ship__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; font-size: 14px; color: #6B7A93; }
        .hm-ship__meta .hm-i { width: 18px; height: 18px; }
        .hm-ship__go { width: 20px; height: 20px; color: #8A97AD; }

        .hm-empty { padding: 28px 20px; text-align: center; }
        .hm-empty .hm-i { width: 40px; height: 40px; color: #E8890C; }
        .hm-empty__title { margin-top: 8px; font-size: 18px; font-weight: 800; }
        .hm-empty__desc { margin-top: 4px; font-size: 15px; color: #6B7A93; }

        /* ---- bottom navigation ---- */
        .hm-nav {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            z-index: 20;
            height: calc(68px + env(safe-area-inset-bottom, 0px));
            padding: 0 6px env(safe-area-inset-bottom, 0px);
            display: flex;
            background: rgba(255, 255, 255, 0.96);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-top: 1px solid #E3EAF3;
            box-shadow: 0 -8px 24px rgba(11, 29, 58, 0.06);
        }
        .hm-nav__item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; color: #6B7A93; font-size: 12px; font-weight: 600; cursor: pointer; }
        .hm-nav__item[aria-current="page"] { color: #D97706; font-weight: 700; }
        .hm-nav__icon { position: relative; display: flex; }
        .hm-nav__icon .hm-i { width: 26px; height: 26px; }
        .hm-badge { position: absolute; top: -6px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #EF4444; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
        .hm-badge.hidden { display: none; }

        /* ---- country modal ---- */
        .modal-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: flex-end; justify-content: center; background: rgba(7, 20, 47, 0.55); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .hm-sheet { width: 100%; max-width: 480px; max-height: 82dvh; display: flex; flex-direction: column; background: #fff; border-radius: 26px 26px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(24px); transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
        .modal-overlay.show .hm-sheet { transform: none; }
        .hm-sheet__head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
        .hm-sheet__head h3 { font-size: 19px; font-weight: 800; color: #0B1D3A; }
        .hm-close { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #EDF1F7; color: #0B1D3A; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .hm-close .hm-i { width: 20px; height: 20px; }
        .hm-search { padding: 4px 20px 10px; }
        .ds .hm-search input, .ds .hm-search input:focus { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid #D5DEEA; border-radius: 14px; background: #F4F8FD; color: #0B1D3A; font: inherit; font-size: 16px; outline: none; box-shadow: none; }
        .ds .hm-search input:focus { border-color: #E8890C; box-shadow: 0 0 0 3px rgba(232, 137, 12, 0.18); }
        .hm-list { overflow-y: auto; padding: 0 12px 14px; }
        .hm-country { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border: 0; border-radius: 14px; background: none; text-align: left; cursor: pointer; }
        .hm-country:active, .hm-country:hover { background: #F1F5FA; }
        .hm-country .hm-flag { font-size: 28px; }
        .hm-country__name { font-size: 16px; font-weight: 700; color: #0B1D3A; }
        .hm-country__city { font-size: 14px; color: #6B7A93; }

        .hm-side:focus-visible, .hm-swap:focus-visible, .hm-stat:focus-visible, .hm-create:focus-visible, .hm-ship:focus-visible,
        .hm-avatar:focus-visible, .view-all:focus-visible, .hm-nav__item:focus-visible, .hm-close:focus-visible, .hm-country:focus-visible { outline: 2px solid #E8890C; outline-offset: 2px; }

        .hm-reveal { animation: hmReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
        @keyframes hmReveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .hm-reveal { animation: none; }
            * { transition-duration: 0.01ms !important; }
        }

        @media (max-width: 400px) {
            .hm-side > .hm-i { display: none; }
            .hm-flag { width: 30px; font-size: 26px; }
            .hm-place { font-size: 14px; }
            .hm-stat { column-gap: 8px; }
            .hm-stat__icon { width: 30px; height: 30px; margin-top: 2px; }
            .hm-stat__label { font-size: 12px; letter-spacing: 0.03em; }
        }
        @media (max-width: 359px) {
            .hm-page { padding-left: 14px; padding-right: 14px; }
            .hm-greeting h1 { font-size: 26px; }
            .hm-route { padding: 12px 10px; }
            .hm-flag { width: 34px; font-size: 26px; }
            .hm-place { font-size: 13px; }
            .hm-flag { width: 30px; }
            .hm-stat { padding: 14px 10px; column-gap: 8px; }
            .hm-stat__icon { width: 32px; height: 32px; }
            .hm-stat__value { font-size: 30px; }
            .hm-create { font-size: 17px; padding: 0 16px; }
            .hm-ship { gap: 10px; padding: 12px 10px; }
            .hm-ship__thumb { width: 60px; height: 60px; }
        }

        .lbl-short { display: none; }
        @media (max-width: 460px) { .lbl-long { display: none; } .lbl-short { display: inline; } .hm-nav__item { font-size: 11.5px; white-space: nowrap; } }
        /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}
    </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SEN GP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script src="pwa.js" defer></script>
</head>
<body class="ds">
    <div class="mobile-frame">
        <div class="hm-screen">

            <!-- Scrollable content (pull-to-refresh attaches to .content) -->
            <div class="content hm-scroll">
                <div class="hm-bg" aria-hidden="true">
                    <picture>
                        <source type="image/webp" srcset="im/sengp-home-background.webp">
                        <img src="im/sengp-home-background.jpg" alt="" width="941" height="1672" decoding="async">
                    </picture>
                </div>

                <div class="hm-page">
                    <!-- Top row: brand + avatar -->
                    <header class="hm-top hm-reveal" style="--i:0">
                        <div class="hm-brand">
                            <picture>
                                <source type="image/webp" srcset="im/sengp-logo.webp">
                                <img class="hm-logo" src="im/sengp-logo.png" alt="SENGP" width="768" height="475" decoding="async">
                            </picture>
                            <p class="hm-tagline">Vos colis, notre engagement</p>
                        </div>
                        <button type="button" class="hm-avatar" id="profileAvatar" onclick="openProfile()" aria-label="Mon profil">
                            <span id="profileInitials">EX</span>
                            <i class="hm-avatar__dot" aria-hidden="true"></i>
                        </button>
                    </header>

                    <!-- Greeting -->
                    <div class="hm-greeting hm-reveal" style="--i:1">
                        <h1 id="greetingTitle">Bonjour 👋</h1>
                        <p>Prêt à envoyer un colis ?</p>
                    </div>

                    <!-- Route selector -->
                    <section class="hm-card hm-route hm-reveal" style="--i:2" aria-label="Itinéraire">
                        <button type="button" class="hm-side" id="departureSelector" onclick="openCountryModal('departure')">
                            <span class="hm-flag" id="departureFlag">🇸🇳</span>
                            <span class="hm-side__txt">
                                <span class="hm-label">Départ</span>
                                <span class="hm-place" id="departureName">Dakar, Sénégal</span>
                            </span>
                            <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                        </button>

                        <button type="button" class="hm-swap" onclick="swapRoute()" aria-label="Inverser départ et arrivée">
                            <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                        </button>

                        <button type="button" class="hm-side" id="arrivalSelector" onclick="openCountryModal('arrival')">
                            <span class="hm-flag" id="arrivalFlag">🌍</span>
                            <span class="hm-side__txt">
                                <span class="hm-label">Arrivée</span>
                                <span class="hm-place hm-place--ph" id="arrivalName">Choisir destination</span>
                            </span>
                            <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </section>

                    <!-- Stats -->
                    <section class="hm-stats hm-reveal" style="--i:3" aria-label="Mes envois">
                        <button type="button" class="hm-stat hm-stat--active" onclick="location.href='envois.html?status=active'">
                            <svg class="hm-i hm-stat__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
                            <span class="hm-stat__body">
                                <span class="hm-stat__label">En cours</span>
                                <span class="hm-stat__value" id="statActiveValue">0</span>
                                <span class="hm-stat__note" id="statActiveNote">Chargement…</span>
                            </span>
                            <svg class="hm-i hm-stat__go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                        </button>

                        <button type="button" class="hm-stat hm-stat--done" onclick="location.href='envois.html?status=delivered'">
                            <svg class="hm-i hm-stat__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                            <span class="hm-stat__body">
                                <span class="hm-stat__label">Livrés</span>
                                <span class="hm-stat__value" id="statDeliveredValue">0</span>
                                <span class="hm-stat__note" id="statDeliveredNote">Chargement…</span>
                            </span>
                            <svg class="hm-i hm-stat__go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </section>

                    <!-- Create shipment -->
                    <button type="button" class="hm-create hm-reveal" style="--i:4" onclick="createShipment()">
                        <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 16h6"/><path d="M19 13v6"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                        <span class="hm-create__label">Créer un envoi</span>
                        <svg class="hm-i hm-create__go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                    </button>

                    <!-- Last shipment -->
                    <section class="hm-reveal" style="--i:5" aria-labelledby="lastShipmentTitle">
                        <div class="hm-sec-head">
                            <h2 id="lastShipmentTitle">Mon dernier envoi</h2>
                            <a href="envois.html" class="view-all" onclick="viewAllShipments(event)">Voir tout <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
                        </div>
                        <!-- Rendered by displayMissions() -->
                        <div id="shipmentsList"></div>
                    </section>
                </div>
            </div>

            <!-- Bottom navigation -->
            <nav class="hm-nav" aria-label="Navigation principale">
                <button type="button" class="hm-nav__item" aria-current="page" onclick="navigateTo('home')">
                    <span class="hm-nav__icon"><svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></span>
                    <span>Accueil</span>
                </button>
                <button type="button" class="hm-nav__item" onclick="navigateTo('orders')">
                    <span class="hm-nav__icon"><svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg></span>
                    <span>Envois</span>
                </button>
                <button type="button" class="hm-nav__item" onclick="navigateTo('tracking')">
                    <span class="hm-nav__icon"><svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
                    <span>Suivi</span>
                </button>
                <button type="button" class="hm-nav__item" onclick="navigateTo('notifications')">
                    <span class="hm-nav__icon">
                        <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                        <span class="hm-badge hidden" id="expNotifBadge"></span>
                    </span>
                    <span class="lbl-long">Notifications</span><span class="lbl-short">Notifs</span>
                </button>
                <button type="button" class="hm-nav__item" onclick="navigateTo('profile')">
                    <span class="hm-nav__icon"><svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
                    <span>Profil</span>
                </button>
            </nav>

            <!-- Country selection sheet -->
            <div class="modal-overlay" id="countryModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <div class="hm-sheet">
                    <div class="hm-sheet__head">
                        <h3 id="modalTitle">Choisir le pays de départ</h3>
                        <button type="button" class="hm-close" onclick="closeCountryModal()" aria-label="Fermer"><svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                    </div>
                    <div class="hm-search">
                        <input type="text" id="countrySearch" placeholder="Rechercher un pays..." oninput="filterCountries()" autocomplete="off" aria-label="Rechercher un pays">
                    </div>
                    <div class="hm-list" id="countryList"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Configuration de l'API
        const API_BASE_URL = window.API_BASE_URL;

        // Escape text coming from the API before it is placed in HTML
        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Récupérer le token d'authentification
        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        // Récupérer les données utilisateur
        function getUserData() {
            const userData = localStorage.getItem('userData');
            try { return userData ? JSON.parse(userData) : null; } catch (e) { return null; }
        }

        // Charger les données du dashboard au chargement de la page
        async function loadDashboardData() {
            const token = getAuthToken();
            const userData = getUserData();

            if (!token || !userData) {
                // Rediriger vers la page de connexion si pas authentifié
                alert('Session expirée. Veuillez vous reconnecter.');
                window.location.href = 'connexion.html';
                return;
            }

            // Mettre à jour le nom de l'utilisateur
            const firstName = userData.first_name || userData.firstName || 'Utilisateur';
            const title = document.getElementById('greetingTitle');
            title.textContent = 'Bonjour, ';
            const nameEl = document.createElement('span');
            nameEl.className = 'hm-name';
            nameEl.textContent = firstName;
            title.appendChild(nameEl);
            title.appendChild(document.createTextNode(' 👋'));

            // Avatar : photo de profil Google si disponible, sinon initiales.
            const avatar = document.getElementById('profileAvatar');
            const initialsEl = document.getElementById('profileInitials');
            const photo = userData.profile_photo_url;
            if (photo) {
                avatar.style.backgroundImage = `url(${JSON.stringify(String(photo))})`;
                avatar.classList.add('has-photo');
            } else {
                const a = (userData.first_name || '').charAt(0);
                const b = (userData.last_name || '').charAt(0);
                initialsEl.textContent = (a + b).toUpperCase() || 'EX';
                avatar.classList.remove('has-photo');
            }

            // Masque les pastilles dont la valeur est 0 ou vide.
            document.querySelectorAll('.hm-badge').forEach((bdg) => {
                const n = parseInt((bdg.textContent || '').trim(), 10);
                bdg.classList.toggle('hidden', !n);
            });

            try {
                // Missions + statistiques (une seule requête)
                await loadMissions(token);
                // Pastille de notifications non lues (compte réel)
                await loadUnreadNotifCount(token);
            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
            }
        }

        // Real unread-notification count on the Notifications tab (hidden at 0).
        async function loadUnreadNotifCount(token) {
            try {
                const r = await fetch(`${API_BASE_URL}/notifications/my-notifications?limit=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!r.ok) return;
                const unread = ((await r.json()).data || []).filter(n => !n.is_read).length;
                const b = document.getElementById('expNotifBadge');
                if (!b) return;
                if (unread > 0) { b.textContent = unread > 99 ? '99+' : unread; b.classList.remove('hidden'); }
                else b.classList.add('hidden');
            } catch (e) {}
        }

        // Charger les missions de l'utilisateur, puis en déduire l'affichage et les statistiques
        async function loadMissions(token) {
            try {
                const response = await fetch(`${API_BASE_URL}/missions/my-missions`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des missions');
                }

                const result = await response.json();
                const missions = result.data || [];

                displayMissions(missions);
                updateStatsDisplay(calculateStats(missions));
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('statActiveNote').textContent = 'Indisponible';
                document.getElementById('statDeliveredNote').textContent = 'Indisponible';
            }
        }

        // Calculer les statistiques à partir des missions
        function calculateStats(missions) {
            const stats = { enCours: 0, livres: 0 };

            missions.forEach(mission => {
                const status = String(mission.status || '').toLowerCase();

                if (['pending', 'matched', 'accepted', 'picked_up', 'in_transit', 'in_customs', 'out_for_delivery'].includes(status)) {
                    stats.enCours++;
                } else if (status === 'delivered') {
                    stats.livres++;
                }
            });

            return stats;
        }

        // Mettre à jour l'affichage des statistiques
        function updateStatsDisplay(stats) {
            document.getElementById('statActiveValue').textContent = stats.enCours;
            document.getElementById('statActiveNote').textContent =
                stats.enCours === 0 ? 'Aucune mission' : (stats.enCours === 1 ? 'Mission active' : 'Missions actives');

            document.getElementById('statDeliveredValue').textContent = stats.livres;
            document.getElementById('statDeliveredNote').textContent =
                stats.livres === 0 ? 'Aucune livraison' : (stats.livres === 1 ? 'Mission terminée' : 'Missions terminées');
        }

        // Afficher le dernier envoi
        function displayMissions(missions) {
            const list = document.getElementById('shipmentsList');
            list.textContent = '';

            if (missions.length === 0) {
                list.innerHTML = `
                    <div class="hm-card hm-empty">
                        <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
                        <div class="hm-empty__title">Aucun envoi</div>
                        <div class="hm-empty__desc">Vous n'avez pas encore créé d'envoi. Commencez dès maintenant !</div>
                    </div>`;
                return;
            }

            // Le plus récent (la liste arrive triée du plus récent au plus ancien)
            list.appendChild(createMissionCard(missions[0]));
        }

        // Créer une carte de mission
        function createMissionCard(mission) {
            const card = document.createElement('a');
            card.className = 'hm-card hm-ship';
            card.href = `envois.html?open=${encodeURIComponent(mission.id)}`;

            const statusClass = getStatusClass(mission.status);
            const statusText = getStatusText(mission.status);
            const departureFlag = getCountryFlag(mission.departure_country);
            const arrivalFlag = getCountryFlag(mission.arrival_country);
            const gpHtml = mission.gp_id ? '<span>· GP assigné</span>' : '';

            card.innerHTML = `
                <span class="hm-ship__thumb" aria-hidden="true">
                    <picture>
                        <source type="image/webp" srcset="im/sengp-package-thumb.webp">
                        <img src="im/sengp-package-thumb.png" alt="" width="372" height="282" loading="lazy" decoding="async">
                    </picture>
                </span>
                <span class="hm-ship__main">
                    <span class="hm-ship__top">
                        <span class="hm-ship__code">${esc(mission.mission_code || mission.tracking_number)}</span>
                        <span class="hm-pill ${statusClass}">${esc(statusText)}</span>
                    </span>
                    <span class="hm-ship__route">
                        <span class="hm-flag-sm">${departureFlag}</span><span>${esc(mission.departure_city)}</span>
                        <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        <span class="hm-flag-sm">${arrivalFlag}</span><span>${esc(mission.arrival_city)}</span>
                    </span>
                    <span class="hm-ship__meta">
                        <svg class="hm-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                        <span>${esc(formatDate(mission.created_at))}</span>
                        ${gpHtml}
                    </span>
                </span>
                <svg class="hm-i hm-ship__go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;

            return card;
        }

        // Obtenir la classe CSS pour le statut
        function getStatusClass(status) {
            const statusMap = {
                'pending': 'hm-pill--pending',
                'matched': 'hm-pill--pending',
                'accepted': 'hm-pill--transit',
                'picked_up': 'hm-pill--transit',
                'in_transit': 'hm-pill--transit',
                'in_customs': 'hm-pill--transit',
                'out_for_delivery': 'hm-pill--transit',
                'delivered': 'hm-pill--done',
                'cancelled': 'hm-pill--pending',
                'disputed': 'hm-pill--pending'
            };
            return statusMap[String(status || '').toLowerCase()] || 'hm-pill--pending';
        }

        // Obtenir le texte du statut en français
        function getStatusText(status) {
            const statusMap = {
                'pending': 'En attente',
                'matched': 'Correspondance trouvée',
                'accepted': 'Accepté',
                'picked_up': 'Récupéré',
                'in_transit': 'En transit',
                'in_customs': 'En douane',
                'out_for_delivery': 'En livraison',
                'delivered': 'Livré',
                'cancelled': 'Annulé',
                'disputed': 'Litige'
            };
            return statusMap[String(status || '').toLowerCase()] || status || '';
        }

        // Obtenir le drapeau du pays
        function getCountryFlag(country) {
            const countryFlags = {
                'Sénégal': '🇸🇳',
                'France': '🇫🇷',
                'États-Unis': '🇺🇸',
                'USA': '🇺🇸',
                'Royaume-Uni': '🇬🇧',
                'UK': '🇬🇧',
                'Canada': '🇨🇦',
                'Espagne': '🇪🇸',
                'Italie': '🇮🇹',
                'Allemagne': '🇩🇪',
                'Belgique': '🇧🇪',
                'Suisse': '🇨🇭',
                'Maroc': '🇲🇦',
                'Algérie': '🇩🇿',
                'Tunisie': '🇹🇳'
            };
            return countryFlags[country] || '🌍';
        }

        // Formater la date
        function formatDate(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Database des pays avec drapeaux et villes principales
        const countries = [
            { flag: '🇸🇳', name: 'Sénégal', city: 'Dakar', code: 'SN' },
            { flag: '🇫🇷', name: 'France', city: 'Paris', code: 'FR' },
            { flag: '🇺🇸', name: 'États-Unis', city: 'New York', code: 'US' },
            { flag: '🇬🇧', name: 'Royaume-Uni', city: 'Londres', code: 'GB' },
            { flag: '🇨🇦', name: 'Canada', city: 'Montréal', code: 'CA' },
            { flag: '🇪🇸', name: 'Espagne', city: 'Madrid', code: 'ES' },
            { flag: '🇮🇹', name: 'Italie', city: 'Rome', code: 'IT' },
            { flag: '🇩🇪', name: 'Allemagne', city: 'Berlin', code: 'DE' },
            { flag: '🇧🇪', name: 'Belgique', city: 'Bruxelles', code: 'BE' },
            { flag: '🇨🇭', name: 'Suisse', city: 'Genève', code: 'CH' },
            { flag: '🇳🇱', name: 'Pays-Bas', city: 'Amsterdam', code: 'NL' },
            { flag: '🇵🇹', name: 'Portugal', city: 'Lisbonne', code: 'PT' },
            { flag: '🇲🇦', name: 'Maroc', city: 'Casablanca', code: 'MA' },
            { flag: '🇩🇿', name: 'Algérie', city: 'Alger', code: 'DZ' },
            { flag: '🇹🇳', name: 'Tunisie', city: 'Tunis', code: 'TN' },
            { flag: '🇨🇮', name: 'Côte d\'Ivoire', city: 'Abidjan', code: 'CI' },
            { flag: '🇲🇱', name: 'Mali', city: 'Bamako', code: 'ML' },
            { flag: '🇬🇳', name: 'Guinée', city: 'Conakry', code: 'GN' },
            { flag: '🇧🇫', name: 'Burkina Faso', city: 'Ouagadougou', code: 'BF' },
            { flag: '🇳🇬', name: 'Nigeria', city: 'Lagos', code: 'NG' },
            { flag: '🇬🇭', name: 'Ghana', city: 'Accra', code: 'GH' },
            { flag: '🇰🇪', name: 'Kenya', city: 'Nairobi', code: 'KE' },
            { flag: '🇿🇦', name: 'Afrique du Sud', city: 'Johannesburg', code: 'ZA' },
            { flag: '🇪🇬', name: 'Égypte', city: 'Le Caire', code: 'EG' },
            { flag: '🇦🇪', name: 'Émirats Arabes', city: 'Dubaï', code: 'AE' },
            { flag: '🇸🇦', name: 'Arabie Saoudite', city: 'Riyad', code: 'SA' },
            { flag: '🇹🇷', name: 'Turquie', city: 'Istanbul', code: 'TR' },
            { flag: '🇨🇳', name: 'Chine', city: 'Shanghai', code: 'CN' },
            { flag: '🇯🇵', name: 'Japon', city: 'Tokyo', code: 'JP' },
            { flag: '🇰🇷', name: 'Corée du Sud', city: 'Séoul', code: 'KR' },
            { flag: '🇮🇳', name: 'Inde', city: 'Mumbai', code: 'IN' },
            { flag: '🇧🇷', name: 'Brésil', city: 'São Paulo', code: 'BR' },
            { flag: '🇲🇽', name: 'Mexique', city: 'Mexico', code: 'MX' },
            { flag: '🇦🇷', name: 'Argentine', city: 'Buenos Aires', code: 'AR' },
            { flag: '🇦🇺', name: 'Australie', city: 'Sydney', code: 'AU' }
        ];

        let currentSelector = null;

        function openCountryModal(type) {
            currentSelector = type;
            const modal = document.getElementById('countryModal');
            document.getElementById('modalTitle').textContent =
                type === 'departure' ? 'Choisir le pays de départ' : 'Choisir le pays d\'arrivée';

            renderCountryList(countries);
            modal.classList.add('show');
        }

        function closeCountryModal() {
            document.getElementById('countryModal').classList.remove('show');
            document.getElementById('countrySearch').value = '';
        }

        function renderCountryList(countriesToShow) {
            const countryList = document.getElementById('countryList');
            countryList.textContent = '';

            countriesToShow.forEach(country => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'hm-country';
                item.onclick = () => selectCountry(country);

                item.innerHTML = `
                    <span class="hm-flag">${country.flag}</span>
                    <span>
                        <span class="hm-country__name">${esc(country.name)}</span><br>
                        <span class="hm-country__city">${esc(country.city)}</span>
                    </span>
                `;

                countryList.appendChild(item);
            });
        }

        function filterCountries() {
            const searchValue = document.getElementById('countrySearch').value.toLowerCase();
            const filtered = countries.filter(country =>
                country.name.toLowerCase().includes(searchValue) ||
                country.city.toLowerCase().includes(searchValue)
            );
            renderCountryList(filtered);
        }

        function selectCountry(country) {
            const prefix = currentSelector === 'departure' ? 'departure' : 'arrival';
            document.getElementById(prefix + 'Flag').textContent = country.flag;
            const nameEl = document.getElementById(prefix + 'Name');
            nameEl.textContent = `${country.city}, ${country.name}`;
            nameEl.classList.remove('hm-place--ph');

            closeCountryModal();
        }

        // Swap departure and arrival (opens the destination picker if none is chosen yet)
        function swapRoute() {
            const arrivalName = document.getElementById('arrivalName');
            if (arrivalName.classList.contains('hm-place--ph')) {
                openCountryModal('arrival');
                return;
            }
            const depFlag = document.getElementById('departureFlag');
            const depName = document.getElementById('departureName');
            const arrFlag = document.getElementById('arrivalFlag');
            [depFlag.textContent, arrFlag.textContent] = [arrFlag.textContent, depFlag.textContent];
            [depName.textContent, arrivalName.textContent] = [arrivalName.textContent, depName.textContent];
        }

        // Close the sheet when clicking outside it, or with Escape
        document.getElementById('countryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCountryModal();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeCountryModal();
        });

        function createShipment() {
            // Rediriger vers la page de création d'envoi
            window.location.href = 'creenvoi.html';
        }

        function viewAllShipments(e) {
            if (e) e.preventDefault();
            window.location.href = 'envois.html';
        }

        function openProfile() {
            window.location.href = 'profile.html';
        }

        function navigateTo(section) {
            const pages = {
                'home': 'dashexpediteur.html',
                'orders': 'envois.html',
                'reclamation': 'reclamation.html',
                'tracking': 'suivi.html',
                'notifications': 'notifications.html',
                'profile': 'profile.html'
            };

            // Already on the home page: just go back to the top
            if (section === 'home') {
                document.querySelector('.hm-scroll').scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            if (pages[section]) {
                window.location.href = pages[section];
            }
        }

        // Charger les données du dashboard
        window.addEventListener('load', loadDashboardData);
    </script>
    <script src="ptr.js"></script>
    <script src="deeplink.js"></script>
</body>
</html>
