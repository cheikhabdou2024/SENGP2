<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Mes envois</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
            min-height:100vh; display:flex; justify-content:center; color:#fff;
        }
        .mobile-frame { width:100%; max-width:480px; min-height:100vh; min-height:100dvh; position:relative;
            background: linear-gradient(135deg, rgba(15,12,41,.95), rgba(36,36,62,.95)); }
        .header { display:flex; align-items:center; gap:14px; padding:18px 20px;
            border-bottom:1px solid rgba(255,255,255,.1); position:sticky; top:0;
            background:rgba(20,18,40,.85); backdrop-filter:blur(10px); z-index:5; }
        .back-btn { width:38px; height:38px; border:none; border-radius:11px; cursor:pointer;
            background:rgba(255,255,255,.1); color:#fff; font-size:18px; }
        .header h1 { font-size:18px; }
        .content { padding:18px; }
        .tabs { display:flex; gap:8px; margin-bottom:16px; background:rgba(255,255,255,.05); padding:6px; border-radius:14px; }
        .tab { flex:1; padding:9px; border:none; border-radius:10px; background:transparent; color:rgba(255,255,255,.6);
            font-weight:600; font-size:13px; cursor:pointer; }
        .tab.active { background:linear-gradient(135deg,#FF6B6B,#FFE66D); color:#1a1a2e; }
        .card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); border-radius:16px;
            padding:16px; margin-bottom:12px; cursor:pointer; transition:all .2s; }
        .card:hover { transform:translateX(4px); background:rgba(255,255,255,.12); }
        .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
        .code { font-size:13px; font-weight:700; }
        .price { font-size:13px; color:#FFD700; font-weight:700; }
        .badge { padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; }
        .b-yellow{background:rgba(255,215,0,.18);color:#FFD700;} .b-blue{background:rgba(78,205,196,.2);color:#4ECDC4;}
        .b-green{background:rgba(76,175,80,.2);color:#7ee081;} .b-red{background:rgba(255,107,107,.2);color:#ff8f8f;}
        .route { display:flex; align-items:center; gap:8px; font-size:13px; }
        .route .flag{font-size:18px;} .route .arrow{color:rgba(255,255,255,.4);}
        .meta { font-size:11px; color:rgba(255,255,255,.5); margin-top:8px; display:flex; justify-content:space-between; }
        .loading,.empty { text-align:center; padding:50px 20px; color:rgba(255,255,255,.5); }
        .empty .ic{font-size:44px;margin-bottom:10px;}
    </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
</head>
<body class="ds">
    <div class="mobile-frame">
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <h1>Mes envois</h1>
        </div>
        <div class="content">
            <div class="tabs">
                <button class="tab active" id="t-all" onclick="setTab('all',this)">Tous</button>
                <button class="tab" id="t-active" onclick="setTab('active',this)">En cours</button>
                <button class="tab" id="t-delivered" onclick="setTab('delivered',this)">Livrés</button>
            </div>
            <div id="list"><div class="loading">Chargement…</div></div>
        </div>
    </div>

    <script>
        const API = window.API_BASE_URL;
        const token = localStorage.getItem('authToken');
        let all = [];
        let tab = new URLSearchParams(location.search).get('status') || 'all';
        const ACTIVE = ['pending','matched','accepted','picked_up','in_transit','in_customs','out_for_delivery'];

        const FLAGS = {'Sénégal':'🇸🇳','Senegal':'🇸🇳','France':'🇫🇷','Espagne':'🇪🇸','Italie':'🇮🇹','USA':'🇺🇸','États-Unis':'🇺🇸','Canada':'🇨🇦','Royaume-Uni':'🇬🇧','Allemagne':'🇩🇪','Maroc':'🇲🇦','Mali':'🇲🇱'};
        const flag = c => FLAGS[c] || '🌍';
        const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const fcfa = n => (Number(n)||0).toLocaleString('fr-FR')+' FCFA';
        const dt = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
        const STATUS = { pending:['En attente','b-yellow'],matched:['Correspondance','b-yellow'],accepted:['Accepté','b-blue'],picked_up:['Récupéré','b-blue'],in_transit:['En transit','b-blue'],in_customs:['En douane','b-blue'],out_for_delivery:['En livraison','b-blue'],delivered:['Livré','b-green'],cancelled:['Annulé','b-red'],disputed:['Litige','b-red'] };
        function badge(s){ const m=STATUS[String(s||'').toLowerCase()]||[s,'b-yellow']; return `<span class="badge ${m[1]}">${esc(m[0])}</span>`; }

        function goBack(){ location.href='dashexpediteur.html'; }

        async function load(){
            if (!token){ location.href='connexion.html'; return; }
            try {
                const res = await fetch(`${API}/missions/my-missions?limit=200`, { headers:{ 'Authorization':'Bearer '+token } });
                if (!res.ok) throw new Error('Chargement impossible');
                all = (await res.json()).data || [];
                // sélectionner l'onglet initial
                const el = document.getElementById('t-'+(tab==='all'?'all':tab));
                if (el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
                render();
            } catch(e){ document.getElementById('list').innerHTML = `<div class="empty">Erreur: ${esc(e.message)}</div>`; }
        }

        function setTab(t, el){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(); }

        function visible(){
            if (tab==='active') return all.filter(m=>ACTIVE.includes(String(m.status||'').toLowerCase()));
            if (tab==='delivered') return all.filter(m=>String(m.status||'').toLowerCase()==='delivered');
            return all;
        }

        function render(){
            const list = visible();
            const box = document.getElementById('list');
            if (!list.length){ box.innerHTML = '<div class="empty"><div class="ic">📦</div>Aucun envoi dans cette catégorie.</div>'; return; }
            box.innerHTML = list.map(m=>`
                <div class="card" onclick="location.href='detailenvoi.html?id=${m.id}'">
                    <div class="top">
                        <div><div class="code">${esc(m.mission_code||m.tracking_number||'')}</div>
                        <div class="price">${fcfa(m.offered_price||m.price)}</div></div>
                        ${badge(m.status)}
                    </div>
                    <div class="route">
                        <span class="flag">${flag(m.departure_country)}</span><span>${esc(m.departure_city||'—')}</span>
                        <span class="arrow">→</span>
                        <span class="flag">${flag(m.arrival_country)}</span><span>${esc(m.arrival_city||'—')}</span>
                    </div>
                    <div class="meta"><span>Créé: ${dt(m.created_at)}</span><span>${m.gp_id?'GP assigné':'Recherche GP…'}</span></div>
                </div>`).join('');
        }

        load();
    </script>
    <script src="ptr.js"></script>
</body>
</html>
