<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Recherche de Missions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-frame {
            width: 100%;
            max-width: 375px;
            height: 667px;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95) 0%, rgba(48, 43, 99, 0.95) 50%, rgba(36, 36, 62, 0.95) 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .time { color: #fff; }
        .indicators {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .signal, .wifi, .battery {
            width: 18px;
            height: 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 2px;
        }

        /* Header */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Search & Filters */
        .search-section {
            display: flex;
            gap: 10px;
        }

        .search-bar {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .filter-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        /* Content */
        .content {
            height: calc(100% - 44px - 85px - 132px);
            overflow-y: auto;
            padding: 20px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Filter Tags */
        .filter-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-tags::-webkit-scrollbar {
            height: 3px;
        }

        .filter-tag {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .filter-tag.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-color: #FFD700;
            color: #1a1a2e;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .sort-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sort-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Mission Cards */
        .mission-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mission-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .mission-card.featured {
            border-color: rgba(255, 215, 0, 0.4);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12) 0%, rgba(255, 165, 0, 0.08) 100%);
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .mission-price-section {
            flex: 1;
        }

        .mission-price {
            font-size: 20px;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 4px;
        }

        .price-type {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .mission-badges {
            display: flex;
            gap: 6px;
            flex-direction: column;
            align-items: flex-end;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-new {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: pulse-badge 2s ease-in-out infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .badge-urgent {
            background: rgba(255, 107, 107, 0.2);
            color: #FF6B6B;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .badge-verified {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .mission-route {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .route-location {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .route-location .flag {
            font-size: 24px;
        }

        .route-arrow {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
        }

        .mission-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .mission-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mission-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .mission-client {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .client-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .client-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .client-rating {
            font-size: 11px;
            color: #FFD700;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-details {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-details:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-accept {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a2e;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .btn-accept:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 215, 0, 0.5);
        }

        /* Bottom Navigation (unified GP nav) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 16, 36, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding: 9px 6px calc(9px + env(safe-area-inset-bottom));
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 6px 0;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .nav-icon svg {
            width: 24px; height: 24px; fill: none; stroke: currentColor;
            stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.25s ease;
        }
        .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; color: inherit; }
        .nav-item.active { color: #FFC107; }
        .nav-item.active .nav-icon svg { transform: translateY(-1px) scale(1.06); }
        .nav-item.active::after {
            content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
            width: 26px; height: 3px; border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, #FFD700, #FFA500);
        }
        .nav-item:not(.active):active { color: rgba(255, 255, 255, 0.85); }
        .nav-badge {
            position: absolute; top: 0px; left: calc(50% + 5px);
            min-width: 17px; height: 17px; background: #FF4757;
            border: 1.5px solid #121024; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 800; color: white; padding: 0 4px;
        }
        .nav-badge.new { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #1a1a2e; }
        .nav-badge.hidden { display: none; }
            /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}

        /* Loading / empty states */
        .missions-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.6);
        }
        .missions-state .state-icon { font-size: 44px; margin-bottom: 12px; }
        .missions-state .state-text { font-size: 14px; line-height: 1.5; }
        </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="ds">
    <div class="mobile-frame">

        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <button class="back-btn" onclick="goBack()">←</button>
                <div class="header-title">
                    <h1>Recherche de missions</h1>
                    <p id="missionsCount">Chargement…</p>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="Rechercher une destination...">
                </div>
                <button class="filter-btn" onclick="openFilters()">⚙️</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Filter Tags -->
            <div class="filter-tags">
                <div class="filter-tag active" onclick="filterMissions('all', this)">Toutes</div>
                <div class="filter-tag" onclick="filterMissions('high-pay', this)">💰 Bien payées</div>
                <div class="filter-tag" onclick="filterMissions('urgent', this)">⚡ Urgentes</div>
                <div class="filter-tag" onclick="filterMissions('verified', this)">✓ Vérifiées</div>
                <div class="filter-tag" onclick="filterMissions('light', this)">📦 Légères</div>
            </div>

            <!-- Section Header -->
            <div class="section-header">
                <h2 class="section-title">Missions disponibles</h2>
                <button class="sort-btn" onclick="sortMissions()">Trier par ↕</button>
            </div>

            <!-- Missions (rendered from real backend data) -->
            <div id="missionsLoading" class="missions-state">
                <div class="state-icon">⏳</div>
                <div class="state-text">Chargement des missions…</div>
            </div>
            <div id="missionsEmpty" class="missions-state" style="display: none;">
                <div class="state-icon">📭</div>
                <div class="state-text">Aucune mission disponible pour le moment.<br>Revenez plus tard.</div>
            </div>
            <div id="missionsList"></div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="navigateTo('home')" tabindex="0" role="button" aria-label="Accueil">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div>
                <div class="nav-label">Accueil</div>
            </div>

            <div class="nav-item active" onclick="navigateTo('missions')" tabindex="0" role="button" aria-label="Missions">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
                <div class="nav-label">Missions</div>
                <div class="nav-badge" id="navMissionsBadge" style="display:none;">0</div>
            </div>

            <div class="nav-item" onclick="navigateTo('trips')" tabindex="0" role="button" aria-label="Trajets">
                <div class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M22 16.21v-1.6l-8.5-5V4.5a1.5 1.5 0 0 0-3 0v5.11l-8.5 5v1.6l8.5-2.66v4.54l-2.5 1.4v1.5l4-1.18 4 1.18v-1.5l-2.5-1.4v-4.54z"/></svg></div>
                <div class="nav-label">Trajets</div>
            </div>

            <div class="nav-item" onclick="navigateTo('earnings')" tabindex="0" role="button" aria-label="Gains">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                <div class="nav-label">Gains</div>
            </div>

            <div class="nav-item" onclick="navigateTo('profile')" tabindex="0" role="button" aria-label="Profil">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
                <div class="nav-label">Profil</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.API_BASE_URL;
        const authToken = localStorage.getItem('authToken');

        let allMissions = [];     // missions réelles chargées depuis l'API
        let myTripId = null;      // 1er trajet du GP (pour l'acceptation)
        let activeFilter = 'all';
        let searchTerm = '';
        let priceSortAsc = false;

        // Drapeaux par pays (repli 🌍).
        const FLAGS = {
            'Sénégal': '🇸🇳', 'Senegal': '🇸🇳', 'France': '🇫🇷', 'Espagne': '🇪🇸',
            'Italie': '🇮🇹', 'USA': '🇺🇸', 'États-Unis': '🇺🇸', 'Etats-Unis': '🇺🇸',
            'Canada': '🇨🇦', 'Royaume-Uni': '🇬🇧', 'Angleterre': '🇬🇧', 'Allemagne': '🇩🇪',
            'Belgique': '🇧🇪', 'Maroc': '🇲🇦', 'Mali': '🇲🇱', 'Côte d\'Ivoire': '🇨🇮'
        };
        function flagFor(country) { return FLAGS[country] || '🌍'; }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function initials(name) {
            if (!name) return '👤';
            const parts = name.trim().split(/\s+/);
            return ((parts[0] || '').charAt(0) + (parts[1] || '').charAt(0)).toUpperCase() || '👤';
        }

        function shortName(name) {
            if (!name) return 'Client';
            const parts = name.trim().split(/\s+/);
            return parts[0] + (parts[1] ? ' ' + parts[1].charAt(0) + '.' : '');
        }

        function formatPrice(p) {
            const n = parseFloat(p) || 0;
            return n.toLocaleString('fr-FR') + ' FCFA';
        }

        function formatDate(d) {
            if (!d) return '—';
            try {
                return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
            } catch (e) { return '—'; }
        }

        function timeAgo(d) {
            if (!d) return '';
            const diff = Date.now() - new Date(d).getTime();
            const h = Math.floor(diff / 3600000);
            if (h < 1) return 'À l\'instant';
            if (h < 24) return `Publié il y a ${h}h`;
            const days = Math.floor(h / 24);
            return `Publié il y a ${days} jour${days > 1 ? 's' : ''}`;
        }

        function isNewMission(d) {
            if (!d) return false;
            return (Date.now() - new Date(d).getTime()) < 24 * 3600000;
        }

        function isUrgent(m) {
            if (!m.departure_date) return false;
            const diff = new Date(m.departure_date).getTime() - Date.now();
            return diff > 0 && diff < 3 * 24 * 3600000;
        }

        function goBack() {
            window.location.href = 'dashgp.html';
        }

        async function loadMissions() {
            if (!authToken) {
                alert('Vous devez vous connecter pour accéder à cette page');
                window.location.href = 'connexion.html';
                return;
            }
            try {
                // Trajet du GP (utilisé à l'acceptation), best-effort.
                try {
                    const tripsRes = await fetch(`${API_BASE_URL}/trips/my-trips?limit=1`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    if (tripsRes.ok) {
                        const tripsJson = await tripsRes.json();
                        const trips = tripsJson.data || [];
                        if (trips.length) myTripId = trips[0].id;
                    }
                } catch (e) { /* ignore */ }

                // Missions en attente (disponibles à l'acceptation).
                const res = await fetch(`${API_BASE_URL}/missions?status=pending&limit=50`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error('Échec du chargement');
                const json = await res.json();
                allMissions = json.data || [];

                document.getElementById('missionsLoading').style.display = 'none';
                renderMissions();
            } catch (error) {
                console.error('Erreur chargement missions:', error);
                document.getElementById('missionsLoading').style.display = 'none';
                const empty = document.getElementById('missionsEmpty');
                empty.querySelector('.state-text').innerHTML =
                    'Impossible de charger les missions.<br>Vérifiez votre connexion.';
                empty.style.display = 'block';
                document.getElementById('missionsCount').textContent = 'Erreur de chargement';
            }
        }

        function getVisibleMissions() {
            let list = allMissions.slice();

            // Filtre par onglet
            if (activeFilter === 'high-pay') list = list.filter(m => (parseFloat(m.price) || 0) >= 50000);
            else if (activeFilter === 'urgent') list = list.filter(isUrgent);
            else if (activeFilter === 'verified') list = list.filter(m => m.is_insured);
            else if (activeFilter === 'light') list = list.filter(m => (parseFloat(m.weight) || 0) <= 3);

            // Recherche texte (villes / pays)
            if (searchTerm) {
                const q = searchTerm.toLowerCase();
                list = list.filter(m =>
                    [m.departure_city, m.arrival_city, m.departure_country, m.arrival_country]
                        .filter(Boolean).some(v => String(v).toLowerCase().includes(q))
                );
            }

            // Tri par prix
            list.sort((a, b) => {
                const pa = parseFloat(a.price) || 0, pb = parseFloat(b.price) || 0;
                return priceSortAsc ? pa - pb : pb - pa;
            });

            return list;
        }

        function renderMissions() {
            const list = getVisibleMissions();
            const container = document.getElementById('missionsList');
            const empty = document.getElementById('missionsEmpty');

            // Compteurs (entête + badge nav) basés sur le total réel chargé.
            const total = allMissions.length;
            document.getElementById('missionsCount').textContent =
                `${total} mission${total > 1 ? 's' : ''} disponible${total > 1 ? 's' : ''}`;
            const navBadge = document.getElementById('navMissionsBadge');
            if (total > 0) { navBadge.textContent = total; navBadge.style.display = 'flex'; }
            else { navBadge.style.display = 'none'; }

            if (list.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            container.innerHTML = list.map((m, idx) => {
                const featured = idx === 0 ? ' featured' : '';
                const badges = [];
                if (isNewMission(m.created_at)) badges.push('<span class="badge badge-new">🔥 Nouveau</span>');
                if (isUrgent(m)) badges.push('<span class="badge badge-urgent">⚡ Urgent</span>');
                if (m.is_insured) badges.push('<span class="badge badge-verified">✓ Assuré</span>');

                const priceType = m.is_price_negotiable ? 'Prix négociable' : 'Prix fixe';
                const dims = (m.dimensions && m.dimensions !== 'xx') ? m.dimensions : 'N/C';
                const weight = (parseFloat(m.weight) || 0);

                return `
                <div class="mission-card${featured}">
                    <div class="mission-header">
                        <div class="mission-price-section">
                            <div class="mission-price">${formatPrice(m.price)}</div>
                            <div class="price-type">${priceType}</div>
                        </div>
                        <div class="mission-badges">${badges.join('')}</div>
                    </div>
                    <div class="mission-route">
                        <div class="route-location">
                            <span class="flag">${flagFor(m.departure_country)}</span>
                            <span>${esc(m.departure_city || m.departure_country || '—')}</span>
                        </div>
                        <span class="route-arrow">→</span>
                        <div class="route-location">
                            <span class="flag">${flagFor(m.arrival_country)}</span>
                            <span>${esc(m.arrival_city || m.arrival_country || '—')}</span>
                        </div>
                    </div>
                    <div class="mission-details">
                        <div class="detail-item"><span>📦</span><span>${weight} kg</span></div>
                        <div class="detail-item"><span>📏</span><span>${esc(dims)} cm</span></div>
                        <div class="detail-item"><span>📅</span><span>Départ: ${formatDate(m.departure_date)}</span></div>
                        <div class="detail-item"><span>🎯</span><span>Arrivée: ${formatDate(m.desired_arrival_date)}</span></div>
                    </div>
                    <div class="mission-footer">
                        <div class="mission-client">
                            <div class="client-avatar">${esc(initials(m.expediteur_name))}</div>
                            <span class="client-name">${esc(shortName(m.expediteur_name))}</span>
                        </div>
                        <span class="mission-date">${timeAgo(m.created_at)}</span>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-details" onclick="viewDetails('${m.id}')">Détails</button>
                        <button class="btn btn-accept" onclick="acceptMission('${m.id}')">Accepter</button>
                    </div>
                </div>`;
            }).join('');
        }

        function openFilters() {
            // Recentre l'utilisateur sur la barre de recherche (filtres avancés à venir).
            const input = document.querySelector('.search-input');
            if (input) input.focus();
        }

        function filterMissions(type, element) {
            document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
            element.classList.add('active');
            activeFilter = type;
            renderMissions();
        }

        function sortMissions() {
            priceSortAsc = !priceSortAsc;
            renderMissions();
        }

        function viewDetails(missionId) {
            const m = allMissions.find(x => String(x.id) === String(missionId));
            if (!m) return;
            const desc = m.package_description ? `\nColis: ${m.package_description}` : '';
            alert(
                `Mission ${m.mission_code || ''}\n\n` +
                `${m.departure_city || m.departure_country} → ${m.arrival_city || m.arrival_country}\n` +
                `Prix: ${formatPrice(m.price)} (${m.is_price_negotiable ? 'négociable' : 'fixe'})\n` +
                `Poids: ${parseFloat(m.weight) || 0} kg${desc}\n` +
                `Départ: ${formatDate(m.departure_date)} — Arrivée: ${formatDate(m.desired_arrival_date)}\n` +
                `Expéditeur: ${m.expediteur_name || '—'}`
            );
        }

        async function acceptMission(missionId) {
            const m = allMissions.find(x => String(x.id) === String(missionId));
            const label = m ? `${m.departure_city || ''} → ${m.arrival_city || ''}` : missionId;
            if (!confirm(`Accepter la mission ${label} ?\n\nVous vous engagez à transporter ce colis selon les conditions établies.`)) {
                return;
            }
            try {
                const res = await fetch(`${API_BASE_URL}/missions/${missionId}/accept`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(myTripId ? { trip_id: myTripId } : {})
                });
                const json = await res.json();
                if (res.ok && json.success) {
                    alert('Mission acceptée ✓\n\nL\'expéditeur sera notifié.');
                    // Retirer la mission acceptée de la liste et rafraîchir.
                    allMissions = allMissions.filter(x => String(x.id) !== String(missionId));
                    renderMissions();
                } else {
                    alert('Impossible d\'accepter la mission:\n\n' + (json.error || json.message || 'Erreur inconnue'));
                }
            } catch (error) {
                console.error('Erreur acceptation:', error);
                alert('Erreur de connexion au serveur. Veuillez réessayer.');
            }
        }

        function navigateTo(section) {
            const pages = {
                'home': 'dashgp.html',
                'missions': 'missions.html',
                'trips': 'trajets.html',
                'earnings': 'gains.html',
                'profile': 'profilegp.html'
            };
            if (pages[section]) window.location.href = pages[section];
        }

        // Recherche en direct
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.querySelector('.search-input');
            if (input) {
                input.addEventListener('input', (e) => {
                    searchTerm = e.target.value.trim();
                    renderMissions();
                });
            }
            loadMissions();
        });
    </script>
</body>
</html>
