<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Notifications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-frame {
            width: 100%;
            max-width: 375px;
            height: 667px;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95) 0%, rgba(48, 43, 99, 0.95) 50%, rgba(36, 36, 62, 0.95) 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .time { color: #fff; }
        .indicators {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .signal, .wifi, .battery {
            width: 18px;
            height: 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 2px;
        }

        /* Header */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .mark-all-btn {
            padding: 8px 16px;
            background: rgba(78, 205, 196, 0.2);
            color: #4ECDC4;
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mark-all-btn:hover {
            background: rgba(78, 205, 196, 0.3);
            transform: translateY(-2px);
        }

        /* Content */
        .content {
            height: calc(100% - 44px - 85px - 73px);
            overflow-y: auto;
            padding: 20px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            color: #1a1a2e;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        /* Notification Cards */
        .notif-section {
            margin-bottom: 24px;
        }

        .section-date {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .notif-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .notif-card.unread {
            background: rgba(78, 205, 196, 0.12);
            border-color: rgba(78, 205, 196, 0.3);
        }

        .notif-card.unread::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #4ECDC4;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.6);
        }

        .notif-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .notif-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .notif-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .notif-icon.success {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3) 0%, rgba(76, 175, 80, 0.2) 100%);
        }

        .notif-icon.info {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.3) 0%, rgba(78, 205, 196, 0.2) 100%);
        }

        .notif-icon.warning {
            background: linear-gradient(135deg, rgba(255, 230, 109, 0.3) 0%, rgba(255, 230, 109, 0.2) 100%);
        }

        .notif-icon.alert {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3) 0%, rgba(255, 107, 107, 0.2) 100%);
        }

        .notif-content {
            flex: 1;
            padding-left: 12px;
        }

        .notif-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .notif-message {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .notif-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notif-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .notif-category {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .empty-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: linear-gradient(180deg, rgba(15, 12, 41, 0.95) 0%, rgba(26, 22, 48, 0.98) 100%);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 6px 10px;
            border-radius: 12px;
            flex: 1;
            max-width: 70px;
            position: relative;
        }

        .nav-item.active { color:#FF6B6B; }
        .nav-icon { width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
        .nav-icon svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
        .nav-item.active::after { content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:26px; height:3px; border-radius:0 0 3px 3px; background:linear-gradient(90deg,#FF6B6B,#FFE66D); }
        .nav-label { font-size:10px; font-weight:600; color:inherit; }
        .nav-badge {
            position:absolute; top:0px; left:calc(50% + 5px); min-width:17px; height:17px;
            background:#FF4757; border:1.5px solid #121024; border-radius:9px;
            display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; padding:0 4px;
        }
        .nav-badge.hidden { display:none; }
        /* notif extras */
        .notif-card { position:relative; }
        .notif-del { position:absolute; top:10px; right:10px; background:rgba(255,107,107,.15); color:#ff8f8f; border:none;
            border-radius:8px; width:28px; height:28px; font-size:13px; cursor:pointer; }
        .notif-empty { text-align:center; padding:50px 20px; color:rgba(255,255,255,.5); }
        .notif-empty .ic { font-size:46px; margin-bottom:10px; }
        /* Mission-assignment card (admin → GP) */
        .mission-assign-card { display:block; padding:16px; border:1px solid rgba(255,215,0,.45);
            background:linear-gradient(135deg,rgba(255,215,0,.10),rgba(255,165,0,.06)); border-radius:16px; margin-bottom:12px; }
        .ma-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        .ma-badge { width:42px; height:42px; border-radius:12px; flex-shrink:0; font-size:21px;
            background:linear-gradient(135deg,rgba(255,215,0,.3),rgba(255,165,0,.2)); display:flex; align-items:center; justify-content:center; }
        .ma-title { font-size:14px; font-weight:800; color:#FFD700; }
        .ma-sub { font-size:11px; color:rgba(255,255,255,.5); }
        .ma-route { background:rgba(255,255,255,.06); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; font-weight:700; color:#fff; }
        .ma-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
        .ma-cell { background:rgba(255,255,255,.06); border-radius:10px; padding:9px 12px; }
        .ma-label { font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }
        .ma-value { font-size:13px; font-weight:700; color:#fff; }
        .ma-actions { display:flex; gap:10px; }
        .ma-btn { flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; border:none; transition:all .2s ease; }
        .ma-accept { background:linear-gradient(135deg,#4CAF50,#43A047); color:#fff; box-shadow:0 4px 12px rgba(76,175,80,.4); }
        .ma-decline { background:rgba(255,107,107,.1); border:2px solid rgba(255,107,107,.4); color:#FF6B6B; }
        .ma-state { border-radius:12px; padding:12px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
        .ma-state.ok { background:rgba(76,175,80,.15); border:1px solid rgba(76,175,80,.4); color:#4CAF50; }
        .ma-state.no { background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.3); color:#FF6B6B; }
            /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}
        </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SEN GP">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script src="pwa.js" defer></script>
</head>
<body class="ds">
    <div class="mobile-frame">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()">←</button>
                <div class="header-title">
                    <h1>Notifications</h1>
                    <p>5 non lues</p>
                </div>
            </div>
            <button class="mark-all-btn" onclick="markAllAsRead()">Tout marquer lu</button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="tab-all" onclick="switchTab('all',this)">Toutes (0)</button>
                <button class="tab" id="tab-unread" onclick="switchTab('unread',this)">Non lues (0)</button>
            </div>

            <div class="notif-section" id="notifList">
                <div class="notif-empty">Chargement…</div>
            </div>
        </div>

        <!-- Bottom Navigation (expediteur default; replaced for GP in JS) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item" onclick="navigateTo('home')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div><div class="nav-label">Accueil</div></div>
            <div class="nav-item" onclick="navigateTo('reclamation')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10.3 4 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><div class="nav-label">Réclamation</div></div>
            <div class="nav-item" onclick="navigateTo('tracking')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="nav-label">Suivi</div></div>
            <div class="nav-item active" onclick="navigateTo('notifications')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div><div class="nav-label">Notifications</div><div class="nav-badge hidden" id="notifNavBadge">0</div></div>
            <div class="nav-item" onclick="navigateTo('profile')"><div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div><div class="nav-label">Profil</div></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.API_BASE_URL;
        function getAuthToken() { return localStorage.getItem('authToken'); }

        // Detect whether the signed-in user is a GP or an expéditeur so the nav,
        // back button and routing match the rest of their app.
        let userType = 'expediteur';
        try { userType = (JSON.parse(localStorage.getItem('userData') || '{}').user_type) || 'expediteur'; } catch (e) {}

        function goBack() {
            window.location.href = userType === 'gp' ? 'dashgp.html' : 'dashexpediteur.html';
        }

        function buildNav() {
            if (userType !== 'gp') return; // expéditeur nav is the static default in the HTML
            document.getElementById('bottomNav').innerHTML =
                '<div class="nav-item" onclick="navigateTo(\'home\')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div><div class="nav-label">Accueil</div></div>'
              + '<div class="nav-item" onclick="navigateTo(\'missions\')"><div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><div class="nav-label">Missions</div></div>'
              + '<div class="nav-item" onclick="navigateTo(\'trips\')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M2 16 22 6 12 22l-2-7-8-2z"/></svg></div><div class="nav-label">Trajets</div></div>'
              + '<div class="nav-item active" onclick="navigateTo(\'notifications\')"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div><div class="nav-label">Notifs</div><div class="nav-badge hidden" id="notifNavBadge">0</div></div>'
              + '<div class="nav-item" onclick="navigateTo(\'profile\')"><div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div><div class="nav-label">Profil</div></div>';
        }

        let allNotifs = [];
        let currentTab = 'all';
        // Local response state for assigned missions, keyed by notification id.
        const missionStates = {};
        const IC = (p) => '<svg class="ic" viewBox="0 0 24 24">' + p + '</svg>';
        const ICONS = {
            delivery: IC('<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/>'),
            tracking: IC('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'),
            payment: IC('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
            support: IC('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
            promo: IC('<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>'),
            feedback: IC('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'),
            mission_assigned: IC('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
            mission_matched: IC('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
            mission_accepted: IC('<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>'),
            mission_delivered: IC('<path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>')
        };
        const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        async function loadUserNotifications() {
            const token = getAuthToken();
            if (!token) { window.location.href = 'connexion.html'; return; }
            try {
                const response = await fetch(`${API_BASE_URL}/notifications/my-notifications?limit=100`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('load');
                allNotifs = (await response.json()).data || [];
                updateCounts();
                render();
            } catch (e) {
                document.getElementById('notifList').innerHTML = '<div class="notif-empty">Erreur de chargement.</div>';
            }
        }

        function updateCounts() {
            const unread = allNotifs.filter(n => !n.is_read).length;
            document.querySelector('.header-title p').textContent = unread + ' non lue' + (unread > 1 ? 's' : '');
            document.getElementById('tab-all').textContent = 'Toutes (' + allNotifs.length + ')';
            document.getElementById('tab-unread').textContent = 'Non lues (' + unread + ')';
            const nav = document.getElementById('notifNavBadge');
            if (unread > 0) { nav.textContent = unread; nav.classList.remove('hidden'); }
            else { nav.classList.add('hidden'); }
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
            render();
        }

        function render() {
            const list = currentTab === 'unread' ? allNotifs.filter(n => !n.is_read) : allNotifs;
            const box = document.getElementById('notifList');
            if (!list.length) {
                box.innerHTML = '<div class="notif-empty"><div class="ic">' + IC('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>') + '</div>' +
                    (currentTab === 'unread' ? 'Aucune notification non lue.' : 'Aucune notification pour le moment.') + '</div>';
                return;
            }
            box.innerHTML = list.map(card).join('');
        }

        function card(n) {
            if (n.notification_type === 'mission_assigned' || n.notification_type === 'mission_matched') {
                return missionCard(n);
            }
            return '<div class="notif-card ' + (!n.is_read ? 'unread' : '') + '" onclick="viewNotif(\'' + n.notification_id + '\')">'
                + '<div class="notif-icon">' + (ICONS[n.type] || ICONS[n.notification_type] || IC('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>')) + '</div>'
                + '<div class="notif-content">'
                + '<div class="notif-title">' + esc(n.title) + '</div>'
                + '<div class="notif-message">' + esc(n.message) + '</div>'
                + '<div class="notif-time">' + formatTime(n.created_at) + '</div>'
                + '</div>'
                + (!n.is_read ? '<div class="unread-dot"></div>' : '')
                + '<button class="notif-del" onclick="delNotif(event,\'' + n.notification_id + '\')">' + IC('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>') + '</button>'
                + '</div>';
        }

        function formatFCFA(v) {
            const num = Number(v);
            return isFinite(num) ? num.toLocaleString('fr-FR') + ' FCFA' : String(v);
        }

        // Rich card for a mission the admin assigned to this GP, with Accept/Decline.
        function missionCard(n) {
            const md = n.metadata || {};
            const missionId = md.mission_id || '';
            const code = md.mission_code || '';
            const route = md.route || (md.departure_city && md.arrival_city ? md.departure_city + ' → ' + md.arrival_city : n.title);
            const date = md.departure_date
                ? new Date(md.departure_date).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' })
                : '—';
            const time = (md.departure_has_time && md.departure_date)
                ? new Date(md.departure_date).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })
                : '—';
            const weight = (md.package_weight != null) ? md.package_weight + ' kg' : '—';
            const price = (md.price != null) ? formatFCFA(md.price) : '—';
            const state = missionStates[n.notification_id];

            let action;
            if (state === 'accepted') {
                action = '<div class="ma-state ok">✅ Mission acceptée — l\'équipe SEN GP vous contactera pour confirmer et organiser la remise du colis.</div>';
            } else if (state === 'declined') {
                action = '<div class="ma-state no">❌ Mission déclinée — elle sera ré-assignée à un autre GP de la même catégorie.</div>';
            } else if (!missionId) {
                action = '<div class="ma-state no">⚠️ Détails de mission indisponibles.</div>';
            } else {
                action = '<div class="ma-actions">'
                    + '<button class="ma-btn ma-accept" onclick="handleMissionResponse(\'' + n.notification_id + '\',\'' + missionId + '\',\'accept\')">' + IC('<polyline points="20 6 9 17 4 12"/>') + ' Accepter</button>'
                    + '<button class="ma-btn ma-decline" onclick="handleMissionResponse(\'' + n.notification_id + '\',\'' + missionId + '\',\'decline\')">' + IC('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>') + ' Décliner</button>'
                    + '</div>';
            }

            return '<div class="notif-card mission-assign-card ' + (!n.is_read ? 'unread' : '') + '" id="notif-card-' + n.notification_id + '">'
                + '<div class="ma-head">'
                + '<div class="ma-badge">' + IC('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>') + '</div>'
                + '<div style="flex:1;"><div class="ma-title">Mission assignée' + (code ? ' — ' + esc(code) : '') + '</div>'
                + '<div class="ma-sub">' + formatTime(n.created_at) + ' · <span style="color:#FFD700;">PAR L\'ADMIN</span></div></div>'
                + '<button class="notif-del" style="position:static;" onclick="delNotif(event,\'' + n.notification_id + '\')">' + IC('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>') + '</button>'
                + '</div>'
                + '<div class="ma-route">' + esc(route) + '</div>'
                + '<div class="ma-grid">'
                + '<div class="ma-cell"><div class="ma-label">' + IC('<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>') + ' Date</div><div class="ma-value">' + esc(date) + '</div></div>'
                + '<div class="ma-cell"><div class="ma-label">' + IC('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>') + ' Heure</div><div class="ma-value">' + esc(time) + '</div></div>'
                + '<div class="ma-cell"><div class="ma-label">⚖️ Poids</div><div class="ma-value">' + esc(weight) + '</div></div>'
                + '<div class="ma-cell"><div class="ma-label">' + IC('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>') + ' Rémunération</div><div class="ma-value" style="color:#FFD700;">' + esc(price) + '</div></div>'
                + '</div>'
                + action
                + '</div>';
        }

        async function handleMissionResponse(notifId, missionId, action) {
            const token = getAuthToken();
            if (action === 'decline') {
                const ok = await window.sengpConfirm(
                    'Décliner cette mission ? Elle sera ré-assignée à un autre GP de votre catégorie.',
                    { okLabel: 'Décliner', cancelLabel: 'Annuler' }
                );
                if (!ok) return;
            }
            try {
                const url = `${API_BASE_URL}/missions/${missionId}/${action === 'accept' ? 'accept' : 'decline'}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: '{}'
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Action impossible');
                }
            } catch (e) {
                window.sengpAlert(e.message || 'Action impossible. Réessayez.');
                return;
            }
            missionStates[notifId] = action === 'accept' ? 'accepted' : 'declined';
            try {
                await fetch(`${API_BASE_URL}/notifications/${notifId}/read`, {
                    method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (e) {}
            const n = allNotifs.find(x => String(x.notification_id) === String(notifId));
            if (n) n.is_read = true;
            updateCounts();
            render();
            window.sengpAlert(action === 'accept'
                ? '✅ Mission acceptée ! L\'équipe SEN GP vous contactera pour confirmer et organiser la remise du colis.'
                : 'Mission déclinée. Elle sera ré-assignée à un autre GP de la même catégorie.');
        }

        function formatTime(dateString) {
            const date = new Date(dateString), now = new Date();
            const m = Math.floor((now - date) / 60000), h = Math.floor((now - date) / 3600000), d = Math.floor((now - date) / 86400000);
            if (m < 1) return "À l'instant";
            if (m < 60) return 'Il y a ' + m + ' min';
            if (h < 24) return 'Il y a ' + h + ' h';
            if (d < 7) return 'Il y a ' + d + ' j';
            return date.toLocaleDateString('fr-FR');
        }

        async function viewNotif(id) {
            const n = allNotifs.find(x => String(x.notification_id) === String(id));
            const token = getAuthToken();
            try {
                await fetch(`${API_BASE_URL}/notifications/${id}/read`, {
                    method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (e) {}
            if (n) n.is_read = true;
            updateCounts();
            // Redirige vers l'élément concerné si la notification a une cible.
            const url = n && n.action_url;
            if (url) {
                if (/^https?:\/\//i.test(url)) window.open(url, '_blank');
                else window.location.href = url;
                return;
            }
            render();
        }

        async function delNotif(ev, id) {
            ev.stopPropagation();
            const token = getAuthToken();
            try {
                await fetch(`${API_BASE_URL}/notifications/${id}`, {
                    method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
                });
                allNotifs = allNotifs.filter(x => String(x.notification_id) !== String(id));
                updateCounts();
                render();
            } catch (e) { alert('Suppression impossible.'); }
        }

        async function markAllAsRead() {
            const token = getAuthToken();
            try {
                const r = await fetch(`${API_BASE_URL}/notifications/mark-all-read`, {
                    method: 'PUT', headers: { 'Authorization': `Bearer ${token}` }
                });
                if (r.ok) { allNotifs.forEach(n => n.is_read = true); updateCounts(); render(); }
                else alert('Erreur lors de la mise à jour');
            } catch (e) { console.error(e); }
        }

        function navigateTo(section) {
            const gp = { home:'dashgp.html', missions:'missions.html', trips:'trajets.html', notifications:'notifications.html', profile:'profilegp.html' };
            const exp = { home:'dashexpediteur.html', reclamation:'reclamation.html', tracking:'suivi.html', notifications:'notifications.html', profile:'profile.html' };
            const pages = userType === 'gp' ? gp : exp;
            if (pages[section]) window.location.href = pages[section];
        }

        window.onPullRefresh = async () => { await loadUserNotifications(); return true; };
        window.addEventListener('load', () => { buildNav(); loadUserNotifications(); });
        setInterval(() => { if (!document.hidden) loadUserNotifications(); }, 60000);
    </script>
    <script src="ptr.js"></script>
</body>
</html>
