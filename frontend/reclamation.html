<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Réclamations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-frame {
            width: 100%;
            max-width: 375px;
            height: 667px;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95) 0%, rgba(48, 43, 99, 0.95) 50%, rgba(36, 36, 62, 0.95) 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .time { color: #fff; }
        .indicators {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .signal, .wifi, .battery {
            width: 18px;
            height: 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 2px;
        }

        /* Header */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Content */
        .content {
            height: calc(100% - 44px - 85px - 73px);
            overflow-y: auto;
            padding: 20px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            color: #1a1a2e;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        /* New Claim Button */
        .new-claim-btn {
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            border: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            margin-bottom: 24px;
        }

        .new-claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 107, 0.5);
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .btn-text {
            flex: 1;
            text-align: left;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 2px;
        }

        .btn-subtitle {
            font-size: 12px;
            color: rgba(26, 26, 46, 0.7);
        }

        /* Claim Cards */
        .claim-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .claim-card:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .claim-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .claim-type {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .claim-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .claim-info h3 {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .claim-id {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .claim-status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 230, 109, 0.2);
            color: #FFE66D;
            border: 1px solid rgba(255, 230, 109, 0.3);
        }

        .status-in-progress {
            background: rgba(78, 205, 196, 0.2);
            color: #4ECDC4;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .status-resolved {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .status-rejected {
            background: rgba(255, 107, 107, 0.2);
            color: #FF6B6B;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .claim-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .claim-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .claim-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .claim-shipment {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .empty-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto;
        }

        /* Bottom Navigation */
        .bottom-nav { position:absolute; bottom:0; left:0; right:0; background:rgba(18,16,36,.92);
            backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-top:1px solid rgba(255,255,255,.07);
            display:flex; justify-content:space-around; align-items:stretch;
            padding:9px 6px calc(9px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.35); }
        .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
            cursor:pointer; flex:1; position:relative; padding:6px 0; border-radius:14px; color:rgba(255,255,255,.5);
            transition:color .25s ease; -webkit-tap-highlight-color:transparent; }
        .nav-icon { width:24px; height:24px; display:flex; align-items:center; justify-content:center; }
        .nav-icon svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
        .nav-label { font-size:10px; font-weight:600; color:inherit; }
        .nav-item.active { color:#FF6B6B; }
        .nav-item.active::after { content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
            width:26px; height:3px; border-radius:0 0 3px 3px; background:linear-gradient(90deg,#FF6B6B,#FFE66D); }
        .nav-item:not(.active):active { color:rgba(255,255,255,.85); }
        .nav-badge { position:absolute; top:0; left:calc(50% + 5px); min-width:17px; height:17px; background:#FF4757;
            border:1.5px solid #121024; border-radius:9px; display:flex; align-items:center; justify-content:center;
            font-size:9px; font-weight:800; color:#fff; padding:0 4px; }
        .nav-badge.hidden { display:none; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 90%;
            max-width: 340px;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.98) 0%, rgba(48, 43, 99, 0.98) 100%);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .modal-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #4ECDC4;
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-footer {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
            color: #1a1a2e;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 107, 107, 0.5);
        }
        .chat-compose { display:flex; gap:10px; align-items:center; }
        .voice-btn { width:48px; height:48px; flex-shrink:0; border:none; border-radius:50%;
            background:#4ECDC4; color:#06302c; font-size:20px; cursor:pointer; transition:all .2s; }
        .voice-btn.recording { background:#FF4757; color:#fff; animation:vpulse 1s infinite; }
        @keyframes vpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
            /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}
        </style>
    <script src="config.js"></script>
</head>
<body>
    <div class="mobile-frame">

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">
                <h1>Réclamations</h1>
                <p>Gérez vos réclamations</p>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="tab-active" onclick="switchTab('active')">En cours (0)</button>
                <button class="tab" id="tab-resolved" onclick="switchTab('resolved')">Résolues (0)</button>
            </div>

            <!-- New Claim Button -->
            <button class="new-claim-btn" onclick="openNewClaimModal()">
                <div class="btn-icon">⚠️</div>
                <div class="btn-text">
                    <div class="btn-title">Nouvelle réclamation</div>
                    <div class="btn-subtitle">Signalez un problème</div>
                </div>
                <div style="font-size: 20px; color: #1a1a2e;">→</div>
            </button>

            <!-- Active Claims -->
            <div id="activeClaims">
                <!-- Les réclamations actives seront chargées dynamiquement -->
            </div>

            <!-- Resolved Claims (hidden by default) -->
            <div id="resolvedClaims" style="display: none;">
                <!-- Les réclamations résolues seront chargées dynamiquement -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="navigateTo('home')">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div>
                <div class="nav-label">Accueil</div>
            </div>

            <div class="nav-item active" onclick="navigateTo('reclamation')">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10.3 4 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
                <div class="nav-label">Réclamation</div>
            </div>

            <div class="nav-item" onclick="navigateTo('tracking')">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
                <div class="nav-label">Suivi</div>
            </div>

            <div class="nav-item" onclick="navigateTo('notifications')">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
                <div class="nav-label">Notifications</div>
            </div>

            <div class="nav-item" onclick="navigateTo('profile')">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
                <div class="nav-label">Profil</div>
            </div>
        </div>

        <!-- New Claim Modal -->
        <div class="modal-overlay" id="newClaimModal">
            <div class="modal">
                <div class="modal-header">
                    <h3 class="modal-title">Nouvelle réclamation</h3>
                    <p class="modal-subtitle">Décrivez votre problème en détail</p>
                </div>
                <div class="modal-body">
                    <form id="claimForm">
                        <div class="form-group">
                            <label class="form-label">Colis concerné</label>
                            <select class="form-select" id="packageNumber" required>
                                <option value="">Chargement de vos envois…</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Type de réclamation</label>
                            <select class="form-select" id="claimType" required>
                                <option value="">Sélectionnez un type</option>
                                <option value="damaged">Colis endommagé</option>
                                <option value="lost">Colis perdu</option>
                                <option value="delay">Retard de livraison</option>
                                <option value="tracking">Problème de suivi</option>
                                <option value="other">Autre</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Votre message</label>
                            <div class="chat-compose">
                                <input type="text" class="form-input" id="claimDescription" placeholder="Écrivez votre message…" style="flex:1;">
                                <button type="button" id="voiceBtn" class="voice-btn" onclick="toggleVoice()" title="Message vocal">🎤</button>
                            </div>
                            <div id="voicePreview" style="display:none;margin-top:10px;">
                                <audio id="voiceAudio" controls style="width:100%;"></audio>
                                <button type="button" onclick="discardVoice()" style="margin-top:6px;background:rgba(255,107,107,.2);color:#ff8f8f;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;">🗑️ Supprimer le vocal</button>
                            </div>
                            <div id="voiceStatus" style="font-size:12px;color:rgba(255,255,255,.55);margin-top:8px;">🎙️ Appuyez sur le micro pour enregistrer un message vocal (parlez dans votre langue).</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" onclick="closeNewClaimModal()">Annuler</button>
                    <button class="btn btn-submit" onclick="submitClaim()">Soumettre</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = 'dashexpediteur.html';
        }

        function switchTab(tab) {
            // Update tab buttons
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Show/hide claim lists
            if (tab === 'active') {
                document.getElementById('activeClaims').style.display = 'block';
                document.getElementById('resolvedClaims').style.display = 'none';
            } else {
                document.getElementById('activeClaims').style.display = 'none';
                document.getElementById('resolvedClaims').style.display = 'block';
            }
        }

        function openNewClaimModal() {
            document.getElementById('newClaimModal').classList.add('show');
            loadMissionsForClaim();
        }

        function closeNewClaimModal() {
            document.getElementById('newClaimModal').classList.remove('show');
            document.getElementById('claimForm').reset();
            discardVoice();
        }

        const API_BASE_URL = window.API_BASE_URL;

        // Remplit la liste des colis par TYPE (choisi à la création de l'envoi).
        async function loadMissionsForClaim() {
            const sel = document.getElementById('packageNumber');
            try {
                const res = await fetch(`${API_BASE_URL}/missions/my-missions?limit=200`, {
                    headers: { 'Authorization': `Bearer ${getAuthToken()}` }
                });
                const data = res.ok ? ((await res.json()).data || []) : [];
                if (!data.length) { sel.innerHTML = '<option value="">Aucun envoi</option>'; return; }
                sel.innerHTML = '<option value="">Sélectionnez le colis</option>' + data.map(function(m){
                    const type = (m.package_description || 'Colis').toString();
                    const route = (m.departure_city || '') + ' → ' + (m.arrival_city || '');
                    return '<option value="' + m.id + '">' + type + ' · ' + route + '</option>';
                }).join('');
            } catch (e) {
                sel.innerHTML = '<option value="">Erreur de chargement</option>';
            }
        }

        // --- Message vocal (façon WhatsApp) ---
        let mediaRecorder = null, voiceChunks = [], voiceDataUrl = null, voiceBlob = null;
        async function toggleVoice() {
            const btn = document.getElementById('voiceBtn');
            if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                voiceChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) voiceChunks.push(e.data); };
                mediaRecorder.onstop = function(){
                    const blob = new Blob(voiceChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    voiceBlob = blob;
                    stream.getTracks().forEach(function(t){ t.stop(); });
                    btn.classList.remove('recording'); btn.textContent = '🎤';
                    const reader = new FileReader();
                    reader.onload = function(){
                        voiceDataUrl = reader.result;
                        document.getElementById('voiceAudio').src = voiceDataUrl;
                        document.getElementById('voicePreview').style.display = 'block';
                        document.getElementById('voiceStatus').textContent = '✅ Message vocal enregistré.';
                    };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start();
                btn.classList.add('recording'); btn.textContent = '⏹';
                document.getElementById('voiceStatus').textContent = '🔴 Enregistrement… appuyez de nouveau pour arrêter.';
                setTimeout(function(){ if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 60000);
            } catch (e) {
                alert('Micro indisponible ou permission refusée. Vous pouvez écrire votre message.');
            }
        }
        function discardVoice() {
            voiceDataUrl = null; voiceBlob = null;
            const p = document.getElementById('voicePreview'); if (p) p.style.display = 'none';
            const s = document.getElementById('voiceStatus'); if (s) s.textContent = '🎙️ Appuyez sur le micro pour enregistrer un message vocal (parlez dans votre langue).';
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        async function loadUserClaims() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = 'connexion.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/claims/my-claims`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    displayClaims(result.data);
                } else {
                    console.error('Failed to load claims');
                }
            } catch (error) {
                console.error('Error loading claims:', error);
            }
        }

        function displayClaims(claims) {
            claims = claims || [];
            const isResolved = c => ['resolved', 'closed', 'rejected'].includes(String(c.status || '').toLowerCase());
            const activeClaims = claims.filter(c => !isResolved(c));
            const resolvedClaims = claims.filter(isResolved);

            // Update tab counts (real)
            const ta = document.getElementById('tab-active');
            const tr = document.getElementById('tab-resolved');
            if (ta) ta.textContent = `En cours (${activeClaims.length})`;
            if (tr) tr.textContent = `Résolues (${resolvedClaims.length})`;

            // Display active claims
            const activeContainer = document.getElementById('activeClaims');
            if (activeClaims.length === 0) {
                activeContainer.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:40px;">Aucune réclamation active</p>';
            } else {
                activeContainer.innerHTML = activeClaims.map(claim => createClaimCard(claim)).join('');
            }

            // Display resolved claims
            const resolvedContainer = document.getElementById('resolvedClaims');
            if (resolvedClaims.length === 0) {
                resolvedContainer.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:40px;">Aucune réclamation résolue</p>';
            } else {
                resolvedContainer.innerHTML = resolvedClaims.map(claim => createClaimCard(claim)).join('');
            }
        }

        function createClaimCard(claim) {
            const statusColors = {
                pending: '#FFE66D',
                in_progress: '#4ECDC4',
                resolved: '#4CAF50'
            };

            const statusLabels = {
                pending: 'En attente',
                in_progress: 'En cours',
                resolved: 'Résolu'
            };

            return `
                <div class="claim-card" onclick="viewClaimDetails('${claim.claim_id}')">
                    <div class="claim-header">
                        <div class="claim-id">#${claim.claim_id}</div>
                        <span class="claim-status" style="background: ${statusColors[claim.status]}20; color: ${statusColors[claim.status]}">
                            ${statusLabels[claim.status]}
                        </span>
                    </div>
                    <div class="claim-type">${claim.claim_type}</div>
                    <div class="claim-description">${claim.description || 'Aucune description'}</div>
                    <div class="claim-date">Créée le ${new Date(claim.created_at).toLocaleDateString('fr-FR')}</div>
                </div>
            `;
        }

        async function submitClaim() {
            const token = getAuthToken();
            const missionId = document.getElementById('packageNumber').value;
            const claimType = document.getElementById('claimType').value;
            const text = document.getElementById('claimDescription').value.trim();

            if (!missionId || !claimType) {
                alert('Veuillez choisir le colis et le type de réclamation.');
                return;
            }
            if (!text && !voiceDataUrl) {
                alert('Écrivez un message ou enregistrez un vocal.');
                return;
            }

            const body = {
                mission_id: missionId,
                claim_type: claimType,
                description: text || '[Message vocal]'
            };

            // Téléverser le vocal vers S3 (repli sur data-URL si l'upload échoue).
            if (voiceBlob) {
                try {
                    const fd = new FormData();
                    const ext = (voiceBlob.type.split('/')[1] || 'webm').split(';')[0];
                    fd.append('file', voiceBlob, 'message.' + ext);
                    const up = await fetch(`${API_BASE_URL}/uploads`, {
                        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd
                    });
                    const uj = await up.json();
                    if (up.ok && uj.success && uj.data && uj.data.key) body.evidence_urls = [uj.data.key];
                    else if (voiceDataUrl) body.evidence_urls = [voiceDataUrl];
                } catch (e) {
                    if (voiceDataUrl) body.evidence_urls = [voiceDataUrl];
                }
            }

            try {
                const response = await fetch(`${API_BASE_URL}/claims`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    alert('Réclamation soumise avec succès!\n\nVous recevrez une notification dès qu\'elle sera traitée.');
                    closeNewClaimModal();
                    loadUserClaims();
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + (error.error || error.message || 'Impossible de soumettre la réclamation'));
                }
            } catch (error) {
                console.error('Error submitting claim:', error);
                alert('Erreur de connexion au serveur');
            }
        }

        function viewClaimDetails(claimId) {
            alert(`Voir les détails de la réclamation\n\nID: ${claimId}\n\nInformations complètes, historique, messages, etc.`);
        }

        // Load claims on page load
        window.addEventListener('load', () => {
            loadUserClaims();
        });

        function navigateTo(section) {
            const pages = {
                'home': 'dashexpediteur.html',
                'reclamation': 'reclamation.html',
                'tracking': 'suivi.html',
                'notifications': 'notifications.html',
                'profile': 'profile.html'
            };

            if (pages[section]) {
                window.location.href = pages[section];
            }
        }

        // Close modal when clicking outside
        document.getElementById('newClaimModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeNewClaimModal();
            }
        });
    </script>
</body>
</html>
