<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEN GP - Suivi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%); min-height:100vh; display:flex; justify-content:center; color:#fff; }
  .mobile-frame { width:100%; max-width:480px; min-height:100vh; min-height:100dvh; position:relative;
    background:linear-gradient(135deg, rgba(15,12,41,.95), rgba(36,36,62,.95)); padding-bottom:78px; }
  .header { padding:18px 18px 14px; background:rgba(255,255,255,.03); border-bottom:1px solid rgba(255,255,255,.1);
    position:sticky; top:0; z-index:6; backdrop-filter:blur(10px); }
  .header h1 { font-size:20px; margin-bottom:2px; }
  .header p { font-size:12px; color:rgba(255,255,255,.6); margin-bottom:12px; }
  .track-bar { display:flex; gap:8px; }
  .track-bar input { flex:1; padding:11px 14px; border-radius:11px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08); color:#fff; font-size:14px; }
  .track-bar button { padding:11px 14px; border:none; border-radius:11px; background:#FF6B6B; color:#fff; font-weight:700; font-size:13px; cursor:pointer; }
  .content { padding:16px 18px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; background:rgba(255,255,255,.05); padding:6px; border-radius:14px; }
  .tab { flex:1; padding:9px; border:none; border-radius:10px; background:transparent; color:rgba(255,255,255,.6); font-weight:600; font-size:13px; cursor:pointer; }
  .tab.active { background:linear-gradient(135deg,#FF6B6B,#FFE66D); color:#1a1a2e; }
  .card { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; }
  .code { font-size:12px; color:rgba(255,255,255,.5); }
  .ptype { font-weight:700; font-size:15px; }
  .badge { padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; }
  .b-yellow{background:rgba(255,215,0,.18);color:#FFD700}.b-blue{background:rgba(78,205,196,.2);color:#4ECDC4}
  .b-green{background:rgba(76,175,80,.2);color:#7ee081}.b-red{background:rgba(255,107,107,.2);color:#ff8f8f}.b-gray{background:rgba(255,255,255,.12);color:#ccc}
  .route { display:flex; align-items:center; gap:8px; font-size:14px; margin:10px 0; }
  .route .flag{font-size:20px} .route .arrow{color:rgba(255,255,255,.4)}
  /* étapes */
  .steps { display:flex; align-items:center; margin:14px 0 4px; }
  .step { flex:1; text-align:center; position:relative; }
  .step .dot { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.18); margin:0 auto; }
  .step.done .dot { background:#4ECDC4; box-shadow:0 0 0 3px rgba(78,205,196,.2); }
  .step .lbl { font-size:8.5px; color:rgba(255,255,255,.5); margin-top:5px; text-transform:uppercase; letter-spacing:.2px; }
  .step.done .lbl { color:#4ECDC4; }
  .step .bar { position:absolute; top:6px; left:-50%; width:100%; height:2px; background:rgba(255,255,255,.15); z-index:-1; }
  .step.done .bar { background:#4ECDC4; }
  .steps { position:relative; z-index:0; }
  iframe.map { width:100%; height:150px; border:0; border-radius:12px; margin-top:6px; background:rgba(255,255,255,.04); }
  .map-ph { width:100%; height:60px; border-radius:12px; background:rgba(255,255,255,.04); display:flex; align-items:center; justify-content:center; font-size:12px; color:rgba(255,255,255,.5); margin-top:6px; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:rgba(255,255,255,.6); margin-top:10px; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { flex:1; min-width:96px; padding:10px; border:none; border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none; text-align:center; }
  .btn-d{background:rgba(255,255,255,.1);color:#fff}.btn-call{background:rgba(76,175,80,.22);color:#7ee081}.btn-share{background:rgba(78,205,196,.2);color:#4ECDC4}
  .alert { font-size:12px; padding:8px 10px; border-radius:10px; margin-top:10px; }
  .alert-warn{background:rgba(255,215,0,.12);color:#FFD700}.alert-ok{background:rgba(76,175,80,.15);color:#7ee081}
  .loading,.empty { text-align:center; padding:50px 20px; color:rgba(255,255,255,.55); }
  .empty .ic{font-size:46px;margin-bottom:10px}
  .empty .cta{display:inline-block;margin-top:14px;padding:11px 18px;border-radius:12px;background:linear-gradient(135deg,#FF6B6B,#FFE66D);color:#1a1a2e;font-weight:700;text-decoration:none}
  /* bottom nav */
  .bottom-nav{position:absolute;bottom:0;left:0;right:0;background:rgba(18,16,36,.92);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-around;align-items:stretch;padding:9px 6px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.35)}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex:1;position:relative;padding:6px 0;border-radius:14px;color:rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent}
  .nav-icon-wrapper{position:relative;display:flex;align-items:center;justify-content:center;width:24px;height:24px}
  .nav-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav-label{font-size:10px;font-weight:600}
  .nav-item.active{color:#FF6B6B}
  .nav-item.active::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#FF6B6B,#FFE66D)}
  /* bottom sheet */
  .sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .sheet-ov.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#1d1b34;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:51}
  .sheet-ov.open .sheet{transform:translateY(0)}
  .sheet-grip{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:6px auto 14px}
  .sheet h3{font-size:16px;margin-bottom:12px}
  .share-opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:none;border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-weight:600;margin-bottom:10px;cursor:pointer;text-align:left}
  .share-opt .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .ic-wa{background:#25D366}.ic-mail{background:#EA4335}.ic-copy{background:rgba(255,255,255,.15)}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="mobile-frame">
  <div class="header">
    <h1>Suivi en temps réel</h1>
    <p>Localisez vos colis en cours d'acheminement</p>
    <div class="track-bar">
      <input id="trackInput" placeholder="Suivre par n° de colis…">
      <button onclick="trackByCode()">Suivre</button>
    </div>
  </div>

  <div class="content">
    <div class="tabs">
      <button class="tab active" id="t-encours" onclick="setTab('encours',this)">En cours</button>
      <button class="tab" id="t-avenir" onclick="setTab('avenir',this)">À venir</button>
      <button class="tab" id="t-livres" onclick="setTab('livres',this)">Livrés</button>
    </div>
    <div id="list"><div class="loading">Chargement…</div></div>
  </div>

  <!-- Bottom nav (expéditeur) -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="navigateTo('home')"><div class="nav-icon-wrapper"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div></div><div class="nav-label">Accueil</div></div>
    <div class="nav-item" onclick="navigateTo('reclamation')"><div class="nav-icon-wrapper"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10.3 4 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div></div><div class="nav-label">Réclamation</div></div>
    <div class="nav-item active" onclick="navigateTo('tracking')"><div class="nav-icon-wrapper"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></div></div><div class="nav-label">Suivi</div></div>
    <div class="nav-item" onclick="navigateTo('notifications')"><div class="nav-icon-wrapper"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div></div><div class="nav-label">Notifications</div></div>
    <div class="nav-item" onclick="navigateTo('profile')"><div class="nav-icon-wrapper"><div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div></div><div class="nav-label">Profil</div></div>
  </div>
</div>

<!-- Bottom sheet partage -->
<div class="sheet-ov" id="shareSheet" onclick="if(event.target===this)closeShareSheet()">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <h3>Partager le suivi</h3>
    <button class="share-opt" id="waBtn"><span class="ic ic-wa">🟢</span> WhatsApp</button>
    <button class="share-opt" id="mailBtn"><span class="ic ic-mail">✉️</span> Email / Gmail</button>
    <button class="share-opt" id="copyBtn"><span class="ic ic-copy">🔗</span> Copier le lien</button>
  </div>
</div>

<script>
  const API = window.API_BASE_URL;
  const token = localStorage.getItem('authToken');
  let all = [];
  let tab = 'encours';

  const BUCKETS = {
    encours: ['picked_up','in_transit','in_customs','out_for_delivery'],
    avenir: ['pending','matched','accepted'],
    livres: ['delivered']
  };
  const FLAGS={'Sénégal':'🇸🇳','Senegal':'🇸🇳','France':'🇫🇷','Espagne':'🇪🇸','Italie':'🇮🇹','USA':'🇺🇸','États-Unis':'🇺🇸','Canada':'🇨🇦','Royaume-Uni':'🇬🇧','Allemagne':'🇩🇪','Maroc':'🇲🇦','Mali':'🇲🇱'};
  const flag=c=>FLAGS[c]||'🌍';
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const dt=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
  function timeAgo(d){ if(!d) return ''; const m=Math.floor((Date.now()-new Date(d))/60000); if(m<1)return "à l'instant"; if(m<60)return 'il y a '+m+' min'; const h=Math.floor(m/60); if(h<24)return 'il y a '+h+' h'; return 'il y a '+Math.floor(h/24)+' j'; }
  const STATUS={pending:['En attente','b-yellow'],matched:['Pris en charge','b-yellow'],accepted:['Accepté','b-blue'],picked_up:['Récupéré','b-blue'],in_transit:['En transit','b-blue'],in_customs:['En douane','b-blue'],out_for_delivery:['En livraison','b-blue'],delivered:['Livré','b-green'],cancelled:['Annulé','b-red']};
  function badge(s){var m=STATUS[String(s||'').toLowerCase()]||[s,'b-gray'];return '<span class="badge '+m[1]+'">'+esc(m[0])+'</span>';}
  function stepIndex(s){ return {picked_up:1,in_transit:2,in_customs:3,out_for_delivery:4,delivered:5}[String(s||'').toLowerCase()]||0; }
  const STEP_LABELS=['Récupéré','Transit','Douane','Livraison','Livré'];

  function originBase(){ return API.replace(/\/api\/v1\/?$/,''); }
  function publicUrl(m){ return originBase()+'/t/'+encodeURIComponent(m.tracking_number||m.mission_code||''); }

  function navigateTo(section){
    const pages={home:'dashexpediteur.html',reclamation:'reclamation.html',tracking:'suivi.html',notifications:'notifications.html',profile:'profile.html'};
    if(pages[section]) window.location.href=pages[section];
  }
  function trackByCode(){
    const v=(document.getElementById('trackInput').value||'').trim();
    if(!v) return;
    // S'il correspond à un de mes colis -> détails, sinon page publique.
    const mine=all.find(m=>String(m.tracking_number||'').toLowerCase()===v.toLowerCase()||String(m.mission_code||'').toLowerCase()===v.toLowerCase());
    if(mine){ window.location.href='detailenvoi.html?id='+mine.id; }
    else { window.open(originBase()+'/t/'+encodeURIComponent(v),'_blank'); }
  }

  async function load(){
    if(!token){ window.location.href='connexion.html'; return; }
    try{
      const res=await fetch(`${API}/missions/my-missions?limit=200`,{headers:{'Authorization':'Bearer '+token}});
      if(!res.ok) throw new Error('Chargement impossible');
      all=(await res.json()).data||[];
      render();
    }catch(e){ document.getElementById('list').innerHTML='<div class="empty">Erreur: '+esc(e.message)+'</div>'; }
  }
  function setTab(t,el){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(); }

  function render(){
    const list=all.filter(m=>BUCKETS[tab].includes(String(m.status||'').toLowerCase()));
    const box=document.getElementById('list');
    if(!list.length){
      box.innerHTML='<div class="empty"><div class="ic">📦</div>Aucun colis '+(tab==='encours'?'en cours':tab==='avenir'?'à venir':'livré')+'.'+
        (tab==='encours'?'<br><a class="cta" href="creenvoi.html">Créer un envoi</a>':'')+'</div>';
      return;
    }
    box.innerHTML=list.map(card).join('');
    // Hydrater la carte live pour les colis en transit.
    list.forEach(m=>{ if(['in_transit','in_customs','out_for_delivery','picked_up'].includes(String(m.status||'').toLowerCase())) hydrate(m.id); });
  }

  function card(m){
    const si=stepIndex(m.status);
    const steps=STEP_LABELS.map((lbl,idx)=>{ const n=idx+1; const done=si>=n?'done':''; return '<div class="step '+done+'">'+(idx>0?'<div class="bar"></div>':'')+'<div class="dot"></div><div class="lbl">'+lbl+'</div></div>'; }).join('');
    const eta=m.desired_arrival_date||m.desired_departure_date;
    const late=eta && new Date(eta)<new Date() && si<5;
    const alert = String(m.status).toLowerCase()==='delivered' ? '<div class="alert alert-ok">✅ Colis livré</div>'
      : String(m.status).toLowerCase()==='in_customs' ? '<div class="alert alert-warn">🛃 En cours de dédouanement</div>'
      : late ? '<div class="alert alert-warn">⏱️ Arrivée prévue dépassée — en attente de mise à jour</div>' : '';
    const gpPhone=(m.gp_phone||'').replace(/\s/g,'');
    return '<div class="card">'
      +'<div class="row"><div><div class="ptype">'+esc(m.package_description||'Colis')+'</div><div class="code">'+esc(m.tracking_number||m.mission_code||'')+'</div></div>'+badge(m.status)+'</div>'
      +'<div class="route"><span class="flag">'+flag(m.departure_country)+'</span><span>'+esc(m.departure_city||'')+'</span><span class="arrow">→</span><span class="flag">'+flag(m.arrival_country)+'</span><span>'+esc(m.arrival_city||'')+'</span></div>'
      +'<div class="steps">'+steps+'</div>'
      +'<div id="map-'+m.id+'" class="map-ph">Localisation en cours…</div>'
      +'<div class="meta"><span>🎯 Arrivée prévue : '+dt(eta)+'</span><span>👤 '+esc(m.recipient_name||'—')+'</span></div>'
      + (m.gp_name?'<div class="meta"><span>🚚 '+esc(m.gp_name)+'</span><span id="upd-'+m.id+'"></span></div>':'')
      + alert
      +'<div class="actions">'
      +'<a class="btn btn-d" href="detailenvoi.html?id='+m.id+'">Détails</a>'
      +(gpPhone?'<a class="btn btn-call" href="tel:'+esc(gpPhone)+'">📞 GP</a>':'')
      +'<button class="btn btn-share" onclick="openShareSheet(\''+esc(publicUrl(m))+'\')">Partager</button>'
      +'</div></div>';
  }

  async function hydrate(id){
    try{
      const res=await fetch(`${API}/missions/${id}/tracking`,{headers:{'Authorization':'Bearer '+token}});
      if(!res.ok) return;
      const tr=(await res.json()).data||[];
      const gps=tr.find(t=>t.latitude&&t.longitude);
      const mapEl=document.getElementById('map-'+id);
      if(gps && mapEl){
        const la=Number(gps.latitude),lo=Number(gps.longitude),d=0.05;
        const ifr=document.createElement('iframe');
        ifr.className='map'; ifr.loading='lazy';
        ifr.src='https://www.openstreetmap.org/export/embed.html?bbox='+(lo-d)+'%2C'+(la-d)+'%2C'+(lo+d)+'%2C'+(la+d)+'&layer=mapnik&marker='+la+'%2C'+lo;
        mapEl.replaceWith(ifr);
        const upd=document.getElementById('upd-'+id); if(upd) upd.textContent='📍 '+timeAgo(gps.created_at);
      } else if(mapEl){
        mapEl.textContent='Position GPS pas encore disponible';
      }
    }catch(e){}
  }

  // Bottom sheet partage
  let _shareUrl='';
  function openShareSheet(url){
    _shareUrl=url;
    const text='Suivez votre colis SEN GP en temps réel : '+url;
    document.getElementById('waBtn').onclick=()=>{ window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'); closeShareSheet(); };
    document.getElementById('mailBtn').onclick=()=>{ window.location.href='mailto:?subject='+encodeURIComponent('Suivi de votre colis SEN GP')+'&body='+encodeURIComponent(text); closeShareSheet(); };
    document.getElementById('copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); alert('Lien copié !'); }catch(e){ alert(url); } closeShareSheet(); };
    document.getElementById('shareSheet').classList.add('open');
  }
  function closeShareSheet(){ document.getElementById('shareSheet').classList.remove('open'); }

  window.onPullRefresh = async () => { await load(); return true; };
  load();
  setInterval(()=>{ if(!document.hidden) load(); }, 45000);
</script>
<script src="ptr.js"></script>
</body>
</html>
