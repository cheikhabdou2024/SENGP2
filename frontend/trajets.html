<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEN GP - Mes Trajets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .mobile-frame {
            width: 100%;
            max-width: 375px;
            height: 667px;
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95) 0%, rgba(48, 43, 99, 0.95) 50%, rgba(36, 36, 62, 0.95) 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .time { color: #fff; }
        .indicators {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .signal, .wifi, .battery {
            width: 18px;
            height: 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 2px;
        }

        /* Header */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .add-trip-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .add-trip-btn:hover {
            transform: scale(1.05);
        }

        /* Content */
        .content {
            height: calc(100% - 44px - 85px - 73px);
            overflow-y: auto;
            padding: 20px;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a2e;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        /* Trip Cards */
        .trip-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .trip-card.active {
            border-color: rgba(78, 205, 196, 0.4);
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.12) 0%, rgba(76, 175, 80, 0.08) 100%);
        }

        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .trip-id {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .trip-status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(78, 205, 196, 0.2);
            color: #4ECDC4;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .status-upcoming {
            background: rgba(255, 230, 109, 0.2);
            color: #FFE66D;
            border: 1px solid rgba(255, 230, 109, 0.3);
        }

        .status-completed {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .trip-route {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .route-location {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .route-flag {
            font-size: 32px;
        }

        .route-text {
            flex: 1;
        }

        .route-city {
            font-size: 16px;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .route-country {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .route-arrow {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Trip Details */
        .trip-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
        }

        .detail-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
        }

        /* Packages Section */
        .packages-section {
            margin-bottom: 16px;
        }

        .section-title-small {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .package-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .package-info {
            flex: 1;
        }

        .package-client {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .package-details {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .package-price {
            font-size: 16px;
            font-weight: 700;
            color: #FFD700;
        }

        /* Earnings Summary */
        .earnings-summary {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 165, 0, 0.12) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .earnings-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        .earnings-amount {
            font-size: 20px;
            font-weight: 700;
            color: #FFD700;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(78, 205, 196, 0.5);
        }

        /* Bottom Navigation (unified GP nav) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 16, 36, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding: 9px 6px calc(9px + env(safe-area-inset-bottom));
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.35);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 6px 0;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .nav-icon svg {
            width: 24px; height: 24px; fill: none; stroke: currentColor;
            stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.25s ease;
        }
        .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; color: inherit; }
        .nav-item.active { color: #FFC107; }
        .nav-item.active .nav-icon svg { transform: translateY(-1px) scale(1.06); }
        .nav-item.active::after {
            content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
            width: 26px; height: 3px; border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, #FFD700, #FFA500);
        }
        .nav-item:not(.active):active { color: rgba(255, 255, 255, 0.85); }
        .nav-badge {
            position: absolute; top: 0px; left: calc(50% + 5px);
            min-width: 17px; height: 17px; background: #FF4757;
            border: 1.5px solid #121024; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 800; color: white; padding: 0 4px;
        }
        .nav-badge.new { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #1a1a2e; }
        .nav-badge.hidden { display: none; }
            /* sengp-responsive-override */
        .mobile-frame{max-width:100%!important;width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
        body{padding:0!important;}
        </style>
    <script src="config.js"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="ui.js"></script>
</head>
<body class="ds">
    <div class="mobile-frame">

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">
                <h1>Mes Trajets</h1>
                <p>Gérez vos missions</p>
            </div>
            <button class="add-trip-btn" onclick="addTrip()">+</button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="tab-active" onclick="switchTab('active', this)">En cours (0)</button>
                <button class="tab" id="tab-upcoming" onclick="switchTab('upcoming', this)">À venir (0)</button>
                <button class="tab" id="tab-completed" onclick="switchTab('completed', this)">Terminés (0)</button>
            </div>

            <div id="tripsLoading" style="text-align:center;padding:50px 20px;color:rgba(255,255,255,0.6);font-size:13px;">
                Chargement de vos trajets…
            </div>
            <div id="tripsEmpty" style="display:none;text-align:center;padding:50px 20px;color:rgba(255,255,255,0.6);">
                <div style="font-size:44px;margin-bottom:12px;">🧳</div>
                <div id="tripsEmptyText" style="font-size:14px;line-height:1.5;">Aucun trajet ici.<br>Créez votre premier trajet avec le bouton +.</div>
            </div>
            <div id="tripsList"></div>

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="navigateTo('home')" tabindex="0" role="button" aria-label="Accueil">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg></div>
                <div class="nav-label">Accueil</div>
            </div>

            <div class="nav-item" onclick="navigateTo('missions')" tabindex="0" role="button" aria-label="Missions">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
                <div class="nav-label">Missions</div>
            </div>

            <div class="nav-item active" onclick="navigateTo('trips')" tabindex="0" role="button" aria-label="Trajets">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
                <div class="nav-label">Trajets</div>
            </div>

            <div class="nav-item" onclick="navigateTo('earnings')" tabindex="0" role="button" aria-label="Gains">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                <div class="nav-label">Gains</div>
            </div>

            <div class="nav-item" onclick="navigateTo('profile')" tabindex="0" role="button" aria-label="Profil">
                <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
                <div class="nav-label">Profil</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.API_BASE_URL;
        const authToken = localStorage.getItem('authToken');

        let allTrips = [];
        let currentBucket = 'active';

        const BUCKETS = {
            active: ['active'],
            upcoming: ['published', 'draft'],
            completed: ['completed', 'cancelled']
        };

        const FLAGS = {
            'Sénégal': '🇸🇳', 'Senegal': '🇸🇳', 'France': '🇫🇷', 'Espagne': '🇪🇸',
            'Italie': '🇮🇹', 'USA': '🇺🇸', 'États-Unis': '🇺🇸', 'Etats-Unis': '🇺🇸',
            'Canada': '🇨🇦', 'Royaume-Uni': '🇬🇧', 'Angleterre': '🇬🇧', 'Allemagne': '🇩🇪',
            'Belgique': '🇧🇪', 'Maroc': '🇲🇦', 'Mali': '🇲🇱', 'Côte d\'Ivoire': '🇨🇮'
        };
        function flagFor(c) { return FLAGS[c] || '🌍'; }
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function formatDateTime(d) {
            if (!d) return '—';
            try {
                const dt = new Date(d);
                return dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ', ' +
                       dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return '—'; }
        }
        function statusMeta(s) {
            switch (s) {
                case 'active': return { cls: 'status-active', label: '✈️ En cours' };
                case 'published': return { cls: 'status-upcoming', label: '🟢 Ouvert' };
                case 'draft': return { cls: 'status-upcoming', label: '📝 Brouillon' };
                case 'completed': return { cls: 'status-completed', label: '✓ Terminé' };
                case 'cancelled': return { cls: 'status-completed', label: '✕ Annulé' };
                default: return { cls: 'status-upcoming', label: s || '—' };
            }
        }

        function goBack() {
            window.location.href = 'dashgp.html';
        }

        function addTrip() {
            window.location.href = 'creetrajet.html';
        }

        async function loadTrips() {
            if (!authToken) {
                alert('Vous devez vous connecter pour accéder à cette page');
                window.location.href = 'connexion.html';
                return;
            }
            try {
                const res = await fetch(`${API_BASE_URL}/trips/my-trips?limit=100`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error('Échec du chargement');
                const json = await res.json();
                allTrips = json.data || [];
                document.getElementById('tripsLoading').style.display = 'none';
                updateTabCounts();
                // Sélectionner par défaut le premier onglet non vide.
                const order = ['active', 'upcoming', 'completed'];
                const firstNonEmpty = order.find(b => bucketTrips(b).length > 0);
                if (firstNonEmpty) setActiveTab(firstNonEmpty);
                renderTrips();
            } catch (e) {
                console.error('Erreur chargement trajets:', e);
                document.getElementById('tripsLoading').style.display = 'none';
                document.getElementById('tripsEmptyText').innerHTML =
                    'Impossible de charger vos trajets.<br>Vérifiez votre connexion.';
                document.getElementById('tripsEmpty').style.display = 'block';
            }
        }

        function bucketTrips(bucket) {
            const statuses = BUCKETS[bucket] || [];
            return allTrips.filter(t => statuses.includes(t.status));
        }

        function updateTabCounts() {
            document.getElementById('tab-active').textContent = `En cours (${bucketTrips('active').length})`;
            document.getElementById('tab-upcoming').textContent = `À venir (${bucketTrips('upcoming').length})`;
            document.getElementById('tab-completed').textContent = `Terminés (${bucketTrips('completed').length})`;
        }

        function setActiveTab(bucket) {
            currentBucket = bucket;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const el = document.getElementById('tab-' + bucket);
            if (el) el.classList.add('active');
        }

        function switchTab(bucket, element) {
            currentBucket = bucket;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');
            renderTrips();
        }

        function tripCard(t) {
            const st = statusMeta(t.status);
            const cap = `${t.current_packages || 0}/${t.max_packages || 0} colis`;
            const isOpen = t.status === 'published' || t.status === 'draft';
            return `
            <div class="trip-card${t.status === 'active' ? ' active' : ''}">
                <div class="trip-header">
                    <span class="trip-id">${esc(t.trip_code || '')}</span>
                    <span class="trip-status ${st.cls}">${st.label}</span>
                </div>
                <div class="trip-route">
                    <div class="route-location">
                        <span class="route-flag">${flagFor(t.departure_country)}</span>
                        <div class="route-text">
                            <div class="route-city">${esc(t.departure_city || '—')}</div>
                            <div class="route-country">${esc(t.departure_country || '')}</div>
                        </div>
                    </div>
                    <span class="route-arrow">→</span>
                    <div class="route-location">
                        <span class="route-flag">${flagFor(t.arrival_country)}</span>
                        <div class="route-text">
                            <div class="route-city">${esc(t.arrival_city || '—')}</div>
                            <div class="route-country">${esc(t.arrival_country || '')}</div>
                        </div>
                    </div>
                </div>
                <div class="trip-details">
                    <div class="detail-box">
                        <div class="detail-label">Départ</div>
                        <div class="detail-value">${formatDateTime(t.departure_date)}</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">Arrivée</div>
                        <div class="detail-value">${formatDateTime(t.arrival_date)}</div>
                    </div>
                </div>
                <div class="trip-details">
                    <div class="detail-box">
                        <div class="detail-label">Capacité</div>
                        <div class="detail-value">${parseFloat(t.available_weight) || 0} kg</div>
                    </div>
                    <div class="detail-box">
                        <div class="detail-label">Colis acceptés</div>
                        <div class="detail-value">${cap}</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="viewTripDetails('${t.id}')">Détails</button>
                    ${isOpen
                        ? `<button class="btn btn-primary" onclick="navigateTo('missions')">Chercher colis</button>`
                        : `<button class="btn btn-primary" onclick="navigateTo('missions')">Voir missions</button>`}
                </div>
            </div>`;
        }

        function renderTrips() {
            const list = bucketTrips(currentBucket);
            const container = document.getElementById('tripsList');
            const empty = document.getElementById('tripsEmpty');
            if (list.length === 0) {
                container.innerHTML = '';
                document.getElementById('tripsEmptyText').innerHTML =
                    'Aucun trajet dans cette catégorie.<br>Créez un trajet avec le bouton +.';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            container.innerHTML = list.map(tripCard).join('');
        }

        function viewTripDetails(tripId) {
            const t = allTrips.find(x => String(x.id) === String(tripId));
            if (!t) return;
            alert(
                `Trajet ${t.trip_code || ''}\n\n` +
                `${t.departure_city || t.departure_country} → ${t.arrival_city || t.arrival_country}\n` +
                `Départ: ${formatDateTime(t.departure_date)}\nArrivée: ${formatDateTime(t.arrival_date)}\n` +
                `Capacité: ${parseFloat(t.available_weight) || 0} kg\n` +
                `Colis: ${t.current_packages || 0}/${t.max_packages || 0}\n` +
                `Statut: ${statusMeta(t.status).label}`
            );
        }

        function navigateTo(section) {
            const pages = {
                'home': 'dashgp.html',
                'missions': 'missions.html',
                'trips': 'trajets.html',
                'earnings': 'gains.html',
                'profile': 'profilegp.html'
            };
            if (pages[section]) window.location.href = pages[section];
        }

        document.addEventListener('DOMContentLoaded', loadTrips);
    </script>
</body>
</html>
