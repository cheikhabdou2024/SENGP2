<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEN GP - Mes Trajets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #F4F8FD; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F4F8FD;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #0B1D3A;
        }
        :root { --tj-navy: #0B1D3A; --tj-muted: #6B7A93; --tj-orange: #F7931E; }

        /* ============================================
           MES TRAJETS (GP)
           ============================================ */
        .mobile-frame { position: relative; width: 100%; overflow: hidden; background: #F4F8FD; }
        .mobile-frame::before { content: ""; position: absolute; inset: 0; background: #F4F8FD; }
        .tj-i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        button { font: inherit; -webkit-tap-highlight-color: transparent; }

        .tj-scroll {
            position: absolute;
            top: 0; left: 0; right: 0;
            bottom: calc(76px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tj-scroll::-webkit-scrollbar { display: none; }
        .tj-scroll.is-locked { overflow: hidden; }

        /* ---- hero ---- */
        .tj-hero { position: relative; height: calc(222px + env(safe-area-inset-top, 0px)); overflow: hidden; background: linear-gradient(180deg, #0B1D3A, #2B4A7A); }
        .tj-hero img.tj-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 78% 30%; }
        .tj-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7, 20, 47, 0.55) 0%, rgba(7, 20, 47, 0.08) 62%, rgba(7, 20, 47, 0) 100%), linear-gradient(180deg, rgba(244, 248, 253, 0) 74%, #F4F8FD 100%); }
        .tj-hero__in { position: absolute; z-index: 2; left: 0; right: 0; top: env(safe-area-inset-top, 0px); max-width: 480px; margin: 0 auto; padding: 18px 16px 0; display: flex; align-items: flex-start; gap: 12px; }
        .tj-back { width: 46px; height: 46px; flex-shrink: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(40, 56, 90, 0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; cursor: pointer; }
        .tj-back .tj-i { width: 22px; height: 22px; }
        .tj-back:active { transform: scale(0.95); }
        .tj-brand img { display: block; width: 112px; height: auto; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45)); }
        .tj-brand span { display: block; margin-top: 1px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.3px; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); white-space: nowrap; }
        .tj-add { margin-left: auto; margin-top: 10px; display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; border: 0; border-radius: 18px; background: linear-gradient(135deg, #FBBF24, #F7931E); color: var(--tj-navy); font-size: 15px; font-weight: 800; line-height: 1.15; text-align: left; cursor: pointer; box-shadow: 0 10px 24px rgba(247, 147, 30, 0.4); }
        .tj-add .tj-i { width: 24px; height: 24px; stroke-width: 2.6; }
        .tj-add:active { transform: scale(0.97); }
        .tj-title { position: absolute; z-index: 2; left: 0; right: 0; bottom: 46px; max-width: 480px; margin: 0 auto; padding: 0 20px; }
        .tj-title h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.1; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6); }
        .tj-title h1 em { font-style: normal; color: #FFA52B; }
        .tj-title p { margin-top: 4px; font-size: 18px; color: #EEF3FB; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65); }

        .tj-body { position: relative; z-index: 3; max-width: 480px; margin: -26px auto 0; padding: 0 14px 26px; }

        /* ---- tabs ---- */
        .tj-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(11, 29, 58, 0.08); }
        .tj-tab { min-width: 0; min-height: 66px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 18px; background: none; color: #44526B; font-size: 16px; font-weight: 700; line-height: 1.2; text-align: left; cursor: pointer; transition: background 0.2s ease; }
        .tj-tab .tj-i { width: 28px; height: 28px; }
        .tj-tab[aria-selected="true"] { background: linear-gradient(135deg, #FB923C, #FBBF24); color: var(--tj-navy); box-shadow: 0 8px 20px rgba(247, 147, 30, 0.32); }
        .tj-tab small { display: block; font-size: inherit; font-weight: inherit; }

        /* ---- list ---- */
        .tj-list { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
        .tj-card { position: relative; width: 100%; padding: 16px 16px 14px; background: #fff; border-radius: 26px; box-shadow: 0 8px 24px rgba(11, 29, 58, 0.07); overflow: hidden; animation: tjIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i, 0) * 50ms); }
        .tj-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tj-acc, #F7931E); }
        .tj-card__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .tj-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--tj-chipbg); color: var(--tj-chipfg); font-size: 13.5px; font-weight: 800; }
        .tj-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .tj-code { font-size: 13px; font-weight: 700; color: var(--tj-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tj-route { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
        .tj-city { min-width: 0; flex: 0 1 auto; }
        .tj-city b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; overflow-wrap: anywhere; }
        .tj-city span { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 14px; color: var(--tj-muted); }
        .tj-city:last-child { text-align: right; }
        .tj-city:last-child span { justify-content: flex-end; }
        .tj-flag { width: 24px; height: 17px; flex-shrink: 0; border-radius: 4px; overflow: hidden; background: #DCE5F3; box-shadow: 0 0 0 1px rgba(11, 29, 58, 0.1); display: inline-flex; }
        .tj-flag svg { width: 100%; height: 100%; display: block; }
        .tj-path { flex: 1; min-width: 30px; display: flex; align-items: center; color: var(--tj-acc, #F7931E); }
        .tj-path::before, .tj-path::after { content: ""; flex: 1; height: 0; border-top: 2px dashed currentColor; opacity: 0.45; }
        .tj-path .tj-i { width: 24px; height: 24px; margin: 0 4px; transform: rotate(45deg); }
        .tj-facts { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #E3EAF3; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tj-fact { padding: 9px 12px; border-radius: 14px; background: #F1F5FA; min-width: 0; }
        .tj-fact small { display: block; font-size: 13px; color: var(--tj-muted); }
        .tj-fact b { display: block; margin-top: 1px; font-size: 15.5px; font-weight: 800; overflow-wrap: anywhere; }
        .tj-actions { margin-top: 14px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
        .tj-btn { min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.15s ease; }
        .tj-btn:active { transform: scale(0.985); }
        .tj-btn--ghost { background: #EAEFF7; color: var(--tj-navy); }
        .tj-btn--main { background: linear-gradient(90deg, #0A84FF, #6D4AF5); color: #fff; box-shadow: 0 10px 22px rgba(79, 70, 229, 0.28); }

        /* ---- sections + cartes de trajet (liste) ---- */
        .tj-sec { margin-top: 22px; scroll-margin-top: 12px; }
        .tj-sec__h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 10px; }
        .tj-sec__h h2 { font-size: 23px; font-weight: 800; letter-spacing: -0.3px; }
        .tj-more { display: inline-flex; align-items: center; gap: 4px; padding: 6px 4px 6px 8px; border: 0; background: none; color: #F7931E; font-size: 16px; font-weight: 700; cursor: pointer; }
        .tj-more .tj-i { width: 20px; height: 20px; }
        .tj-sec__list { display: flex; flex-direction: column; gap: 14px; }
        .tj-none { padding: 18px 16px; border-radius: 22px; background: #fff; color: var(--tj-muted); font-size: 16px; text-align: center; box-shadow: 0 8px 24px rgba(11, 29, 58, 0.05); }

        .tj-t { padding: 12px; background: #fff; border-radius: 26px; box-shadow: 0 8px 26px rgba(11, 29, 58, 0.07); animation: tjIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: calc(var(--i, 0) * 50ms); }
        .tj-t__main { display: flex; gap: 12px; }
        .tj-thumb { position: relative; width: 112px; min-height: 96px; flex-shrink: 0; border-radius: 18px; background: #CFE0F7 center / cover no-repeat; overflow: hidden; }
        .tj-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 20, 47, 0.12), rgba(7, 20, 47, 0) 50%); }
        .tj-badge { position: absolute; z-index: 1; left: 8px; top: 8px; padding: 4px 10px; border-radius: 10px; background: var(--tj-chipbg-solid, #2F6BFF); color: var(--tj-chipfg-solid, #fff); font-size: 13px; font-weight: 800; box-shadow: 0 4px 10px rgba(11, 29, 58, 0.2); }
        .tj-t__info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
        .tj-t__route { display: flex; align-items: flex-start; gap: 6px; }
        .tj-place { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; }
        .tj-place .tj-flag { width: 28px; height: 20px; }
        .tj-place b { display: block; font-size: 16.5px; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tj-place small { display: block; font-size: 13.5px; color: var(--tj-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tj-place > span:last-child { min-width: 0; }
        .tj-t__route > .tj-i { width: 16px; height: 16px; color: #B7C3D8; margin-top: 4px; }
        .tj-t__route > .tj-i.plane { width: 22px; height: 22px; color: #44526B; transform: rotate(45deg); margin-top: 0; }
        .tj-dots { margin-left: auto; width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: none; color: #44526B; cursor: pointer; }
        .tj-dots .tj-i { width: 22px; height: 22px; stroke-width: 3; }
        .tj-dots:active { background: #EEF2F8; }
        .tj-t__meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tj-mi { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .tj-mi > .tj-i { width: 24px; height: 24px; color: #6B7A93; }
        .tj-mi b { display: block; font-size: 15.5px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
        .tj-mi small { display: block; font-size: 13.5px; color: var(--tj-muted); }
        .tj-t__foot { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
        .tj-prog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 16px; background: #F4F7FB; overflow: hidden; }
        .tj-ps { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--tj-muted); white-space: nowrap; }
        .tj-ps i { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #C5D0E2; color: #9AA8C0; font-style: normal; }
        .tj-ps i svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
        .tj-ps.done { color: var(--tj-navy); }
        .tj-ps.done i { background: #17A34A; border-color: #17A34A; color: #fff; }
        .tj-ps.now { color: #1D5FD6; }
        .tj-ps.now i { border-color: #2F6BFF; color: #2F6BFF; background: #EAF2FF; }
        .tj-ps.bad { color: #D12626; }
        .tj-ps.bad i { border-color: #D12626; color: #D12626; background: #FFEDED; }
        .tj-pl { flex: 1; min-width: 8px; height: 2px; background: #C5D0E2; }
        .tj-pl.done { background: #17A34A; }
        .tj-view { flex-shrink: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 14px; border: 0; border-radius: 14px; background: #E8F1FF; color: #1D5FD6; font-size: 15.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .tj-view .tj-i { width: 18px; height: 18px; stroke-width: 2.6; }
        .tj-view:active { transform: scale(0.98); }
        .tj-menu { display: flex; flex-direction: column; gap: 10px; }
        .tj-menu .tj-btn { min-height: 56px; }

        @media (max-width: 400px) {
            .tj-thumb { width: 92px; }
            .tj-place .tj-flag { width: 24px; height: 17px; }
            .tj-place b { font-size: 15px; }
            .tj-dots { display: none; }
            .tj-ps .lb { display: none; }
            .tj-ps:last-child .lb { display: inline; }
            .tj-view { padding: 0 12px; font-size: 15px; }
        }
        @media (max-width: 359px) {
            .tj-thumb { display: none; }
            .tj-t__foot { flex-wrap: wrap; }
            .tj-view { width: 100%; justify-content: center; }
            .tj-sec__h h2 { font-size: 20px; }
        }

        /* ---- empty / loading ---- */
        .tj-empty { margin-top: 16px; padding: 8px 14px 16px; background: #fff; border-radius: 28px; box-shadow: 0 8px 26px rgba(11, 29, 58, 0.06); text-align: center; }
        .tj-art { position: relative; height: 232px; margin: 0 -14px; overflow: hidden; border-radius: 28px 28px 0 0; }
        .tj-art__bg { position: absolute; inset: 0; background: url("im/sengp-trips-empty.webp") center 30% / cover no-repeat; opacity: 0.55; -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%); mask-image: linear-gradient(180deg, #000 55%, transparent 100%); }
        .tj-art__bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #fff 0%, rgba(255, 255, 255, 0) 22%, rgba(255, 255, 255, 0) 78%, #fff 100%); }
        .tj-art img { position: absolute; left: 50%; bottom: 6px; width: 46%; max-width: 190px; height: auto; transform: translateX(-50%); filter: drop-shadow(0 12px 14px rgba(11, 29, 58, 0.22)); }
        .tj-art svg { position: absolute; left: 14%; top: 14px; width: 24%; max-width: 100px; height: auto; overflow: visible; }
        .tj-empty h2 { margin-top: 2px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
        .tj-empty > p { margin: 8px auto 0; max-width: 320px; font-size: 16px; line-height: 1.45; color: var(--tj-muted); }
        .tj-cta { margin: 16px auto 0; min-height: 60px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 34px; border: 0; border-radius: 999px; background: linear-gradient(90deg, #0A84FF, #6D4AF5); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; box-shadow: 0 12px 26px rgba(79, 70, 229, 0.32); }
        .tj-cta .tj-i { width: 24px; height: 24px; stroke-width: 2.6; }
        .tj-cta:active { transform: scale(0.985); }
        .tj-tip { margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 14px; border: 0; border-radius: 20px; background: #FFF4E4; text-align: left; color: inherit; cursor: pointer; }
        .tj-tip > .tj-i:first-child { width: 36px; height: 36px; color: #F59E0B; padding-right: 12px; box-sizing: content-box; border-right: 1px solid #F3DDB8; }
        .tj-tip b { display: block; font-size: 17px; font-weight: 800; color: #E8780C; }
        .tj-tip p { margin-top: 2px; font-size: 15px; line-height: 1.4; color: #5B4B33; }
        .tj-tip > .tj-i:last-child { margin-left: auto; width: 22px; height: 22px; color: #6B7A93; }
        .tj-loading { margin-top: 30px; text-align: center; color: var(--tj-muted); font-size: 16px; }
        .tj-loading i { display: block; width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%; border: 4px solid #D9E4F5; border-top-color: #2F6BFF; animation: tjSpin 0.9s linear infinite; }
        @keyframes tjSpin { to { transform: rotate(360deg); } }
        @keyframes tjIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        /* ---- bottom nav ---- */
        .tj-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 6px 4px env(safe-area-inset-bottom, 0px); display: flex; gap: 2px; background: rgba(255, 255, 255, 0.97); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid #E3EAF3; box-shadow: 0 -8px 24px rgba(11, 29, 58, 0.06); }
        .tj-nav__item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 18px; background: none; color: var(--tj-muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .tj-nav__item[aria-current="page"] { background: #FFF1DE; color: #E8780C; font-weight: 700; }
        .tj-nav__icon { position: relative; display: flex; }
        .tj-nav__icon .tj-i { width: 26px; height: 26px; }
        .tj-nav .bell-badge { position: absolute; top: -6px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #EF4444; border: 2px solid #fff; color: #fff; font-size: 10.5px; font-weight: 800; line-height: 14px; text-align: center; }
        .tj-nav .bell-badge.hidden { display: none; }
        .lbl-short { display: none; }
        @media (max-width: 460px) { .lbl-long { display: none; } .lbl-short { display: inline; } }

        /* ---- detail sheet ---- */
        .tj-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: flex-end; justify-content: center; background: rgba(7, 20, 47, 0.52); opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
        .tj-overlay.show { opacity: 1; pointer-events: auto; }
        .tj-sheet { width: 100%; max-width: 480px; max-height: 86dvh; display: flex; flex-direction: column; background: #F4F8FD; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(7, 20, 47, 0.25); transform: translateY(100%); transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
        .tj-overlay.show .tj-sheet { transform: none; }
        .tj-sheet__grab { padding: 10px 0 2px; display: flex; justify-content: center; }
        .tj-sheet__grab i { width: 44px; height: 5px; border-radius: 3px; background: #CBD4E3; }
        .tj-sheet__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px; }
        .tj-sheet__head h3 { font-size: 22px; font-weight: 800; }
        .tj-sheet__head p { margin-top: 2px; font-size: 14.5px; color: var(--tj-muted); }
        .tj-close { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #E6ECF5; color: var(--tj-navy); cursor: pointer; }
        .tj-close .tj-i { width: 20px; height: 20px; }
        .tj-sheet__body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 16px calc(22px + env(safe-area-inset-bottom, 0px)); }
        .tj-sheet__body .tj-card { box-shadow: none; animation: none; }

        .tj-back:focus-visible, .tj-add:focus-visible, .tj-tab:focus-visible, .tj-btn:focus-visible, .tj-cta:focus-visible, .tj-tip:focus-visible, .tj-nav__item:focus-visible, .tj-close:focus-visible { outline: 2px solid #2F6BFF; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { .tj-card, .tj-loading i { animation: none; } * { transition-duration: 0.01ms !important; } }

        /* PWA install banner (pwa.js): keep it compact */
        #sengp-install-banner { bottom: 8px !important; padding: 8px 12px !important; gap: 10px !important; font-size: 12px !important; line-height: 1.3 !important; border-radius: 14px !important; }
        #sengp-install-banner img { width: 34px !important; height: 34px !important; }
        #sengp-install-banner strong { font-size: 13px !important; }

        @media (max-width: 400px) {
            .tj-title h1 { font-size: 30px; }
            .tj-title p { font-size: 16.5px; }
            .tj-tab { flex-direction: column; gap: 4px; text-align: center; font-size: 14.5px; }
            .tj-tab .tj-i { width: 24px; height: 24px; }
            .tj-add { font-size: 14px; padding: 9px 12px 9px 9px; }
        }
        @media (max-width: 359px) {
            .tj-body { padding-left: 10px; padding-right: 10px; }
            .tj-title h1 { font-size: 27px; }

<body class="ds">
<div class="mobile-frame">

                <button type="button" class="tj-add" onclick="addTrip()" aria-label="Créer un trajet">

        <div class="tj-body">
            <div class="tj-tabs" role="tablist" aria-label="Catégories de trajets">
                <button type="button" class="tj-tab" id="tab-active" role="tab" aria-selected="true" onclick="switchTab('active')">
                    <svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                    <span>En cours<small id="cnt-active">(0)</small></span>

                <button type="button" class="tj-tab" id="tab-upcoming" role="tab" aria-selected="false" onclick="switchTab('upcoming')">

            <div class="tj-loading" id="tripsLoading"><i></i>Chargement de vos trajets…</div>

            <section class="tj-empty" id="tripsEmpty" style="display: none;">

                    <svg viewBox="0 0 100 70"><path d="M8 62C0 40 14 24 34 26" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/><path d="M96 4 44 22l17 7 6 17z" fill="#2F8BFF"/><path d="M96 4 61 29l6 17" fill="#1E6FE0"/></svg>
                    <img src="im/sengp-suitcase.webp" alt="" width="420" height="386">

                <button type="button" class="tj-cta" id="emptyCta" onclick="addTrip()"><svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span id="emptyCtaLabel">Créer un trajet</span></button>
                <button type="button" class="tj-tip" id="emptyTip" onclick="addTrip()">
                    <svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                    <span><b>Conseil</b><p>Créez un trajet dès maintenant pour voir les missions disponibles sur votre itinéraire.</p></span>
                    <svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>

    </div>

    <!-- Bottom navigation -->
    <nav class="tj-nav" aria-label="Navigation principale">

        </button>
        <button type="button" class="tj-nav__item" onclick="navigateTo('notifications')">
            <span class="tj-nav__icon"><svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-badge hidden" id="notifNavBadge">0</span></span><span class="lbl-long">Notifications</span><span class="lbl-short">Notifs</span>

    <!-- Bottom sheet : détail d'un trajet -->
    <div class="tj-overlay" id="sheetOverlay" onclick="if (event.target === this) closeSheet()">
        <div class="tj-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="tj-sheet__grab"><i></i></div>
            <div class="tj-sheet__head">
                <div><h3 id="sheetTitle">Détails du trajet</h3><p id="sheetSub"></p></div>
                <button type="button" class="tj-close" onclick="closeSheet()" aria-label="Fermer"><svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>

</div>
    <script>
        const API_BASE_URL = window.API_BASE_URL;
        const authToken = localStorage.getItem('authToken');
        const $ = id => document.getElementById(id);

        let allTrips = [];
        let currentBucket = 'active';
        let loadFailed = false;

        const BUCKETS = {
            active: ['active'],
            upcoming: ['published', 'draft'],
            completed: ['completed', 'cancelled']
        };
        const EMPTY_TEXT = {
            active: 'Vous n\'avez pas encore de trajet en cours.',
            upcoming: 'Vous n\'avez pas encore de trajet à venir.',
            completed: 'Vous n\'avez pas encore de trajet terminé.'
        };

        // Drapeaux en SVG (les emoji drapeaux ne s'affichent pas sous Windows)
        const FLAGS = {
            'Sénégal': '<rect width="10" height="20" fill="#00853F"/><rect x="10" width="10" height="20" fill="#FDEF42"/><rect x="20" width="10" height="20" fill="#E31B23"/><path d="m15 6.5 1.2 3.6h3.8l-3.1 2.2 1.2 3.6-3.1-2.2-3.1 2.2 1.2-3.6L10 10.1h3.8z" fill="#00853F"/>',
            'France': '<rect width="10" height="20" fill="#0055A4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#EF4135"/>',
            'Espagne': '<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>',
            'Italie': '<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE2B37"/>',
            'USA': '<rect width="30" height="20" fill="#fff"/><g fill="#B22234"><rect width="30" height="1.6"/><rect y="3.1" width="30" height="1.6"/><rect y="6.2" width="30" height="1.6"/><rect y="9.2" width="30" height="1.6"/><rect y="12.3" width="30" height="1.6"/><rect y="15.4" width="30" height="1.6"/><rect y="18.4" width="30" height="1.6"/></g><rect width="13" height="10.8" fill="#3C3B6E"/>',
            'Canada': '<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#D52B1E"/><rect x="22.5" width="7.5" height="20" fill="#D52B1E"/><path d="m15 4 1.6 3.2 2.2-.8-.8 4 1.6-.4-3.4 4 .2 1.6h-3l.2-1.6-3.4-4 1.6.4-.8-4 2.2.8z" fill="#D52B1E"/>',
            'Turquie': '<rect width="30" height="20" fill="#E30A17"/><circle cx="11.5" cy="10" r="5" fill="#fff"/><circle cx="12.9" cy="10" r="4" fill="#E30A17"/><path d="m17.5 7.8.7 2h2.1l-1.7 1.2.7 2-1.8-1.3-1.8 1.3.7-2-1.7-1.2h2.1z" fill="#fff"/>',
            'Algérie': '<rect width="15" height="20" fill="#006233"/><rect x="15" width="15" height="20" fill="#fff"/><circle cx="15.4" cy="10" r="4.6" fill="#D21034"/><circle cx="16.6" cy="10" r="3.8" fill="#fff"/><path d="m17.8 8.2.6 1.7h1.8l-1.5 1.1.6 1.7-1.5-1.1-1.5 1.1.6-1.7-1.5-1.1h1.8z" fill="#D21034"/>'
        };
        const FLAG_ALIAS = { 'Senegal': 'Sénégal', 'États-Unis': 'USA', 'Etats-Unis': 'USA' };
        const GLOBE = '<rect width="30" height="20" fill="#DCE8FB"/><circle cx="15" cy="10" r="6" fill="none" stroke="#2F6BFF" stroke-width="1.4"/><path d="M9 10h12M15 4c2.5 3 2.5 9 0 12M15 4c-2.5 3-2.5 9 0 12" fill="none" stroke="#2F6BFF" stroke-width="1.1"/>';
        function flagFor(c) {
            const k = FLAG_ALIAS[c] || c;
            return '<span class="tj-flag"><svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + (FLAGS[k] || GLOBE) + '</svg></span>';
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function formatDateTime(d) {
            if (!d) return '—';
            try {
                const dt = new Date(d);
                if (isNaN(dt)) return '—';
                return dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ', ' +
                       dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { return '—'; }
        }
        function statusMeta(s) {
            switch (s) {
                case 'active': return { label: 'En cours', acc: '#F7931E', bg: '#FFE9D2', fg: '#C86A00' };
                case 'published': return { label: 'Ouvert', acc: '#2F6BFF', bg: '#DDEBFF', fg: '#1D5FD6' };
                case 'draft': return { label: 'Brouillon', acc: '#94A3B8', bg: '#EDF1F6', fg: '#64748B' };
                case 'completed': return { label: 'Terminé', acc: '#17A34A', bg: '#D9F5E6', fg: '#13803F' };
                case 'cancelled': return { label: 'Annulé', acc: '#94A3B8', bg: '#EDF1F6', fg: '#64748B' };
                default: return { label: s || '—', acc: '#94A3B8', bg: '#EDF1F6', fg: '#64748B' };
            }
        }

        function goBack() { window.location.href = 'dashgp.html'; }
        function addTrip() { window.location.href = 'creetrajet.html'; }

        async function loadTrips() {
            if (!authToken) {
                alert('Vous devez vous connecter pour accéder à cette page');
                window.location.href = 'connexion.html';
                return;
            }
            loadFailed = false;
            $('tripsLoading').style.display = '';
            $('tripsEmpty').style.display = 'none';
            try {
                const res = await fetch(`${API_BASE_URL}/trips/my-trips?limit=100`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error('Échec du chargement');
                allTrips = (await res.json()).data || [];
                $('tripsLoading').style.display = 'none';
                updateTabCounts();
                // Sélectionner par défaut le premier onglet non vide.
                const firstNonEmpty = ['active', 'upcoming', 'completed'].find(b => bucketTrips(b).length > 0);
                if (firstNonEmpty) currentBucket = firstNonEmpty;
            } catch (e) {
                console.error('Erreur chargement trajets:', e);
                loadFailed = true;
                $('tripsLoading').style.display = 'none';
            }
            renderTabs();
            renderTrips();
        }

        function bucketTrips(bucket) {
            const statuses = BUCKETS[bucket] || [];
            return allTrips.filter(t => statuses.includes(t.status));
        }

        function updateTabCounts() {
            ['active', 'upcoming', 'completed'].forEach(b => { $('cnt-' + b).textContent = `(${bucketTrips(b).length})`; });
        }

        function renderTabs() {
            ['active', 'upcoming', 'completed'].forEach(b => $('tab-' + b).setAttribute('aria-selected', String(b === currentBucket)));
        }

        function tripCard(t, i, inSheet) {
            const st = statusMeta(t.status);
            const cap = `${t.current_packages || 0}/${t.max_packages || 0} colis`;
            const isOpen = t.status === 'published' || t.status === 'draft';
            const buttons = inSheet ? '' : `
                <div class="tj-actions">
                    <button type="button" class="tj-btn tj-btn--ghost" onclick="viewTripDetails('${esc(t.id)}')">Détails</button>
                    <button type="button" class="tj-btn tj-btn--main" onclick="navigateTo('missions')">${isOpen ? 'Chercher colis' : 'Voir missions'}</button>
                </div>`;
            return `
            <article class="tj-card" style="--i:${Math.min(i || 0, 8)};--tj-acc:${st.acc};--tj-chipbg:${st.bg};--tj-chipfg:${st.fg}">
                <div class="tj-card__top"><span class="tj-chip">${st.label}</span><span class="tj-code">${esc(t.trip_code || '')}</span></div>
                <div class="tj-route">
                    <div class="tj-city"><b>${esc(t.departure_city || '—')}</b><span>${flagFor(t.departure_country)}${esc(t.departure_country || '')}</span></div>
                    <div class="tj-path"><svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
                    <div class="tj-city"><b>${esc(t.arrival_city || '—')}</b><span>${flagFor(t.arrival_country)}${esc(t.arrival_country || '')}</span></div>
                </div>
                <div class="tj-facts">
                    <div class="tj-fact"><small>Départ</small><b>${formatDateTime(t.departure_date)}</b></div>
                    <div class="tj-fact"><small>Arrivée</small><b>${formatDateTime(t.arrival_date)}</b></div>
                    <div class="tj-fact"><small>Capacité</small><b>${parseFloat(t.available_weight) || 0} kg</b></div>
                    <div class="tj-fact"><small>Colis acceptés</small><b>${cap}</b></div>
                </div>${buttons}
            </article>`;
        }

        // ---------- liste par sections ----------
        const SECTIONS = [
            { key: 'active', title: 'Trajets en cours', none: 'Aucun trajet en cours.' },
            { key: 'upcoming', title: 'Trajets à venir', none: 'Aucun trajet à venir.' },
            { key: 'completed', title: 'Trajets terminés', none: 'Aucun trajet terminé.' }
        ];
        const expanded = { active: false, upcoming: false, completed: false };
        const PREVIEW = 2;
        const THUMBS = ['im/sengp-trip-thumb1.webp', 'im/sengp-trip-thumb2.webp', 'im/sengp-trip-thumb3.webp'];
        function thumbFor(t) {
            const k = String(t.arrival_city || t.arrival_country || '');
            let h = 0;
            for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
            return THUMBS[h % THUMBS.length];
        }
        const BADGE_SOLID = {
            active: ['#2F6BFF', '#fff'], published: ['#FFF1CF', '#9A6200'], draft: ['#EDF1F6', '#475569'],
            completed: ['#17A34A', '#fff'], cancelled: ['#EDF1F6', '#475569']
        };
        const SVG = {
            cal: '<svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
            bag: '<svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l2 13H4z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
            plane: '<svg class="tj-i plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>',
            arrow: '<svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
            chev: '<svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
            dots: '<svg class="tj-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/></svg>',
            check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
            x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
            pl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>'
        };

        // Billet ✓ → Détails ✓ → état du trajet
        function progressHTML(status) {
            const step = (cls, icon, label) => '<span class="tj-ps ' + cls + '"><i>' + icon + '</i><span class="lb">' + label + '</span></span>';
            const line = done => '<span class="tj-pl' + (done ? ' done' : '') + '"></span>';
            const detailsDone = status !== 'draft';
            let third;
            if (status === 'active') third = step('now', SVG.pl, 'Actif');
            else if (status === 'completed') third = step('done', SVG.check, 'Terminé');
            else if (status === 'cancelled') third = step('bad', SVG.x, 'Annulé');
            else third = step('', SVG.pl, 'En attente');
            return step('done', SVG.check, 'Billet') + line(true) +
                   step(detailsDone ? 'done' : '', detailsDone ? SVG.check : '', 'Détails') + line(detailsDone) + third;
        }

        function dateParts(d) {
            const dt = d ? new Date(d) : null;
            if (!dt || isNaN(dt)) return { day: '—', time: '' };
            return {
                day: dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }),
                time: dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
            };
        }

        function tripRow(t, i) {
            const st = statusMeta(t.status);
            const bs = BADGE_SOLID[t.status] || ['#EDF1F6', '#475569'];
            const dp = dateParts(t.departure_date);
            const id = esc(t.id);
            const place = (city, country) => '<div class="tj-place">' + flagFor(country) + '<span><b>' + esc(city || '—') + '</b><small>' + esc(country || '') + '</small></span></div>';
            return '<article class="tj-t" style="--i:' + Math.min(i, 8) + ';--tj-chipbg-solid:' + bs[0] + ';--tj-chipfg-solid:' + bs[1] + '">' +
                '<div class="tj-t__main">' +
                    '<div class="tj-thumb" style="background-image:url(' + thumbFor(t) + ')"><span class="tj-badge">' + st.label + '</span></div>' +
                    '<div class="tj-t__info">' +
                        '<div class="tj-t__route">' + place(t.departure_city, t.departure_country) + SVG.plane + place(t.arrival_city, t.arrival_country) +
                            '<button type="button" class="tj-dots" onclick="openTripMenu(\'' + id + '\')" aria-label="Plus d\'actions">' + SVG.dots + '</button></div>' +
                        '<div class="tj-t__meta">' +
                            '<div class="tj-mi">' + SVG.cal + '<span><b>' + dp.day + '</b><small>' + dp.time + '</small></span></div>' +
                            '<div class="tj-mi">' + SVG.bag + '<span><b>' + (parseFloat(t.available_weight) || 0) + ' kg</b><small>disponible</small></span></div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="tj-t__foot"><div class="tj-prog">' + progressHTML(t.status) + '</div>' +
                    '<button type="button" class="tj-view" onclick="viewTripDetails(\'' + id + '\')">Voir détails' + SVG.chev + '</button></div>' +
            '</article>';
        }

        function renderTrips() {
            const container = $('tripsList');
            const empty = $('tripsEmpty');
            if (loadFailed || allTrips.length === 0) {
                container.innerHTML = '';
                if (loadFailed) {
                    $('emptyTitle').textContent = 'Impossible de charger vos trajets';
                    $('emptyText').textContent = 'Vérifiez votre connexion puis réessayez.';
                    $('emptyCtaLabel').textContent = 'Réessayer';
                    $('emptyCta').onclick = loadTrips;
                    $('emptyTip').style.display = 'none';
                } else {
                    $('emptyTitle').textContent = 'Aucun trajet dans cette catégorie';
                    $('emptyText').textContent = EMPTY_TEXT[currentBucket] + ' Créez un trajet pour commencer à recevoir des missions.';
                    $('emptyCtaLabel').textContent = 'Créer un trajet';
                    $('emptyCta').onclick = addTrip;
                    $('emptyTip').style.display = '';
                }
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            container.innerHTML = SECTIONS.map(sec => {
                const list = bucketTrips(sec.key);
                const shown = expanded[sec.key] ? list : list.slice(0, PREVIEW);
                const more = list.length > PREVIEW
                    ? '<button type="button" class="tj-more" onclick="toggleSection(\'' + sec.key + '\')">' + (expanded[sec.key] ? 'Réduire' : 'Voir tout') + SVG.chev + '</button>' : '';
                return '<section class="tj-sec" id="sec-' + sec.key + '"><div class="tj-sec__h"><h2>' + sec.title + '</h2>' + more + '</div>' +
                    '<div class="tj-sec__list">' + (shown.length ? shown.map(tripRow).join('') : '<div class="tj-none">' + sec.none + '</div>') + '</div></section>';
            }).join('');
        }

        function toggleSection(key) {
            expanded[key] = !expanded[key];
            renderTrips();
        }

        // Les onglets font défiler jusqu'à leur section ; le défilement met l'onglet à jour.
        let spyLock = false;
        function switchTab(bucket) {
            currentBucket = bucket;
            renderTabs();
            if (allTrips.length === 0) { renderTrips(); return; }
            const sec = $('sec-' + bucket), sc = $('scroller');
            if (!sec) return;
            spyLock = true;
            const top = sec.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 12;
            sc.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            setTimeout(() => { spyLock = false; }, 800);
        }
        (function spy() {
            let raf = 0;
            $('scroller').addEventListener('scroll', () => {
                if (spyLock || raf) return;
                raf = requestAnimationFrame(() => {
                    raf = 0;
                    const sc = $('scroller');
                    if (sc.scrollTop < 24 || allTrips.length === 0) return;
                    const line = sc.getBoundingClientRect().top + 200;
                    let cur = null;
                    SECTIONS.forEach(s => { const el = $('sec-' + s.key); if (el && el.getBoundingClientRect().top <= line) cur = s.key; });
                    if (cur && cur !== currentBucket) { currentBucket = cur; renderTabs(); }
                });
            }, { passive: true });
        })();

        // Menu « … » : actions rapides sur un trajet
        function openTripMenu(tripId) {
            const t = allTrips.find(x => String(x.id) === String(tripId));
            if (!t) return;
            const open = t.status === 'published' || t.status === 'draft';
            $('sheetTitle').textContent = (t.departure_city || '—') + ' → ' + (t.arrival_city || '—');
            $('sheetSub').textContent = t.trip_code || '';
            $('sheetBody').innerHTML = '<div class="tj-menu">' +
                '<button type="button" class="tj-btn tj-btn--ghost" onclick="viewTripDetails(\'' + esc(t.id) + '\')">Voir les détails</button>' +
                '<button type="button" class="tj-btn tj-btn--main" onclick="closeSheet();navigateTo(\'missions\')">' + (open ? 'Chercher des colis' : 'Voir les missions') + '</button></div>';
            $('sheetOverlay').classList.add('show');
            $('scroller').classList.add('is-locked');
        }

        function viewTripDetails(tripId) {
            const t = allTrips.find(x => String(x.id) === String(tripId));
            if (!t) return;
            $('sheetTitle').textContent = 'Détails du trajet';
            $('sheetSub').textContent = t.trip_code || '';
            $('sheetBody').innerHTML = tripCard(t, 0, true) +
                `<div class="tj-actions" style="grid-template-columns:1fr;margin-top:12px"><button type="button" class="tj-btn tj-btn--main" onclick="closeSheet();navigateTo('missions')">${(t.status === 'published' || t.status === 'draft') ? 'Chercher colis' : 'Voir missions'}</button></div>`;
            $('sheetOverlay').classList.add('show');
            $('scroller').classList.add('is-locked');
        }
        function closeSheet() {
            $('sheetOverlay').classList.remove('show');
            $('scroller').classList.remove('is-locked');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

        // Pastille de notifications non lues sur l'onglet Notifs. Best-effort.
        async function loadUnreadNotifCount() {
            try {
                const r = await fetch(`${API_BASE_URL}/notifications/my-notifications?limit=100`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!r.ok) return;
                const unread = ((await r.json()).data || []).filter(n => !n.is_read).length;
                const b = $('notifNavBadge');
                if (unread > 0) { b.textContent = unread > 99 ? '99+' : unread; b.classList.remove('hidden'); }
                else b.classList.add('hidden');
            } catch (e) {}
        }

        function navigateTo(section) {
            const pages = {
                'home': 'dashgp.html',
                'missions': 'missions.html',
                'trips': 'trajets.html',
                'earnings': 'gains.html',
                'notifications': 'notifications.html',
                'profile': 'profilegp.html'
            };
            if (pages[section] && section !== 'trips') window.location.href = pages[section];
        }

        document.addEventListener('DOMContentLoaded', () => { loadTrips(); loadUnreadNotifCount(); });
    </script>
    <script src="ptr.js"></script>
</body>
</html>
